title:
  vi: Báo cáo bảo mật tháng 11/2026
  ja: 2026年11月 セキュリティレポート
description:
  vi: 'Tổng hợp các rủi ro, lỗ hổng bảo mật và việc cần làm tháng 11/2026: Lỗ hổng thoát sandbox Chrome (CVE-2026-134401), đợt phát hành bảo mật PostgreSQL với 52 CVEs (CVE-2026-6460 RCE, PostgreSQL 14 EOL), Apache HTTP Server RCE (CVE-2026-119618), Visual Studio Code RCE (CVE-2026-120779), Zero-Day Google Chrome (CVE-2026-125350), Microsoft Patch Tuesday cho .NET & Visual Studio, Apache Tomcat, Next.js, Linux kernel TCP UAF, nghiên cứu RCE engine cơ sở dữ liệu (PostgreSQL, MySQL, Oracle, ClickHouse), cảnh báo FBI FLASH-20261113-001 về AI agent tấn công ARTEX và tổng hợp sự cố/xâm nhập giữa tháng 11 (RIKEN Fugaku, Equinor, Microsoft 365, FAA, Chase, NSANet).'
  ja: '2026年11月のリスク、脆弱性、対応事項のまとめ：Google Chrome サンドボックス脱出脆弱性（CVE-2026-134401）、PostgreSQL 52件の脆弱性修正（型混乱RCE CVE-2026-6460、PostgreSQL 14 EOL）、Apache HTTP Server RCE（CVE-2026-119618）、Visual Studio Code RCE（CVE-2026-120779）、Google Chrome ゼロデイ（CVE-2026-125350）、Microsoft Patch Tuesday（.NET & Visual Studio）、Apache Tomcat、Next.js、Linux kernel TCP UAF、データベースエンジン RCE 研究（PostgreSQL、MySQL、Oracle、ClickHouse）、FBI FLASH-20261113-001（AI攻撃エージェント ARTEX）および11月中旬の障害・侵入事案（RIKEN富岳・Equinor・Microsoft 365・FAA・Chase・NSANet）。'
