      vi: '<strong>CVE-2026-134401</strong> (Critical, CVSS 9.6 CISA-ADP, CWE-20 ở <em>Variations</em>): thực thi mã ngoài sandbox qua HTML độc hại; nối tiếp Chrome 158 (204 lỗi) và zero-day <strong>CVE-2026-125350</strong> (XML).'
      ja: '<strong>CVE-2026-134401</strong>（Critical、CVSS 9.6 CISA-ADP、<em>Variations</em> の CWE-20）：不正 HTML でサンドボックス外コード実行の恐れ。Chrome 158（204件）およびゼロデイ <strong>CVE-2026-125350</strong> に続く修正。'
