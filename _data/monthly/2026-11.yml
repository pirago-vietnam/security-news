title:
  vi: Báo cáo bảo mật tháng 11/2026
  ja: 2026年11月 セキュリティレポート
description:
  vi: 'Tổng hợp các rủi ro, lỗ hổng bảo mật và việc cần làm tháng 11/2026: Apache HTTP Server RCE (CVE-2026-119618), Visual Studio Code RCE (CVE-2026-120779), Zero-Day Google Chrome (CVE-2026-125350), Microsoft Patch Tuesday cho .NET & Visual Studio, Apache Tomcat, Next.js, Linux kernel TCP UAF, và an toàn chuỗi cung ứng AI agent.'
  ja: '2026年11月のリスク、脆弱性、対応事項のまとめ：Apache HTTP Server RCE（CVE-2026-119618）、Visual Studio Code RCE（CVE-2026-120779）、Google Chrome ゼロデイ（CVE-2026-125350）、Microsoft Patch Tuesday（.NET & Visual Studio）、Apache Tomcat、Next.js、Linux kernel TCP UAF、およびAIエージェントのサプライチェーンセキュリティ。'
nav:
  vi: Tháng 11/2026
  ja: 2026年11月
footer_label:
  vi: Báo cáo tháng 11/2026
