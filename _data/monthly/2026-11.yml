ai-shirudo/" target="_blank" rel="noopener noreferrer">Cisco / Isovalent: Shirudo</a> · <a href="https://github.com/shirudo-dev/shirudo" target="_blank" rel="noopener noreferrer">GitHub: shirudo-dev/shirudo</a> · <a href="https://safeguard.sh/resources/blog/java-malware-today" target="_blank" rel="noopener noreferrer">Safeguard: Java Malware Today (25 Nov 2026)</a> · <a href="https://osv.dev/vulnerability/MAL-2025-2552" target="_blank" rel="noopener noreferrer">OSV MAL-2025-2552</a> · <a href="https://osv.dev/vulnerability/MAL-2025-191470" target="_blank" rel="noopener noreferrer">OSV MAL-2025-191470</a> · <a href="https://github.com/advisories?query=type%3Amalware+ecosystem%3Amaven" target="_blank" rel="noopener noreferrer">GitHub Maven Malware Advisories</a>.'
