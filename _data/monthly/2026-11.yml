sub:
  vi: 'Số liệu tính đến <strong>2026-11-11</strong> (cập nhật theo đợt phát hành Patch Tuesday tháng 11/2026 của Microsoft).'
  ja: '<strong>2026年11月11日</strong>時点の情報です（Microsoft 2026年11月 Patch Tuesday セキュリティリリースに対応）。'
