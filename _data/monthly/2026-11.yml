      vi: 'Chrome &lt; <code>158.0.8127.88</code> (Ext &lt; <code>156.0.8078.114</code>), nhân Chromium (Brave đã vá <code>v1.100.59</code>; Edge chờ vá) và headless Chromium.'
      ja: 'Chrome <code>158.0.8127.88</code> 未満（Ext <code>156.0.8078.114</code> 未満）、Chromium 系（Brave <code>v1.100.59</code> 修正済み、Edge 待ち）、ヘッドレス環境。'
    fix:
      vi: 'Cập nhật lên <strong>158.0.8127.88/.89</strong> (Ext <strong>156.0.8078.114</strong>, Android <strong>158.0.8127.92</strong>) và <strong>Relaunch</strong>. Xem <a href="@home@featured/vulnerabilities/chrome-cve-2026-134401/analysis/">phân tích</a>.'
      ja: '<strong>158.0.8127.88/.89</strong>（Ext <strong>156.0.8078.114</strong>、Android <strong>158.0.8127.92</strong>）へ更新し <strong>Relaunch</strong>。<a href="@home@featured/vulnerabilities/chrome-cve-2026-134401/analysis/">分析</a>参照。'
  - name: npm &amp; PyPI (AI Coding Agent Supply Chain)
    sev: high
    summary:
      vi: 'Hơn 140 package độc hại giả mạo MCP server và công cụ AI coding, âm thầm đánh cắp file <code>.env</code>, khóa SSH và credentials AWS.'
      ja: 'MCP サーバーや AI 開発支援ツールを装う140件超の悪性パッケージを検知。<code>.env</code>、SSH 鍵、AWS 認証情報を窃取。'
    impact:
      vi: 'Máy trạm dùng AI coding assistant (Claude Code, Cursor, Copilot...) và môi trường dev/staging.'
      ja: 'AI コーディング支援ツール利用端末および開発・ステージング環境。'
    fix:
      vi: 'Khóa dependency bằng lockfile (<code>npm ci</code>); rà soát nguồn MCP/package trước khi cài; dùng Socket.dev / Dependency Review.'
      ja: 'ロックファイル固定（<code>npm ci</code>）を徹底し、MCP・パッケージ導入前に出所監査や Socket.dev 等で検証。'
  - name: PHP Composer
    sev: high
    summary:
      vi: '<strong>CVE-2026-109620 (Critical)</strong>: Object Injection &amp; RCE trong một số package tiện ích phổ biến khi phân giải phụ thuộc và ghi cache.'
      ja: '<strong>CVE-2026-109620（Critical）</strong>：主要ユーティリティパッケージの依存解決・キャッシュ生成時におけるオブジェクト注入および RCE。'
    impact:
      vi: 'Ứng dụng PHP và CI/CD chạy <code>composer install/update</code> với các package bị ảnh hưởng.'
      ja: '影響パッケージを含み <code>composer install/update</code> を実行する PHP アプリ・CI/CD。'
    fix:
      vi: 'Chạy <code>composer audit</code> để rà soát và nâng cấp các package bị cảnh báo lên bản mới nhất.'
      ja: '<code>composer audit</code> で監査し、警告対象パッケージを最新版へ更新。'
  - name: Maven &amp; Gradle (Java Supply Chain)
    sev: med
    summary:
      vi: 'Theo thống kê ngày 25-11-2026 (18:10 UTC) từ GitHub Advisories, OSV và OpenSSF <code>malicious-packages</code>, hiện có 2 gói Maven độc hại công khai (đều từ 2025, import vào GitHub 07-2026): <code>io.github.leetcrunch:scribejava-core</code> (<code>MAL-2025-2552</code> / <code>GHSA-9c6j-xrpw-g32x</code>, typosquat <code>com.github.scribejava:scribejava-core</code>, đặt version 8.3.5 cao hơn bản thật 8.3.3, gửi trộm OAuth token vào ngày 15 hằng tháng) và <code>org.mvnpm:posthog-node</code> 4.18.1 (<code>MAL-2025-191470</code> / <code>GHSA-5f38-2pgv-jhg6</code>, sâu npm Sha1-Hulud phát hành lại qua <code>mvnpm</code>, đánh cắp token lên GitHub &amp; cài persistence GitHub Actions). Số lượng feed thấp không đồng nghĩa an toàn: mã độc Java thường chạy lúc build qua Maven/Gradle plugin (<code>./gradlew help</code> đã chạy plugin ở pha cấu hình), annotation processor (trước JDK 23 hoặc khi bật <code>-proc:full</code>), test, dependency confusion theo thứ tự repository và namespace giả dạng <code>io.github.&lt;user&gt;</code>.'
      ja: '2026年11月25日（18:10 UTC）時点の GitHub Advisories・OSV・OpenSSF <code>malicious-packages</code> 集計では公開済みの悪性 Maven パッケージは2件（いずれも2025年発生、2026年7月 GitHub 取込）：<code>io.github.leetcrunch:scribejava-core</code>（<code>MAL-2025-2552</code> / <code>GHSA-9c6j-xrpw-g32x</code>、<code>com.github.scribejava:scribejava-core</code> のタイポスクワット、正規版 8.3.3 より大きい 8.3.5 を名乗り毎月15日に OAuth 認証情報を窃取）と <code>org.mvnpm:posthog-node</code> 4.18.1（<code>MAL-2025-191470</code> / <code>GHSA-5f38-2pgv-jhg6</code>、<code>mvnpm</code> 経由で再公開された npm ワーム Sha1-Hulud、GitHub へトークン流出・GitHub Actions 永続化）。公開件数が少ない＝安全ではなく、Maven/Gradle プラグイン（<code>./gradlew help</code> でも設定フェーズで実行）、アノテーションプロセッサ（JDK 23 未満や <code>-proc:full</code>）、テスト、リポジトリ順による依存関係混乱、<code>io.github.&lt;user&gt;</code> 類似名前空間が主な攻撃面となります。'
    impact:
      vi: 'Các dự án Java / Spring Boot dùng Maven hoặc Gradle, máy trạm dev và CI/CD runner (bao gồm cache <code>~/.m2/repository</code> và <code>~/.gradle/caches</code>).'
      ja: 'Maven・Gradle を用いる Java / Spring Boot プロジェクト、開発端末、CI/CD ランナー（<code>~/.m2/repository</code> や <code>~/.gradle/caches</code> を含む）。'
    fix:
      vi: 'Kiểm tra cây phụ thuộc &amp; cache (<code>mvn -q dependency:tree -Dincludes=io.github.leetcrunch</code>, <code>mvn -q dependency:tree -Dincludes=org.mvnpm:posthog-node</code>, <code>./gradlew buildEnvironment</code>); quét bằng <code>osv-scanner scan source -r .</code> (quét được bản ghi <code>MAL-</code> mà máy quét CVE bỏ sót); bật kiểm tra checksum/PGP (<code>mvn -C verify</code>, <code>pgpverify-maven-plugin:check</code>, <code>./gradlew --write-verification-metadata pgp,sha256 --export-keys help</code>); gom về một repo manager (<code>mirrorOf *</code>), dùng <code>exclusiveContent</code> cho groupId nội bộ và khóa version (<code>gradle.lockfile</code>). Xem <a href="@home@featured/vulnerabilities/java-maven-supply-chain-2026-11/analysis/">phân tích chi tiết</a>.'
      ja: '依存木とローカル/CI キャッシュを点検（<code>mvn -q dependency:tree -Dincludes=io.github.leetcrunch</code>、<code>mvn -q dependency:tree -Dincludes=org.mvnpm:posthog-node</code>、<code>./gradlew buildEnvironment</code>）。CVE スキャナが見逃す <code>MAL-</code> 記録を含めて <code>osv-scanner scan source -r .</code> で走査。厳格なチェックサム・PGP・依存検証（<code>mvn -C verify</code>、<code>pgpverify-maven-plugin:check</code>、<code>./gradlew --write-verification-metadata pgp,sha256 --export-keys help</code>）を有効化し、<code>mirrorOf *</code> と <code>exclusiveContent</code> で内部 groupId を固定、<code>gradle.lockfile</code> でバージョンをロック。<a href="@home@featured/vulnerabilities/java-maven-supply-chain-2026-11/analysis/">詳細分析</a>を参照。'

- title:
    vi: 4. Hệ điều hành &amp; Ngôn ngữ lập trình (OS &amp; Languages)
    ja: 4. OSおよびプログラミング言語（OS &amp; Languages）
  type: component
  rows:
  - name: Linux kernel Net (Lockless Socket)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-99676</strong> (CVSS 9.8 CNA / 5.9 RH): lỗi thứ tự bộ nhớ refcount trong lockless socket lookup trên ARM64/POWER → Use-After-Free, panic/DoS hoặc nguy cơ RCE.'
      ja: '<strong>CVE-2026-99676</strong>（CVSS 9.8 CNA / 5.9 RH）：ARM64/POWER のロックレスソケット検索における refcount メモリ順序不備で UAF・パニック/DoS や RCE の恐れ。'
    impact:
      vi: 'Linux <strong>ARM64/Graviton &amp; POWER</strong> (kernel &ge; <code>5.5</code> / <code>5.4.208+</code>) mở TCP/UDP. x86-64 không bị ảnh hưởng.'
      ja: 'TCP/UDP を公開する <strong>ARM64/Graviton・POWER</strong>（<code>5.5+</code> / <code>5.4.208+</code>）。x86-64 は対象外。'
    fix:
      vi: 'Cập nhật kernel lên <strong>6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2</strong> (Debian <code>DSA-6652-1</code>) và reboot; tạm thời siết firewall cổng TCP/UDP. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">phân tích</a>.'
      ja: '<strong>6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2</strong>（Debian <code>DSA-6652-1</code>）へ更新・再起動、暫定で公開ポートを制限。<a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">分析</a>参照。'
  - name: Linux kernel NFSD (NFSv4.1+)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-99362</strong> (CVSS 9.8): ghi tràn <code>slab-out-of-bounds</code> trong <code>nfsd4_sequence()</code> khi slot cache độ dài 0 → panic/DoS hoặc nguy cơ RCE.'
      ja: '<strong>CVE-2026-99362</strong>（CVSS 9.8）：<code>nfsd4_sequence()</code> で長さ 0 スロットへの <code>slab-out-of-bounds</code> 書込。パニック/DoS や RCE の恐れ。'
    impact:
      vi: 'Linux kernel &ge; <code>3.16</code> bật <code>nfsd</code> NFSv4.1+ (cổng TCP/UDP 2049).'
      ja: 'NFSv4.1+ 有効で <code>nfsd</code> 稼働の Linux <code>3.16+</code>（TCP/UDP 2049番）。'
    fix:
      vi: 'Vá kernel <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong> (Debian <code>DLA-4927-1</code>) và reboot; tạm thời siết cổng 2049 hoặc tắt NFSv4.1+. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">phân tích</a>.'
      ja: '<strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong>（Debian <code>DLA-4927-1</code>）へ更新・再起動、暫定で2049番制限または NFSv4.1+ 無効化。<a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">分析</a>参照。'
  - name: Linux kernel KVM (AMD)
    sev: high
    summary:
      vi: '<strong>CVE-2026-99312</strong> (CVSS 8.8 CNA / 7.8 RH): Page-Table UAF khi mô phỏng <code>INIT</code> trên AMD SVM bật nested → guest thoát VM đọc/ghi RAM host.'
      ja: '<strong>CVE-2026-99312</strong>（CVSS 8.8 CNA / 7.8 RH）：nested 有効 AMD SVM の <code>INIT</code> 処理でページテーブル UAF、ゲストからホスト RAM 読書きの恐れ。'
    impact:
      vi: 'Hypervisor KVM CPU <strong>AMD</strong> bật <code>kvm_amd.nested=1</code> (kernel &ge; <code>5.15.81</code>, trừ 5.10/5.4 và Intel).'
      ja: '<code>kvm_amd.nested=1</code> の <strong>AMD</strong> KVM ホスト（<code>5.15.81+</code>、Intel・5.10/5.4 除外）。'
    fix:
      vi: 'Vá kernel host lên <strong>6.12.118 / 6.18.64 / 7.3.5+</strong> và reboot, hoặc tắt nested: <code>modprobe kvm_amd nested=0</code>. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99312/analysis/">phân tích</a>.'
      ja: '<strong>6.12.118 / 6.18.64 / 7.3.5+</strong> へ更新・再起動、または <code>modprobe kvm_amd nested=0</code> で無効化。<a href="@home@featured/vulnerabilities/linux-cve-2026-99312/analysis/">分析</a>参照。'
  - name: Linux kernel
    sev: high
    summary:
      vi: 'Theo dõi <strong>CVE-2026-98432</strong> (CVSS 9.8): UAF trong ngăn xếp IPv4 TCP khi xử lý IP options, nguy cơ RCE qua MPTCP handshake. AL2/AL2023 và Ubuntu đã có bản vá.'
      ja: '<strong>CVE-2026-98432</strong>（CVSS 9.8）：IPv4 TCP の IP オプション処理で UAF（MPTCP 経由の RCE 恐れ）。AL2/AL2023・Ubuntu は修正配布中。'
    impact:
      vi: 'Máy chủ Linux mở TCP ra internet, bật MPTCP (Go 1.24+ bật mặc định) hoặc đứng sau NLB TCP pass-through.'
      ja: 'TCP 公開 Linux、MPTCP 有効環境（Go 1.24+ 既定有効）、NLB TCP パススルー配下。'
    fix:
      vi: 'Cập nhật kernel mới nhất và reboot; tạm thời chặn IP options qua nftables/u32 hoặc tắt MPTCP (<code>net.mptcp.enabled=0</code>). Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-98432/analysis/">phân tích</a>.'
      ja: '最新カーネルへ更新・再起動。暫定で nftables/u32 遮断または <code>net.mptcp.enabled=0</code>。<a href="@home@featured/vulnerabilities/linux-cve-2026-98432/analysis/">分析</a>参照。'
  - name: .NET (gồm ASP.NET Core)
    sev: high
    summary:
      vi: '<strong>CVE-2026-118746</strong> (CVSS 6.8, bypass Unix Negotiate auth) và <strong>CVE-2026-114146 / 114147</strong> (EoP &amp; DoS trong middleware ASP.NET Core).'
      ja: '<strong>CVE-2026-118746</strong>（CVSS 6.8、Unix Negotiate 認証バイパス）および <strong>CVE-2026-114146 / 114147</strong>（ASP.NET Core EoP・DoS）。'
    impact:
      vi: 'Dịch vụ chạy .NET 8.0, 9.0, 10.0 trên Linux/Docker hoặc ASP.NET Core mở công khai.'
      ja: 'Linux/Docker 上の .NET 8.0/9.0/10.0 および公開 ASP.NET Core サービス。'
    fix:
      vi: 'Cập nhật .NET lên <strong>10.0.15 / 9.0.23 / 8.0.34</strong> (SDK 11.0.100+) và rebuild Docker container.'
      ja: '<strong>10.0.15 / 9.0.23 / 8.0.34</strong>（SDK 11.0.100+）へ更新し Docker を再ビルド。'
  - name: Node.js
    sev: med
    summary:
      vi: 'Duy trì bản vá <strong>26.12.1 / 24.22.1 / 22.23.4</strong> (sửa lỗi Brotli <a href="@home@featured/vulnerabilities/brotli-cve-2026-111497/analysis/">CVE-2026-111497</a> &amp; bypass TLS); tháng 11 không có lỗ hổng core mới.'
      ja: '<strong>26.12.1 / 24.22.1 / 22.23.4</strong>（Brotli <a href="@home@featured/vulnerabilities/brotli-cve-2026-111497/analysis/">CVE-2026-111497</a>・TLS 検証修正）を維持。11月のコア緊急修正なし。'
    impact:
      vi: 'Ứng dụng backend, API, SSR (Next.js, Nuxt) và CI/CD.'
      ja: 'バックエンド、API、SSR（Next.js、Nuxt）、CI/CD。'
    fix:
      vi: 'Chạy bản LTS được hỗ trợ, chạy định kỳ <code>npm audit</code> và khóa phiên bản bằng lockfile.'
      ja: 'サポート対象 LTS を維持し、定期的な <code>npm audit</code> とロックファイル固定を実施。'
  - name: PHP
    sev: high
    summary:
      vi: 'Đợt vá 19-11 sửa 17 CVE (gồm 7 lỗi CVSS 9.2 và <strong>CVE-2026-115560</strong>), nối tiếp khủng hoảng PHP2Shell (<strong>CVE-2026-109618/19</strong>).'
      ja: '11/19 リリースで17件（CVSS 9.2 が7件、<strong>CVE-2026-115560</strong> 等）を修正。PHP2Shell（<strong>CVE-2026-109618/19</strong>）に続く更新。'
    impact:
      vi: 'Mọi ứng dụng PHP (PHP-FPM, FrankenPHP, Laravel, WordPress); nhánh &le; 8.1 đã EOL không có bản vá.'
      ja: '全 PHP アプリ（PHP-FPM、FrankenPHP、Laravel、WordPress）。8.1 以前は EOL で修正なし。'
    fix:
      vi: 'Nâng lên <strong>8.5.13 / 8.4.28 / 8.3.37 / 8.2.36</strong> (hoặc 8.6.0), restart và đặt <code>session.upload_progress.enabled = 0</code>. Xem <a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">phân tích</a>.'
      ja: '<strong>8.5.13 / 8.4.28 / 8.3.37 / 8.2.36</strong>（または 8.6.0）へ更新・再起動し <code>session.upload_progress.enabled = 0</code> を設定。<a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">分析</a>参照。'

- title:
    vi: 5. Frameworks Web &amp; Hệ sinh thái Java (Frameworks &amp; Java Ecosystem)
    ja: 5. WebフレームワークおよびJavaエコシステム（Frameworks &amp; Java Ecosystem）
  type: component
  rows:
  - name: Next.js
    sev: high
    summary:
      vi: '<strong>GHSA-673q-mjm6-r5xr / CVE-2026-96889 (Critical)</strong>: RCE qua hàm <code>use cache</code> trả về TypedArray và lỗi xử lý SVG trong <code>sharp / librsvg</code>.'
      ja: '<strong>GHSA-673q-mjm6-r5xr / CVE-2026-96889（Critical）</strong>：App Router <code>use cache</code>（TypedArray）の RCE および <code>sharp / librsvg</code> の SVG 処理不備。'
    impact:
      vi: 'Ứng dụng Next.js dùng App Router, Server Components và Image Optimization.'
      ja: 'App Router・Server Components・Image Optimization を利用する Next.js。'
    fix:
      vi: 'Nâng cấp Next.js lên <strong>16.4.5</strong> hoặc <strong>15.5.29+</strong>.'
      ja: 'Next.js を <strong>16.4.5</strong> または <strong>15.5.29+</strong> へ更新。'
  - name: Nuxt
    sev: high
    summary:
      vi: '<strong>CVE-2026-119198 &amp; CVE-2026-119200</strong>: lộ file trên dev server qua HMR và bypass chuẩn hóa đường dẫn Nitro (<code>/%2e/admin</code>).'
      ja: '<strong>CVE-2026-119198・119200</strong>：HMR 経由の任意ファイル漏えいと Nitro パス正規化バイパス。'
    impact:
      vi: 'Ứng dụng chạy Nuxt 4 (dev, staging và production dùng Nitro).'
      ja: 'Nuxt 4（開発・ステージング・Nitro 本番環境）。'
    fix:
      vi: 'Nâng cấp lên <strong>4.6.3+</strong> (Nuxt 3 đã EOL, không có bản vá).'
      ja: '<strong>4.6.3+</strong> へ更新（Nuxt 3 は EOL で修正なし）。'
  - name: Laravel
    sev: med
    summary:
      vi: '<strong>CVE-2026-114509</strong>: lỗi TokenGuard cho phép giả danh người dùng không cần token hợp lệ khi MySQL/MariaDB so khớp không phân biệt hoa thường.'
      ja: '<strong>CVE-2026-114509</strong>：大文字小文字を区別しない MySQL/MariaDB で TokenGuard によるなりすましの恐れ。'
    impact:
      vi: 'Ứng dụng Laravel dùng API Token Authentication với MySQL / MariaDB.'
      ja: 'MySQL / MariaDB で API トークン認証を使用する Laravel。'
    fix:
      vi: 'Nâng cấp Laravel lên <strong>13.29.0+</strong> (hoặc <strong>12.68.0+</strong>).'
      ja: 'Laravel を <strong>13.29.0+</strong>（または <strong>12.68.0+</strong>）へ更新。'
  - name: Spring Security (ELRequestMatcher)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-59273 (CVSS 9.8)</strong>: <code>ELRequestMatcher</code> đánh giá SpEL không giới hạn; nếu bind input ngoài vào sẽ dẫn tới RCE chưa xác thực.'
      ja: '<strong>CVE-2026-59273（CVSS 9.8）</strong>：<code>ELRequestMatcher</code> が SpEL を無制限評価し、外部入力バインド時に未認証 RCE の恐れ。'
    impact:
      vi: 'Spring Security <strong>7.1.0–7.1.2</strong>, <strong>7.0.0–7.0.8</strong>, <strong>6.5.0–6.5.12</strong>, <strong>6.4.0–6.4.19</strong>, <strong>5.8.0–5.8.28</strong>, &le; <strong>5.7.26</strong>.'
      ja: 'Spring Security <strong>7.1.0〜7.1.2</strong>、<strong>7.0.0〜7.0.8</strong>、<strong>6.5/6.4/5.8/5.7系</strong>。'
    fix:
      vi: 'Nâng lên <strong>7.1.3 / 7.0.9 / 7.2.0</strong> (Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>). Xem <a href="@home@featured/vulnerabilities/spring-security-cve-2026-59273/analysis/">phân tích</a>.'
      ja: '<strong>7.1.3 / 7.0.9 / 7.2.0</strong>（Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>）へ更新。<a href="@home@featured/vulnerabilities/spring-security-cve-2026-59273/analysis/">分析</a>参照。'
  - name: Spring Boot &amp; Spring Framework
    sev: high
    summary:
      vi: '<strong>CVE-2026-40976 (CVSS 9.1)</strong>: bypass bảo mật Actuator mặc định; <strong>CVE-2026-41843</strong> (path traversal) và <strong>CVE-2026-59283</strong> (bypass SpEL).'
      ja: '<strong>CVE-2026-40976（CVSS 9.1）</strong>：Actuator 認証バイパス、<strong>CVE-2026-41843</strong>（パストラバーサル）、<strong>CVE-2026-59283</strong>（SpEL バイパス）。'
    impact:
      vi: 'Ứng dụng Spring Boot servlet và Spring MVC / WebFlux.'
      ja: 'Spring Boot（Servlet）および Spring MVC / WebFlux。'
    fix:
      vi: 'Nâng cấp Spring Boot lên <strong>4.0.6 / 3.5.14 / 3.4.16 / 3.3.19</strong>.'
      ja: 'Spring Boot を <strong>4.0.6 / 3.5.14 / 3.4.16 / 3.3.19</strong> へ更新。'
  - name: Apache HTTP Server (mod_http2)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-119618 (Critical)</strong>: Race condition trong <code>mod_http2</code> (<code>assign_headers()</code>) gây hỏng heap và RCE không cần xác thực.'
      ja: '<strong>CVE-2026-119618（Critical）</strong>：<code>mod_http2</code>（<code>assign_headers()</code>）の競合状態によりヒープ破壊・未認証 RCE の恐れ。'
    impact:
      vi: 'Apache HTTP Server <strong>2.4.55–2.4.70</strong> (hoặc <code>mod_h2</code> 2.0.8–2.0.42) bật HTTP/2.'
      ja: 'HTTP/2 有効な Apache HTTP Server <strong>2.4.55〜2.4.70</strong>（<code>mod_h2</code> 2.0.8〜2.0.42）。'
    fix:
      vi: 'Nâng cấp lên <strong>2.4.71+</strong> hoặc tạm tắt <code>mod_http2</code> / <code>h2</code>. Xem <a href="@home@featured/vulnerabilities/apache-cve-2026-119618/analysis/">phân tích</a>.'
      ja: '<strong>2.4.71+</strong> へ更新、困難時は <code>mod_http2</code> / <code>h2</code> を無効化。<a href="@home@featured/vulnerabilities/apache-cve-2026-119618/analysis/">分析</a>参照。'
  - name: nginx (HTTP/2)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-123007 "nginx2root" (Critical)</strong>: hỏng bộ nhớ flow control HTTP/2 có thể RCE không xác thực; kèm <strong>CVE-2026-123633</strong> (UAF).'
      ja: '<strong>CVE-2026-123007「nginx2root」（Critical）</strong>：HTTP/2 フロー制御のメモリ破壊で未認証 RCE の恐れ。<strong>CVE-2026-123633</strong>（UAF）も修正。'
    impact:
      vi: 'nginx OSS <strong>1.9.5–1.31.8</strong> bật HTTP/2; NGINX Plus R34–R36, 37.0.0–37.2.0.1.'
      ja: 'HTTP/2 有効な nginx OSS <strong>1.9.5〜1.31.8</strong>、NGINX Plus R34〜R36・37.0.0〜37.2.0.1。'
    fix:
      vi: 'Nâng lên <strong>1.30.7 / 1.31.9</strong> (Plus 37.3.0.1 / 37.0.8.1) và restart; tạm thời đặt <code>http2 off;</code>. Xem <a href="@home@featured/vulnerabilities/nginx-cve-2026-123007/analysis/">phân tích</a>.'
      ja: '<strong>1.30.7 / 1.31.9</strong>（Plus 37.3.0.1 / 37.0.8.1）へ更新・再起動、暫定で <code>http2 off;</code>。<a href="@home@featured/vulnerabilities/nginx-cve-2026-123007/analysis/">分析</a>参照。'
  - name: Apache Tomcat
    sev: high
    summary:
      vi: '<strong>CVE-2026-101296 (CVSS 9.1)</strong>: bypass xác thực JNDI Realm SASL; <strong>CVE-2026-103119</strong> (rò rỉ AJP) và <strong>CVE-2026-101356</strong> (trộn HTTP/2 async).'
      ja: '<strong>CVE-2026-101296（CVSS 9.1）</strong>：JNDI Realm SASL 認証バイパス、<strong>CVE-2026-103119</strong>（AJP 漏えい）、<strong>CVE-2026-101356</strong>（HTTP/2 混同）。'
    impact:
      vi: 'Apache Tomcat độc lập hoặc nhúng trong Spring Boot.'
      ja: 'スタンドアロン Tomcat および Spring Boot 内蔵コンテナ。'
    fix:
      vi: 'Nâng cấp Tomcat lên <strong>11.0.27 / 10.1.61 / 9.0.123</strong>.'
      ja: 'Tomcat を <strong>11.0.27 / 10.1.61 / 9.0.123</strong> へ更新。'
  - name: Netty &amp; Jackson
    sev: med
    summary:
      vi: '<strong>CVE-2026-116541 / 116539</strong> (heap overflow trong <code>netty-tcnative</code> TLS 1.3); <strong>CVE-2026-89407</strong> (ReDoS <code>jackson-core</code>) và <strong>CVE-2026-68497</strong> (OOM stream JSON).'
      ja: '<strong>CVE-2026-116541 / 116539</strong>（<code>netty-tcnative</code> TLS 1.3 オーバーフロー）、<strong>CVE-2026-89407</strong>（<code>jackson-core</code> ReDoS）、<strong>CVE-2026-68497</strong>（OOM）。'
    impact:
      vi: 'Java microservices dùng Netty (Spring WebFlux, gRPC) và Jackson.'
      ja: 'Netty（Spring WebFlux・gRPC）および Jackson を用いる Java サービス。'
    fix:
      vi: 'Cập nhật <code>netty-tcnative</code> lên <strong>2.0.84.Final+</strong> và <code>jackson-core</code> lên bản mới nhất.'
      ja: '<code>netty-tcnative</code> を <strong>2.0.84.Final+</strong>、<code>jackson-core</code> を最新版へ更新。'
  - name: Quasar Framework
    sev: med
    summary:
      vi: '<strong>CVE-2026-106108 / GHSA-vhhq-m2gm-rwc9</strong>: directory traversal trong <code>@quasar/app-vite</code> (v3.1.0–v3.2.0) ở chế độ SSG.'
      ja: '<strong>CVE-2026-106108 / GHSA-vhhq-m2gm-rwc9</strong>：SSG モード時の <code>@quasar/app-vite</code>（v3.1.0〜v3.2.0）ディレクトリトラバーサル。'
    impact:
      vi: 'Ứng dụng web Quasar dùng Vite với chế độ SSG.'
      ja: 'Vite および SSG ビルドを使用する Quasar Web アプリ。'
    fix:
      vi: 'Nâng cấp <code>@quasar/app-vite</code> lên <strong>v3.3.0</strong> và Quasar core lên <strong>v2.32.2+</strong>.'
      ja: '<code>@quasar/app-vite</code> を <strong>v3.3.0</strong>、Quasar コアを <strong>v2.32.2+</strong> へ更新。'

- title:
    vi: '6. Cơ sở dữ liệu (Databases: PostgreSQL, MySQL, Oracle, ClickHouse)'
    ja: '6. データベース（Databases: PostgreSQL、MySQL、Oracle、ClickHouse）'
  type: component
  rows:
  - name: PostgreSQL (RDBMS)
    sev: high
    summary:
      vi: 'Đợt vá 12-11 sửa <strong>52 CVEs</strong> (32 lỗi CVSS 8.8), nổi bật <strong>CVE-2026-6460</strong> (RCE qua DDL Type Confusion), <strong>CVE-2026-116331</strong> ("Narrow Grants", RCE với quyền tạo object), cùng lỗi <code>pg_dump</code>, <code>reindexdb</code>, PL/Perl, logical replication. Xem <a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">phân tích DB RCE</a>.'
      ja: '11/12 に <strong>52件のCVE</strong>（32件が CVSS 8.8）を修正：<strong>CVE-2026-6460</strong>（DDL 型混乱 RCE）、<strong>CVE-2026-116331</strong>（Narrow Grants RCE）、<code>pg_dump</code>・<code>reindexdb</code>・PL/Perl 等。<a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">DB RCE 分析</a>参照。'
    impact:
      vi: 'PostgreSQL tự host, K8s (CloudNativePG), RDS/Aurora, Cloud SQL. <strong>PostgreSQL 14 chính thức EOL</strong> từ 12-11-2026 (14.25 là bản cuối).'
      ja: 'セルフホスト、K8s、RDS/Aurora、Cloud SQL。<strong>PostgreSQL 14 は 2026-11-12 で公式 EOL</strong>（14.25 が最終）。'
    fix:
      vi: 'Nâng lên <strong>18.7 / 17.12 / 16.16 / 15.20 / 14.25</strong> + client tools; chạy <code>REINDEX</code>, chụp Full Backup mới và di chuyển khỏi PG 14. Xem <a href="@home@featured/vulnerabilities/postgresql-cve-2026-6460/analysis/">hướng dẫn</a>.'
      ja: '<strong>18.7 / 17.12 / 16.16 / 15.20 / 14.25</strong> へ更新、<code>REINDEX</code>・フルバックアップ取得、PG 14 から移行。<a href="@home@featured/vulnerabilities/postgresql-cve-2026-6460/analysis/">ガイド</a>参照。'
  - name: MySQL Server / Cluster
    sev: high
    summary:
      vi: '<strong>CVE-2026-101786</strong> (CVSS 7.2, CPU 20-10): Depthfirst chứng minh đạt RCE trên 26.7.0 chỉ với quyền <code>CREATE TEMPORARY TABLES ON *.*</code>.'
      ja: '<strong>CVE-2026-101786</strong>（CVSS 7.2、10/20 CPU）：Depthfirst が <code>CREATE TEMPORARY TABLES ON *.*</code> のみで 26.7.0 の RCE を実証。'
    impact:
      vi: 'MySQL Server / Cluster <strong>26.7.0–26.7.1</strong> (Innovation theo lịch <code>YY.M.P</code>; 8.4 LTS &amp; 9.7 không bị).'
      ja: 'MySQL Server / Cluster <strong>26.7.0〜26.7.1</strong>（<code>YY.M.P</code> 方式の Innovation 版。8.4 LTS・9.7 は対象外）。'
    fix:
      vi: 'Nâng lên bản sau 26.7.1 (CPU 10/2026) và thu hồi <code>CREATE TEMPORARY TABLES</code> không cần. Xem <a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '26.7.1 超へ更新（10月 CPU）し不要な <code>CREATE TEMPORARY TABLES</code> を剥奪。<a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">分析</a>参照。'
  - name: Oracle DB + ORDS
    sev: crit
    summary:
      vi: '<strong>CVE-2026-114819</strong> (CVSS 9.9, Oracle Text) + <strong>CVE-2026-91609</strong> (CVSS 6.5, ORDS GraphQL): Depthfirst nêu chuỗi hai lỗi qua ORDS lộ ngoài chạy được trước đăng nhập (Oracle không xếp unauthenticated).'
      ja: '<strong>CVE-2026-114819</strong>（CVSS 9.9、Oracle Text）＋ <strong>CVE-2026-91609</strong>（ORDS GraphQL）：Depthfirst は公開 ORDS 経由で認証前実行が可能と主張（Oracle 評価と相違）。'
    impact:
      vi: 'Oracle DB 19.3–19.32, 21.3–21.24, 23.4.0–23.26.3; ORDS 24.2.0–26.2.1 (ưu tiên cao nhất nếu ORDS lộ internet).'
      ja: 'Oracle DB 19.3〜19.32 / 21.3〜21.24 / 23.4.0〜23.26.3、ORDS 24.2.0〜26.2.1（外部公開 ORDS を最優先）。'
    fix:
      vi: 'Áp CSPU 11/2026 cho Oracle DB, nâng ORDS sau 26.2.1 và chặn ORDS lộ internet (<code>REVOKE TEMPORARY</code> không có tác dụng). Xem <a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: 'Oracle DB に 11月 CSPU、ORDS を 26.2.1 超へ更新しインターネット非公開化（<code>REVOKE TEMPORARY</code> 無効）。<a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">分析</a>参照。'
  - name: ClickHouse
    sev: high
    summary:
      vi: '<strong>Chưa có CVE</strong>: tràn số nguyên ghi ngoài bộ nhớ ở RowBinary khi đặt <code>format_binary_max_string_size = 0</code> và có <code>CREATE TEMPORARY TABLE</code> (tái hiện trên 26.7.5.10).'
      ja: '<strong>CVE 未割当</strong>：<code>format_binary_max_string_size = 0</code> と <code>CREATE TEMPORARY TABLE</code> により RowBinary で範囲外書込（26.7.5.10 で再現）。'
    impact:
      vi: 'ClickHouse cho phép user tạo bảng tạm và tự đổi <code>format_binary_max_string_size</code> (chưa có bản sửa xác nhận).'
      ja: '一時テーブル作成と <code>format_binary_max_string_size</code> 変更を許可する ClickHouse（修正版未確認）。'
    fix:
      vi: 'Thu hồi <code>CREATE TEMPORARY TABLE</code>, khóa <code>format_binary_max_string_size</code> qua settings constraints và theo dõi advisory. Xem <a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '<code>CREATE TEMPORARY TABLE</code> を制限し settings constraints で設定値を固定。<a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">分析</a>参照。'

- title:
    vi: '7. Hạ tầng đám mây (Infrastructure: AWS &amp; GCP)'
    ja: '7. クラウドインフラ（Infrastructure: AWS &amp; GCP）'
  type: provider
  rows:
  - name: AWS
    sev: high
    summary:
      vi: '<strong>CVE-2026-98433</strong>: side-channel trên Nitro thế hệ cũ (EC2 multi-tenant); AWS đã vá tự động hypervisor/firmware và hoàn tất vá host RDS/Aurora cho lỗi TCP.'
      ja: '<strong>CVE-2026-98433</strong>：旧世代 Nitro 環境のサイドチャネル脆弱性。AWS はハイパーバイザー・RDS/Aurora ホスト層の自動パッチを完了。'
    impact:
      vi: 'EC2 instance chạy lâu chưa reboot có thông báo bảo trì; NLB TCP pass-through.'
      ja: 'メンテナンス通知対象の未再起動 EC2、NLB TCP パススルー環境。'
    fix:
      vi: 'Kiểm tra AWS Health Dashboard để reboot instance có thông báo; dùng CloudFront / ALB kết thúc TCP ở tầng biên.'
      ja: 'AWS Health Dashboard を確認し対象インスタンスを再起動。エッジ層に CloudFront / ALB を配置。'
  - name: GCP
    sev: high
    summary:
      vi: '<strong>CVE-2026-98512</strong>: lỗi kiểm tra đầu vào trong container runtime loader của Cloud Run và Vertex AI gây thoát sandbox; Google đã vá managed runtime.'
      ja: '<strong>CVE-2026-98512</strong>：Cloud Run・Vertex AI のコンテナランタイムにおける入力検証不備（サンドボックス脱出）。Google は基盤を更新済み。'
    impact:
      vi: 'Workload Cloud Run và Vertex AI dùng custom container image cũ.'
      ja: '旧ベースイメージを利用する Cloud Run・Vertex AI カスタムコンテナ。'
    fix:
      vi: 'Rebuild toàn bộ custom image bằng base image mới nhất; cân nhắc bật Confidential Computing.'
      ja: '最新ベースイメージでカスタムコンテナを再ビルドし、Confidential Computing の利用を検討。'

- title:
    vi: 8. Sự cố hạ tầng, xâm nhập, cảnh báo &amp; công cụ phòng thủ (Incidents, Advisories &amp; Defense Tools)
    ja: 8. インフラ障害・侵入事案・脅威アドバイザリ・防御ツール（Incidents, Advisories &amp; Defense Tools）
  type: provider
  rows:
  - name: OpenAI &amp; Cisco (Shirudo)
    sev: low
    summary:
      vi: 'Công bố nền tảng mã nguồn mở <strong>Shirudo</strong> (24-11, <em>pre-release</em>): dùng <strong>eBPF</strong> và micropatch có chữ ký (<code>upatches</code>) để chặn khai thác runtime trên Linux/JVM trong thời gian chờ vá (<em>patch gap</em>) không cần reboot; demo Codex chặn Java4Shell trên Elasticsearch với <code>shirudo init</code> và <strong>TPM 2.0</strong> (<code>shirudo attest</code>).'
      ja: 'オープンソース基盤 <strong>Shirudo</strong>（11/24、<em>pre-release</em>）を公開。署名付き <strong>eBPF</strong>／Java <code>upatches</code> で修正待ち期間（パッチギャップ）の Linux/JVM 悪用を無停止遮断。<code>shirudo init</code> と <strong>TPM 2.0</strong>（<code>shirudo attest</code>）を備え、Codex による Java4Shell 遮断を実証。'
    impact:
      vi: 'Công cụ phòng thủ tham khảo cho Linux/K8s/JVM/AI agent. Production hiện đòi hỏi kernel có signed-loader ABI + patch Shirudo và <strong>TPM 2.0</strong>.'
      ja: 'Linux/K8s/JVM/AI エージェント向け防御ツール。本番要件は signed-loader ABI＋Shirudo パッチ済みカーネルと <strong>TPM 2.0</strong>。'
    fix:
      vi: '<strong>Không thay thế việc vá định kỳ:</strong> tiếp tục vá kernel/JVM; có thể thử nghiệm trước trong VM qua <a href="https://docs.shirudo.dev/start/quickstart.html" target="_blank" rel="noopener noreferrer">Shirudo Quickstart</a>.'
      ja: '<strong>定期パッチの代替ではありません：</strong>通常の更新を継続しつつ、<a href="https://docs.shirudo.dev/start/quickstart.html" target="_blank" rel="noopener noreferrer">Shirudo Quickstart</a> の VM で評価可能。'
  - name: FBI FLASH-20261113-001 (ARTEX)
    sev: high
    summary:
      vi: 'Cảnh báo <strong>ARTEX</strong> (agentic AI mã nguồn mở) bị lợi dụng tự động hóa xâm nhập, chiếm đặc quyền trong &lt;3 giờ; ghi nhận &gt;1.600 console mở công khai.'
      ja: 'OSS のエージェント AI 基盤 <strong>ARTEX</strong> が侵入自動化に悪用（3時間未満で特権奪取）、1,600台超の公開コンソールを確認。'
    impact:
      vi: 'Đa ngành; nhắm vào <strong>hệ thống ngoại vi</strong> kém bảo vệ (cổng đối tác, dịch vụ cũ, AI agent &amp; connector).'
      ja: '全業種。防御が手薄な<strong>周辺システム</strong>（パートナーポータル、レガシー、AI エージェント）が標的。'
    fix:
      vi: 'Kiểm kê app/agent mở internet, đưa trang quản trị vào mạng riêng, áp least privilege, xoay vòng secret và lưu log agent.'
      ja: '公開アプリ・エージェントの棚卸し、管理画面の閉域化、最小権限化、シークレット更新、操作ログ保全を実施。'
  - name: RIKEN (Fugaku &amp; Rikyu)
    sev: high
    summary:
      vi: 'Xâm nhập thật (10–14/11): lộ thông tin 4.222 user Fugaku, 375 user Rikyu cùng SSH private key / access key; nghi vấn qua status dashboard công khai.'
      ja: '実侵害（11/10〜14）：富岳 4,222名・Rikyu 375名の情報と SSH/アクセス鍵が流出。公開ステータスダッシュボード悪用の疑い。'
    impact:
      vi: 'Tổ chức vận hành HPC, cụm tính toán hoặc hệ thống có dashboard giám sát công khai dùng chung khóa/mạng nội bộ.'
      ja: 'HPC・計算クラスタ、または内部ネットワーク・鍵を共有する公開監視ダッシュボード環境。'
    fix:
      vi: 'Tách biệt status dashboard khỏi mạng nội bộ, không lưu SSH/API key tĩnh trên nút công khai và thu hồi khóa nghi lộ.'
      ja: '公開ダッシュボードを内部網から分離し、公開ノードの静的鍵を廃止・失効再発行。'
  - name: Equinor
    sev: med
    summary:
      vi: 'Xâm nhập thật (17–20/11): tấn công một số hệ thống CNTT; đã chặn đứng, sản xuất/OT không bị ảnh hưởng và chưa ghi nhận mất dữ liệu.'
      ja: '実侵害（11/17〜20）：一部 IT システムへの攻撃を阻止。生産・OT への影響やデータ窃取は未確認。'
    impact:
      vi: 'Hệ thống CNTT doanh nghiệp (corporate IT) tách biệt mạng OT.'
      ja: 'OT 系から分離された企業 IT システム。'
    fix:
      vi: 'Duy trì phân tách mạng IT/OT, giám sát bất thường và diễn tập cô lập nhanh.'
      ja: 'IT/OT 分離を維持し、異常監視と迅速な隔離手順を確認。'
  - name: Microsoft 365, Apple, Chase, FAA, NSANet
    sev: low
    summary:
      vi: 'Các sự cố gián đoạn diện rộng 12–17/11 đều do <strong>lỗi nội bộ / nâng cấp vận hành</strong> (Microsoft 365, FAA, Chase, NSANet, Apple), <strong>không phải tấn công mạng</strong>.'
      ja: '11/12〜17 の一連の大規模障害（M365、FAA、Chase、NSANet、Apple）はいずれも<strong>内部変更・運用起因</strong>であり<strong>サイバー攻撃ではない</strong>。'
    impact:
      vi: 'Đội ngũ vận hành cloud, on-premise và dịch vụ phụ thuộc lịch bảo trì/nâng cấp.'
      ja: 'クラウド・オンプレミスおよび保守スケジュールに依存する全運用チーム。'
    fix:
      vi: 'Không đánh đồng với tấn công mạng; áp dụng staging, freeze window và cơ chế rollback rõ ràng.'
      ja: '攻撃と混同せず、ステージング検証・フリーズ期間・ロールバック手順を徹底。'

- title:
    vi: 9. Ghi chú về độ tin cậy &amp; Nguồn tham khảo
    ja: 9. 情報の信頼性に関する注記 &amp; 参考情報
  type: list
  items:
  - vi: '<strong>Đối chiếu nguồn chính thức PostgreSQL &amp; Help Net Security:</strong> Ngày 12-11-2026, PostgreSQL Global Development Group phát hành bản cập nhật bảo mật định kỳ quý 4/2026 vá 52 CVEs cho tất cả các nhánh hỗ trợ (18.7, 17.12, 16.16, 15.20, 14.25), trong đó có 32 lỗi CVSS 8.8 (tiêu biểu là CVE-2026-6460 RCE qua Type Confusion), đồng thời công bố phiên bản 14.25 là bản phát hành cuối cùng đánh dấu PostgreSQL 14 chính thức End-of-Life (EOL).'
    ja: '<strong>PostgreSQL 公式および Help Net Security との照合済み:</strong> 2026年11月12日、PostgreSQL Global Development Group はサポート対象ブランチ（18.7、17.12、16.16、15.20、14.25）に対して計52件のCVEを修正する定期セキュリティリリースを公開。32件が CVSS 8.8（代表例：型混乱 RCE CVE-2026-6460）に達し、同時にバージョン 14.25 が最終リリースとなり、PostgreSQL 14 が公式に EOL（サポート終了）となったことを発表。'
  - vi: '<strong>Đối chiếu nguồn chính thức Apache HTTP Server &amp; CVE.org (CVE-2026-119618):</strong> Lỗi đồng bộ trong <code>mod_http2</code> (<code>assign_headers()</code>) do Anthropic OSS Scanner và Google Cloud Vulnerability Research phát hiện, đã được Apache Software Foundation xác nhận và vá trong bản phát hành Apache HTTP Server 2.4.71 ngày 11-11-2026.'
    ja: '<strong>Apache HTTP Server &amp; CVE.org 公式ソースとの照合済み（CVE-2026-119618）:</strong> <code>mod_http2</code>（<code>assign_headers()</code>）の競合状態は Anthropic OSS Scanner および Google Cloud Vulnerability Research により報告され、Apache Software Foundation により2026年11月11日リリースの Apache HTTP Server 2.4.71 で修正されました。'
  - vi: '<strong>Đối chiếu nguồn chính thức Microsoft MSRC &amp; Patch Tuesday:</strong> CVE-2026-120779, CVE-2026-120780 (Visual Studio Code), CVE-2026-118746 (.NET), CVE-2026-114146/47 (ASP.NET Core) và CVE-2026-114151 (Visual Studio) được công bố trong bản tin bảo mật Patch Tuesday tháng 11/2026.'
    ja: '<strong>Microsoft MSRC &amp; Patch Tuesday 公式ソースとの照合済み:</strong> CVE-2026-120779、CVE-2026-120780（VS Code）、CVE-2026-118746（.NET）、CVE-2026-114146/47（ASP.NET Core）、CVE-2026-114151（Visual Studio）は 2026年11月 Patch Tuesday にて公開。'
  - vi: '<strong>Nghiên cứu "Narrow Grants, Wide Engines" (Zheng Yu, Depthfirst, 18-11-2026):</strong> Đánh giá của nhà cung cấp và nhà nghiên cứu khác nhau: MySQL CVE-2026-101786 được Oracle chấm PR:High nhưng Depthfirst đạt RCE chỉ với <code>CREATE TEMPORARY TABLES</code>; Oracle không xếp CVE-2026-114819 / CVE-2026-91609 là unauthenticated, còn Depthfirst cho biết chuỗi qua ORDS lộ ra ngoài chạy được trước khi đăng nhập. Chưa ghi nhận khai thác ngoài thực tế; chưa có PoC đầy đủ công khai (chỉ trích đoạn); The Hacker News chưa tái hiện độc lập toàn bộ chuỗi. ClickHouse chưa có CVE và chưa có bản sửa được xác nhận.'
    ja: '<strong>研究「Narrow Grants, Wide Engines」（Zheng Yu、Depthfirst、2026年11月18日）:</strong> ベンダーと研究者の評価に差異あり。MySQL CVE-2026-101786 は Oracle の評価が PR:High だが Depthfirst は <code>CREATE TEMPORARY TABLES</code> のみで RCE に到達。Oracle は CVE-2026-114819 / CVE-2026-91609 をいずれも認証不要と評価していないが、Depthfirst は外部公開 ORDS 経由の連鎖でログイン前に実行可能と主張。実環境での悪用は未確認、完全な PoC は未公開（一部抜粋のみ）、The Hacker News も全連鎖を独自には再現していない。ClickHouse は CVE 未割り当てで修正版も未確認。'
  - vi: '<strong>Chrome 158 ngày 17-11 &amp; bản vá thoát sandbox 23-11 (CVE-2026-134401):</strong> Ngày 17-11 Google công bố 204 bản sửa bảo mật (6 lỗi Critical). Ngày 23-11, Google phát hành bản vá riêng cho <strong>CVE-2026-134401</strong> (Chromium issue 554051967, báo cáo nội bộ 28-08-2026, CWE-20 Improper Input Validation trong Variations) trên Desktop Stable (<code>158.0.8127.88/.89</code> Win/macOS, <code>158.0.8127.88</code> Linux), Extended Stable (<code>156.0.8078.114</code>) và Android (<code>158.0.8127.92</code>). Google xếp Critical; NVD đang ở trạng thái <code>Awaiting Analysis</code> (CISA-ADP chấm CVSS 3.1 <strong>9.6</strong>). Chưa ghi nhận khai thác thực tế, chưa có PoC công khai và chưa có trong CISA KEV (kiểm tra 25-11-2026).'
    ja: '<strong>11月17日の Chrome 158 および 11月23日のサンドボックス脱出修正（CVE-2026-134401）：</strong> 11月17日に Critical 6件を含む204件の修正を公開後、11月23日に <strong>CVE-2026-134401</strong>（Chromium issue 554051967、2026-08-28 内部報告、Variations の CWE-20 不適切な入力検証）を Desktop Stable（Win/macOS <code>158.0.8127.88/.89</code>、Linux <code>158.0.8127.88</code>）、Extended Stable（<code>156.0.8078.114</code>）、Android（<code>158.0.8127.92</code>）で修正。Google 評価は Critical、NVD は <code>Awaiting Analysis</code>（CISA-ADP による CVSS 3.1 は <strong>9.6</strong>）。実環境での悪用や公開 PoC は未確認、CISA KEV 未掲載（2026年11月25日確認）。'
  - vi: '<strong>Cảnh báo Zero-Day Google Chrome (CVE-2026-125350):</strong> Lỗ hổng Use-After-Free trong trình phân tích XML đã được Google xác nhận có mã khai thác hoạt động thực tế (in the wild); bản vá khẩn cấp đã phát hành trên các kênh Stable và Extended Stable.'
    ja: '<strong>Google Chrome ゼロデイ警告（CVE-2026-125350）:</strong> XML パーサーの Use-After-Free 脆弱性は Google により実環境での悪用（in the wild）が確認済み。Stable および Extended Stable チャンネルにて緊急アップデートが配信されています。'
  - vi: '<strong>Cảnh báo chuỗi cung ứng công cụ AI Coding:</strong> Các chiến dịch mã độc mạo danh máy chủ Model Context Protocol (MCP) và công cụ mở rộng IDE đang gia tăng; khuyến nghị toàn bộ kỹ sư áp dụng nguyên tắc kiểm tra mã nguồn và xác minh tính toàn vẹn của lockfile trước khi tích hợp vào môi trường làm việc.'
    ja: '<strong>AIコーディングツールのサプライチェーン警戒:</strong> Model Context Protocol（MCP）サーバーやIDE拡張ツールを騙る悪意あるパッケージが増加しています。全エンジニアは作業環境に組み込む前にソースコードの監査およびロックファイルの整合性検証を徹底してください。'
  - vi: '<strong>Đối chiếu nguồn chính thức Linux kernel CNA, git.kernel.org &amp; các distro (CVE-2026-99312):</strong> Công bố ngày 18-11-2026 (cập nhật 19-11); Terra Security chứng minh đọc ~127 GB RAM host trên DigitalOcean Droplet trong môi trường kiểm soát (DigitalOcean đã live-patch toàn bộ hypervisor ngày 19-11). Chưa có PoC công khai, chưa ghi nhận khai thác thực tế và chưa có trong CISA KEV (kiểm tra 21-11-2026).'
    ja: '<strong>Linux カーネル CNA・git.kernel.org・各ディストリとの照合済み（CVE-2026-99312）:</strong> 2026年11月18日公開（11/19更新）。Terra Security は制御環境下の DigitalOcean Droplet でホスト RAM 約127GB読取を実証（DigitalOcean は11/19に全ハイパーバイザーへライブパッチ完了）。公開 PoC・実環境悪用は未確認、CISA KEV 未掲載（2026年11月21日確認）。'
  - vi: '<strong>Tổng hợp sự cố 12–17/11 &amp; cảnh báo FBI FLASH-20261113-001 (ARTEX):</strong> Dựa trên tổng hợp nguồn công khai của ibl.ai (21-11-2026) đối chiếu BleepingComputer, Al Jazeera, NBC News, CNN, Macworld, thông cáo Equinor và FBI FLASH-20261113-001. Không có nguồn nào xác nhận mối liên hệ giữa các sự cố gián đoạn (Microsoft 365, FAA, Chase, NSANet, Apple) với nhau hay với hai vụ xâm nhập (RIKEN Fugaku, Equinor) hoặc ARTEX; tin đồn "tòa án Mỹ ngoại tuyến" ngày 18-11 chưa có nguồn xác thực.'
    ja: '<strong>11/12〜17の障害まとめおよび FBI FLASH-20261113-001（ARTEX）:</strong> ibl.ai（2026年11月21日）が BleepingComputer、Al Jazeera、NBC News、CNN、Macworld、Equinor 声明、FBI FLASH-20261113-001 を照合した整理に基づく。各障害（Microsoft 365、FAA、Chase、NSANet、Apple）同士、あるいは侵入事案（RIKEN富岳、Equinor）や ARTEX との関連を示す出典はなく、11/18の「米国裁判所オフライン」説にも確認できる出典はありません。'
  - vi: '<strong>Đối chiếu nguồn chính thức Linux kernel CNA, NVD &amp; Debian LTS (CVE-2026-99362):</strong> Công bố ngày 19-11-2026; upstream đã vá ở 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1, Debian 12 LTS phát hành bản vá qua DLA-4927-1 (<code>linux-6.12</code>), trong khi RHEL, Ubuntu và Amazon Linux đang chờ bản cập nhật. Chưa có PoC công khai, chưa ghi nhận khai thác thực tế và chưa có trong CISA KEV (kiểm tra 23-11-2026).'
    ja: '<strong>Linux カーネル CNA・NVD・Debian LTS 公式情報との照合済み（CVE-2026-99362）:</strong> 2026年11月19日公開。upstream は 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 で修正済み、Debian 12 LTS は DLA-4927-1（<code>linux-6.12</code>）で修正公開済み、RHEL・Ubuntu・Amazon Linux は修正待ち。公開 PoC・実環境悪用は未確認、CISA KEV 未掲載（2026年11月23日確認）。'
  - vi: '<strong>Đối chiếu nguồn chính thức Linux kernel CNA, git.kernel.org, Debian, Red Hat &amp; NVD (CVE-2026-99676):</strong> Công bố ngày 20-11-2026; upstream đã vá ở 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2 (git.kernel.org), Debian đã phát hành DSA-6652-1. Đánh giá mức độ khác nhau giữa nguồn: Linux kernel CNA &amp; NVD ghi nhận CVSS 9.8 (Critical), trong khi Red Hat BZ #2577739 chấm CVSS 5.9 (Medium, AC:H) do yêu cầu race timing chặt trên phần cứng weak-memory-ordering (ARM64/POWER). Chưa có PoC công khai, chưa ghi nhận khai thác thực tế và chưa có trong CISA KEV (kiểm tra 23-11-2026).'
    ja: '<strong>Linux カーネル CNA・git.kernel.org・Debian・Red Hat・NVD 公式情報との照合済み（CVE-2026-99676）:</strong> 2026年11月20日公開。upstream は 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2（git.kernel.org）で修正済み、Debian は DSA-6652-1 を公開済み。情報源により評価に差異あり：Linux カーネル CNA と NVD は CVSS 9.8（Critical）と評価する一方、Red Hat BZ #2577739 は weak-memory-ordering 環境（ARM64/POWER）での厳密な競合タイミングを要するため CVSS 5.9（Medium、AC:H）と評価。公開 PoC・実環境悪用は未確認、CISA KEV 未掲載（2026年11月23日確認）。'
  - vi: '<strong>Đối chiếu nguồn chính thức shirudo-dev/shirudo &amp; thông báo OpenAI / Cisco (24-11-2026):</strong> Thông tin kỹ thuật về Shirudo (trạng thái pre-release, yêu cầu kernel có signed-loader ABI + patch Shirudo và TPM 2.0, cơ chế <code>upatches</code> cho eBPF/Java agent) được xác minh trực tiếp từ mã nguồn và tài liệu chính thức trên GitHub (<code>shirudo-dev/shirudo</code>, <code>docs.shirudo.dev</code>) cùng tóm tắt từ thông báo của OpenAI, Cisco/Isovalent và The Hacker News.'
    ja: '<strong>公式リポジトリ shirudo-dev/shirudo および OpenAI / Cisco 発表との照合済み（2026年11月24日）:</strong> Shirudo の技術仕様（pre-release 状態、signed-loader ABI＋Shirudo パッチ適用済みカーネルおよび TPM 2.0 要件、eBPF/Java エージェント向け <code>upatches</code> 機構）は GitHub 公式リポジトリ（<code>shirudo-dev/shirudo</code>）および公式ドキュメント（<code>docs.shirudo.dev</code>）から直接確認し、OpenAI・Cisco/Isovalent・The Hacker News の発表内容と照合しています。'
  - vi: '<strong>Tổng hợp chuỗi cung ứng Java / Maven (Safeguard.sh, 25-11-2026 18:10 UTC):</strong> Đối chiếu trực tiếp bài viết <em>Java Malware Today: Malicious Maven Packages</em> (Safeguard.sh) với các mã định danh công khai trên GitHub Advisory Database (<code>GHSA-9c6j-xrpw-g32x</code>, <code>GHSA-5f38-2pgv-jhg6</code>) và OSV (<code>MAL-2025-2552</code>, <code>MAL-2025-191470</code>). Cả 2 bản ghi Maven độc hại đều phát sinh từ năm 2025 (OSV công bố 19-03-2025 và 26-11-2025; GitHub import 13-07-2026), chưa ghi nhận thêm mã độc Maven mới trên feed công khai trong năm 2026 tính đến thời điểm rà soát.'
    ja: '<strong>Java / Maven サプライチェーン調査（Safeguard.sh、2026年11月25日 18:10 UTC）:</strong> Safeguard.sh の記事 <em>Java Malware Today: Malicious Maven Packages</em> および GitHub Advisory Database（<code>GHSA-9c6j-xrpw-g32x</code>、<code>GHSA-5f38-2pgv-jhg6</code>）・OSV（<code>MAL-2025-2552</code>、<code>MAL-2025-191470</code>）の公開識別子と照合。2件の悪性 Maven パッケージはいずれも2025年登録（OSV 初出 2025-03-19 / 2025-11-26、GitHub 取込 2026-07-13）で、調査時点では2026年新規の公開 Maven マルウェア記録はありません。'
