h1:
  vi: Báo cáo bảo mật tháng 11/2026
  ja: 2026年11月 セキュリティレポート
sub:
  vi: 'Số liệu tính đến <strong>2026-11-26</strong> (cập nhật phân tích chuỗi cung ứng Java/Maven/Gradle từ Safeguard, công cụ bảo vệ runtime Linux bằng eBPF <strong>Shirudo</strong> từ OpenAI &amp; Cisco, lỗ hổng Critical thoát sandbox Chrome CVE-2026-134401 trên Chrome 158.0.8127.88/.89, lỗ hổng Linux kernel Net refcount ordering CVE-2026-99676, lỗ hổng Linux kernel NFSD CVE-2026-99362, cảnh báo FBI FLASH-20261113-001 về ARTEX &amp; sự cố/xâm nhập giữa tháng 11, lỗ hổng Linux KVM AMD CVE-2026-99312, nghiên cứu RCE engine cơ sở dữ liệu PostgreSQL/MySQL/Oracle/ClickHouse, đợt phát hành bảo mật PostgreSQL 52 CVEs, Patch Tuesday Microsoft, Chrome Zero-Day, Apache HTTP Server 2.4.71 và các bản tin an ninh định kỳ).'
  ja: '<strong>2026年11月26日</strong>時点の情報です（Safeguard による Java/Maven/Gradle サプライチェーン調査、OpenAI・Cisco による eBPF ベース Linux ランタイム防御ツール <strong>Shirudo</strong> の公開、Google Chrome の Critical サンドボックス脱出脆弱性 CVE-2026-134401・Chrome 158.0.8127.88/.89 修正、Linux カーネル Net refcount 順序脆弱性 CVE-2026-99676、Linux カーネル NFSD 脆弱性 CVE-2026-99362、FBI FLASH-20261113-001（ARTEX）および11月中旬の障害・侵入事案、Linux KVM AMD 脆弱性 CVE-2026-99312、データベースエンジン RCE 研究（PostgreSQL/MySQL/Oracle/ClickHouse）、PostgreSQL 52件の脆弱性修正リリース、Microsoft Patch Tuesday、Chrome ゼロデイ緊急リリース、Apache HTTP Server 2.4.71 および定期セキュリティ情報に対応）。'
placeholder:
  vi: '🔍 Tìm kiếm CVE, framework, thư viện (vd: PostgreSQL, MySQL, Oracle, VS Code, Chrome, .NET, Tomcat, Next.js, Maven, AWS, ARTEX)...'
  ja: '🔍 CVE、フレームワーク、ライブラリで検索（例: PostgreSQL, MySQL, Oracle, VS Code, Chrome, .NET, Tomcat, Next.js, Maven, AWS, ARTEX）...'
scope:
  vi: '<strong>Phạm vi rà soát:</strong> Cơ sở dữ liệu (PostgreSQL, MySQL, Oracle, ClickHouse) · Công cụ &amp; Môi trường phát triển (VS Code, Visual Studio, GitHub Actions) · Trình duyệt (Chrome/V8) · Ngôn ngữ &amp; Runtimes (.NET, Linux, NodeJS, PHP, Java) · Frameworks (Next.js, Nuxt, Laravel, Spring Boot, Tomcat, Quasar) · Hạ tầng, Chuỗi cung ứng &amp; AI Agent (AWS, GCP, npm, PyPI, Composer, Maven/Gradle, ARTEX) · Sự cố vận hành &amp; Xâm nhập (Microsoft 365, RIKEN Fugaku, Equinor).'
  ja: '<strong>調査範囲:</strong> データベース（PostgreSQL、MySQL、Oracle、ClickHouse） · 開発ツール・IDE環境（VS Code、Visual Studio、GitHub Actions） · ブラウザ（Chrome/V8） · 言語・ランタイム（.NET、Linux、NodeJS、PHP、Java） · フレームワーク（Next.js、Nuxt、Laravel、Spring Boot、Tomcat、Quasar） · クラウド・サプライチェーン・AIエージェント（AWS、GCP、npm、PyPI、Composer、Maven/Gradle、ARTEX） · 障害・侵入事案（Microsoft 365、RIKEN富岳、Equinor）。'

card:
  title:
    vi: Báo cáo tháng 11/2026
    ja: 2026年11月レポート
  date:
    vi: Cập nhật đến 2026-11-26 · Định kỳ hàng tháng
    ja: 2026年11月26日 時点 · 月次定期レポート
  items:
  - sev: crit
    label: Linux kernel Net (CVE-2026-99676)
    text:
      vi: 'CVE-2026-99676 (CVSS 9.8 CNA / 5.9 RH): lỗi refcount memory ordering trong lockless socket lookup trên ARM64/POWER (kernel ≥ 5.5 / 5.4.208+), gây UAF/panic hoặc nguy cơ RCE. Đã vá ở upstream 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2 và Debian DSA-6652-1; ưu tiên vá máy chủ ARM64/Graviton mở TCP. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">phân tích</a>.'
      ja: 'CVE-2026-99676（CVSS 9.8 CNA / 5.9 RH）：ARM64/POWER（カーネル 5.5 以降 / 5.4.208+）のロックレスソケット検索における refcount メモリ順序不具合で UAF/パニックや RCE の恐れ。upstream 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2 および Debian DSA-6652-1 で修正済み。TCP 公開 ARM64/Graviton を優先更新。<a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">分析</a>を参照。'
  - sev: crit
    label: Linux kernel NFSD (CVE-2026-99362)
    text:
      vi: 'CVE-2026-99362 (CVSS 9.8): ghi tràn slab-out-of-bounds trong <code>nfsd4_sequence()</code> (NFSv4.1+, kernel ≥ 3.16), gây panic/DoS hoặc nguy cơ RCE. Đã vá ở upstream 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 và Debian DLA-4927-1; giới hạn cổng TCP/UDP 2049 hoặc tắt NFSv4.1+ nếu chưa vá được. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">phân tích</a>.'
      ja: 'CVE-2026-99362（CVSS 9.8）：<code>nfsd4_sequence()</code>（NFSv4.1+、カーネル 3.16 以降）における slab-out-of-bounds 書き込み。パニック/DoS や RCE の恐れ。upstream 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 および Debian DLA-4927-1 で修正済み。未適用時は 2049番ポート制限または NFSv4.1+ 無効化を。<a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">分析</a>を参照。'
  - sev: high
    label: PostgreSQL (RDBMS)
    text:
      vi: 'Đợt cập nhật bảo mật lớn vá 52 CVEs (32 lỗi CVSS 8.8, gồm CVE-2026-6460 RCE qua Type Confusion). Nâng cấp ngay lên 18.7/17.12/16.16/15.20/14.25; PostgreSQL 14 chính thức EOL.'
      ja: '52件のCVEを修正する大規模セキュリティリリース（型混乱RCE CVE-2026-6460など32件がCVSS 8.8）。直ちに 18.7/17.12/16.16/15.20/14.25 へ更新、PostgreSQL 14 は公式 EOL。'
  - sev: crit
    label: Database engines (PG/MySQL/Oracle)
    text:
      vi: 'Nghiên cứu "Narrow Grants, Wide Engines" (Depthfirst): quyền thấp (TEMPORARY / CREATE TEMPORARY TABLES) vẫn chạm tới lỗi bộ nhớ trong engine → RCE. Oracle DB CVE-2026-114819 (CVSS 9.9) + ORDS CVE-2026-91609; MySQL CVE-2026-101786 (26.7.0–26.7.1); PostgreSQL CVE-2026-116331 đã vá cùng bản 18.7/17.12/…; ClickHouse chưa có CVE. Vá Oracle (CSPU 11/2026) + ORDS, không để ORDS lộ internet. Xem <a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '研究「Narrow Grants, Wide Engines」（Depthfirst）：低権限（TEMPORARY / CREATE TEMPORARY TABLES）でもエンジンのメモリ破壊に到達し RCE。Oracle DB CVE-2026-114819（CVSS 9.9）＋ ORDS CVE-2026-91609、MySQL CVE-2026-101786（26.7.0〜26.7.1）、PostgreSQL CVE-2026-116331 は 18.7/17.12/… と同じリリースで修正済み、ClickHouse は CVE なし。Oracle（2026年11月 CSPU）と ORDS を更新し、ORDS をインターネットに公開しない。<a href="@home@featured/vulnerabilities/database-rce-narrow-grants/analysis/">分析</a>を参照。'
  - sev: crit
    label: Apache HTTP Server
    text:
      vi: 'CVE-2026-119618: Lỗ hổng Race Condition trong mod_http2 dẫn đến heap corruption &amp; RCE (Critical). Nâng cấp ngay lên 2.4.71+ hoặc tạm tắt mod_http2.'
      ja: 'CVE-2026-119618: mod_http2 の競合状態によるヒープ破壊・RCE脆弱性（Critical）。直ちに 2.4.71+ へ更新、または一時的に mod_http2 を無効化。'
  - sev: crit
    label: PHP (đã phát hành bản vá)
    text:
      vi: 'PHP đã phát hành 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36 (và 8.6.0 GA) ngày 19-11, vá 17 CVE gồm 7 lỗi CVSS 9.2 và CVE-2026-115560 (session upload progress). Nâng phiên bản + restart; 8.1 trở xuống không có bản vá. Xem <a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">phân tích</a>.'
      ja: 'PHP が 11/19 に 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36（および 8.6.0 GA）を公開。CVSS 9.2 が 7 件を含む 17 件の CVE（CVE-2026-115560 セッション upload progress を含む）を修正。更新＋再起動を。8.1 以前は修正版なし。<a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">分析</a>を参照。'
  - sev: crit
    label: nginx (HTTP/2)
    text:
      vi: 'CVE-2026-123007 (nginx2root, CVSS 9.2 theo NetSPI): hỏng bộ nhớ trong HTTP/2 flow control, có thể RCE không cần xác thực (1.9.5–1.31.8). Nâng cấp lên 1.30.7 / 1.31.9 và restart, hoặc tạm tắt HTTP/2. Xem <a href="@home@featured/vulnerabilities/nginx-cve-2026-123007/analysis/">phân tích</a>.'
      ja: 'CVE-2026-123007（nginx2root、NetSPI による CVSS 9.2）：HTTP/2 フロー制御のメモリ破壊で認証不要 RCE の恐れ（1.9.5〜1.31.8）。1.30.7 / 1.31.9 へ更新し再起動、または一時的に HTTP/2 を無効化。<a href="@home@featured/vulnerabilities/nginx-cve-2026-123007/analysis/">分析</a>を参照。'
  - sev: high
    label: Java (Oracle JDK / OpenJDK)
    text:
      vi: 'CVE-2026-114938 (Java4Shell, CVSS 8.1): tràn heap ở Base64 decoder trên x86-64 AVX-512 (Java 17.0.6+, 21, 25, 27). Nâng JDK lên 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1 (Corretto 17.0.21.1.2) và restart. Xem <a href="@home@featured/vulnerabilities/java-cve-2026-114938/analysis/">phân tích</a>.'
      ja: 'CVE-2026-114938（Java4Shell, CVSS 8.1）：x86-64 AVX-512 上の Base64 デコーダーでヒープ破壊（Java 17.0.6+、21、25、27）。JDK を 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1（Corretto 17.0.21.1.2）へ更新し再起動。<a href="@home@featured/vulnerabilities/java-cve-2026-114938/analysis/">分析</a>を参照。'
  - sev: crit
    label: VS Code &amp; Dev Tools
    text:
      vi: 'CVE-2026-120779 / CVE-2026-120780: Lỗ hổng RCE nghiêm trọng (CVSS 9.6) qua workspace/repo độc hại. Nâng cấp ngay lên 1.145.3+ và bật Workspace Trust.'
      ja: 'CVE-2026-120779 / CVE-2026-120780: 悪意あるワークスペース/リポジトリによる重大なRCE脆弱性（CVSS 9.6）。直ちに 1.145.3+ へ更新し Workspace Trust を有効化。'
  - sev: crit
    label: Chrome / V8
    text:
      vi: 'Ngày 23-11, Google phát hành bản vá Critical <strong>CVE-2026-134401</strong> (CVSS 9.6 CISA-ADP, CWE-20 trong Variations) cho phép chạy mã ngoài sandbox. Cập nhật ngay Chrome Stable lên <strong>158.0.8127.88/.89</strong> (Win/macOS), <strong>158.0.8127.88</strong> (Linux), Extended Stable <strong>156.0.8078.114</strong>, Android <strong>158.0.8127.92</strong> và khởi động lại trình duyệt; nối tiếp bản 158 (204 lỗi) và zero-day CVE-2026-125350 trước đó. Xem <a href="@home@featured/vulnerabilities/chrome-cve-2026-134401/analysis/">phân tích</a>.'
      ja: '11月23日、Google はサンドボックス外でコード実行可能な Critical 脆弱性 <strong>CVE-2026-134401</strong>（CVSS 9.6 CISA-ADP、Variations の CWE-20）を修正。Chrome Stable を <strong>158.0.8127.88/.89</strong>（Win/macOS）、<strong>158.0.8127.88</strong>（Linux）、Extended Stable <strong>156.0.8078.114</strong>、Android <strong>158.0.8127.92</strong> へ更新し再起動。Chrome 158（204件修正）およびゼロデイ CVE-2026-125350 に続く更新。<a href="@home@featured/vulnerabilities/chrome-cve-2026-134401/analysis/">分析</a>を参照。'
  - sev: high
    label: .NET &amp; Frameworks
    text:
      vi: 'Patch Tuesday tháng 11 vá .NET 10/9/8; Apache Tomcat lỗi bypass xác thực SASL (CVSS 9.1); Next.js 16.4.5 vá RCE App Router cache; Nuxt lên 4.6.3.'
      ja: '11月 Patch Tuesday による .NET 10/9/8 修正。Apache Tomcat の SASL 認証バイパス（CVSS 9.1）、Next.js 16.4.5 の App Router キャッシュ RCE 修正、Nuxt 4.6.3 更新。'
  - sev: high
    label: Hạ tầng &amp; Chuỗi cung ứng
    text:
      vi: 'AWS Nitro Enclave (CVE-2026-98433); GCP Cloud Run/Vertex sandbox escape (CVE-2026-98512); cảnh báo chiến dịch npm/PyPI giả mạo công cụ MCP nhắm vào AI agent; chuỗi cung ứng Java/Maven/Gradle (2 gói độc hại công khai từ 2025 trên OSV/GitHub nhưng cần rà soát build plugin, dependency confusion và bật <code>osv-scanner</code>).'
      ja: 'AWS Nitro Enclave（CVE-2026-98433）、GCP Cloud Run/Vertex サンドボックス脱出（CVE-2026-98512）、AIエージェントを標的とした悪意ある MCP パッケージの検知、Java/Maven/Gradle サプライチェーン点検（OSV/GitHub の公開悪性パッケージは2025年来の2件のみだが、ビルドプラグイン・依存関係混乱の監査と <code>osv-scanner</code> 導入を推奨）。'
  - sev: high
    label: ARTEX (FBI FLASH) &amp; Sự cố 11/2026
    text:
      vi: 'FBI FLASH-20261113-001 cảnh báo framework AI tấn công ARTEX (chiếm quyền đặc quyền &lt;3 giờ, nhắm hệ thống ngoại vi &amp; AI agent); RIKEN Fugaku và Equinor bị xâm nhập thật, còn các sự cố Microsoft 365, FAA, Chase, NSANet, Apple (12–17/11) đều là lỗi nội bộ/nâng cấp, không phải tấn công mạng.'
      ja: 'FBI FLASH-20261113-001 が AI 攻撃フレームワーク ARTEX を警告（3時間未満で特権奪取、周辺システム・AI エージェントを標的）。RIKEN富岳と Equinor は実侵害であった一方、Microsoft 365・FAA・Chase・NSANet・Apple（11/12〜17）の障害はいずれも内部変更や不具合によるものでサイバー攻撃ではない。'

sections:
- title:
    vi: 1. Việc cần làm ngay
    ja: 1. 今すぐ対応すべき事項
  type: actions
  rows:
  - task:
      vi: 'Vá kernel <strong>Linux ARM64/Graviton &amp; POWER</strong> (≥ 5.5 / 5.4.208+) lên <strong>6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2</strong> (Debian <code>DSA-6652-1</code>) cho <strong>CVE-2026-99676</strong> và reboot. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">phân tích</a>'
      ja: '<strong>Linux ARM64/Graviton・POWER</strong>（5.5+ / 5.4.208+）を <strong>6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2</strong>（Debian <code>DSA-6652-1</code>）へ更新し再起動（<strong>CVE-2026-99676</strong>、<a href="@home@featured/vulnerabilities/linux-cve-2026-99676/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay khi có bản vá distro (ưu tiên ARM64 mở TCP)
      ja: ディストリ修正公開後速やかに（TCP公開 ARM64 優先）
  - task:
      vi: 'Vá kernel <strong>Linux NFS (nfsd NFSv4.1+)</strong> lên <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong> (Debian <code>DLA-4927-1</code>) cho <strong>CVE-2026-99362</strong>, hoặc siết firewall cổng 2049 / tắt NFSv4.1+. Xem <a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">phân tích</a>'
      ja: '<strong>Linux NFS（nfsd NFSv4.1+）</strong>を <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong>（Debian <code>DLA-4927-1</code>）へ更新（<strong>CVE-2026-99362</strong>）、または 2049番制限・NFSv4.1+ 無効化（<a href="@home@featured/vulnerabilities/linux-cve-2026-99362/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay lập tức
      ja: 即時対応
  - task:
      vi: 'Nâng cấp <strong>Spring Security</strong> lên <strong>7.1.3 / 7.0.9 / 7.2.0</strong> (Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>) vá <strong>CVE-2026-59273</strong> (RCE qua <code>ELRequestMatcher</code>). Xem <a href="@home@featured/vulnerabilities/spring-security-cve-2026-59273/analysis/">phân tích</a>'
      ja: '<strong>Spring Security</strong> を <strong>7.1.3 / 7.0.9 / 7.2.0</strong>（Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>）へ更新し <strong>CVE-2026-59273</strong> を修正（<a href="@home@featured/vulnerabilities/spring-security-cve-2026-59273/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay khi có thể (ưu tiên dự án bind <code>ELRequestMatcher</code>)
      ja: できるだけ早く（<code>ELRequestMatcher</code> バインド案件優先）
  - task:
      vi: 'Vá <strong>PHP</strong> lên <strong>8.2.36 / 8.3.37 / 8.4.28 / 8.5.13</strong> (hoặc 8.6.0), restart PHP-FPM/Apache và rebuild image; nâng nhánh 8.1 trở xuống. Xem <a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">phân tích</a>'
      ja: '<strong>PHP</strong> を <strong>8.2.36 / 8.3.37 / 8.4.28 / 8.5.13</strong>（または 8.6.0）へ更新し再起動・再ビルド（8.1 以前はブランチ移行、<a href="@home@featured/vulnerabilities/php-security-release-2026-11-19/advisory/">分析</a>）'
    sev: crit
    due:
      vi: Ngay lập tức (đã có bản vá từ 19-11-2026)
      ja: 即時（2026-11-19 修正版公開済み）
  - task:
