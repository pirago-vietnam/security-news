- title:
    vi: 2. Công cụ phát triển &amp; Môi trường IDE (Development Tools)
    ja: 2. 開発ツール・IDE環境（Development Tools）
  type: component
  rows:
  - name: Microsoft Visual Studio Code
    sev: crit
    summary:
      vi: '<strong>CVE-2026-120779</strong> (CVSS 9.6, RCE khi mở workspace độc hại), <strong>CVE-2026-120780</strong> (CVSS 8.3, bypass phân quyền → RCE) và <strong>CVE-2026-119982</strong> (vượt Workspace Trust).'
      ja: '<strong>CVE-2026-120779</strong>（CVSS 9.6、不正ワークスペースで RCE）、<strong>CVE-2026-120780</strong>（CVSS 8.3、権限バイパス RCE）、<strong>CVE-2026-119982</strong>（Workspace Trust 回避）。'
    impact:
      vi: 'VS Code &lt; <strong>1.145.3</strong> (Win/macOS/Linux), nhất là khi mở repo/URI <code>vscode://</code> chưa kiểm chứng.'
      ja: '<strong>1.145.3</strong> 未満の VS Code（Win/macOS/Linux）。未検証リポジトリや <code>vscode://</code> リンク利用時。'
    fix:
      vi: 'Nâng cấp lên <strong>1.145.3+</strong> và bật <strong>Workspace Trust</strong> (<code>security.workspace.trust.enabled: true</code>).'
      ja: '<strong>1.145.3 以上</strong>へ更新し、<strong>Workspace Trust</strong> を有効化。'
  - name: Microsoft Visual Studio
    sev: high
    summary:
      vi: '<strong>CVE-2026-114151</strong> &amp; <strong>CVE-2026-118745</strong>: RCE khi mở project file, custom MSBuild target hoặc dependency độc hại.'
      ja: '<strong>CVE-2026-114151</strong>・<strong>CVE-2026-118745</strong>：不正なプロジェクト／MSBuild ターゲット処理で RCE。'
    impact:
      vi: 'Visual Studio 2022 trên Windows khi mở solution (<code>.sln</code>, <code>.csproj</code>) từ bên ngoài.'
      ja: '外部の <code>.sln</code> / <code>.csproj</code> を開く Windows 版 Visual Studio 2022。'
    fix:
      vi: 'Cập nhật Visual Studio 2022 lên bản mới nhất tháng 11/2026 qua Visual Studio Installer.'
      ja: 'Visual Studio Installer から 2026年11月最新版へ更新。'
  - name: GitHub Actions (Self-Hosted Runners)
    sev: high
    summary:
      vi: '<strong>CVE-2026-11204</strong>: dọn dẹp sau job trên runner dùng chung có thể rò rỉ OIDC token tạm hoặc biến môi trường sang job sau.'
      ja: '<strong>CVE-2026-11204</strong>：共有ランナーのジョブ後クリーンアップ不備により OIDC トークン・環境変数が漏えいする恐れ。'
    impact:
      vi: 'Self-hosted runner dùng chung nhiều repo hoặc chạy workflow từ PR fork ngoài.'
      ja: '複数リポジトリ共有または外部 PR 実行を許可するセルフホストランナー。'
    fix:
      vi: 'Chuyển sang ephemeral single-use pod; đặt <code>permissions:</code> tối thiểu và pin SHA cho third-party Actions.'
      ja: '使い捨てポッドへ移行し、最小 <code>permissions:</code> とサードパーティ Action の SHA 固定を実施。'

