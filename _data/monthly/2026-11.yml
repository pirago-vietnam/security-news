h1:
  vi: Báo cáo bảo mật tháng 11/2026
  ja: 2026年11月 セキュリティレポート
sub:
  vi: 'Số liệu tính đến <strong>2026-11-23</strong> (cập nhật lỗ hổng Linux kernel NFSD CVE-2026-99362, cảnh báo FBI FLASH-20261113-001 về ARTEX &amp; sự cố/xâm nhập giữa tháng 11, lỗ hổng Linux KVM AMD CVE-2026-99312, nghiên cứu RCE engine cơ sở dữ liệu PostgreSQL/MySQL/Oracle/ClickHouse, đợt phát hành bảo mật PostgreSQL 52 CVEs, Patch Tuesday Microsoft, Chrome Zero-Day, Apache HTTP Server 2.4.71 và các bản tin an ninh định kỳ).'
  ja: '<strong>2026年11月23日</strong>時点の情報です（Linux カーネル NFSD 脆弱性 CVE-2026-99362、FBI FLASH-20261113-001（ARTEX）および11月中旬の障害・侵入事案、Linux KVM AMD 脆弱性 CVE-2026-99312、データベースエンジン RCE 研究（PostgreSQL/MySQL/Oracle/ClickHouse）、PostgreSQL 52件の脆弱性修正リリース、Microsoft Patch Tuesday、Chrome ゼロデイ緊急リリース、Apache HTTP Server 2.4.71 および定期セキュリティ情報に対応）。'
placeholder:
  vi: '🔍 Tìm kiếm CVE, framework, thư viện (vd: PostgreSQL, MySQL, Oracle, VS Code, Chrome, .NET, Tomcat, Next.js, AWS, ARTEX)...'
  ja: '🔍 CVE、フレームワーク、ライブラリで検索（例: PostgreSQL, MySQL, Oracle, VS Code, Chrome, .NET, Tomcat, Next.js, AWS, ARTEX）...'
scope:
  vi: '<strong>Phạm vi rà soát:</strong> Cơ sở dữ liệu (PostgreSQL, MySQL, Oracle, ClickHouse) · Công cụ &amp; Môi trường phát triển (VS Code, Visual Studio, GitHub Actions) · Trình duyệt (Chrome/V8) · Ngôn ngữ &amp; Runtimes (.NET, Linux, NodeJS, PHP, Java) · Frameworks (Next.js, Nuxt, Laravel, Spring Boot, Tomcat, Quasar) · Hạ tầng, Chuỗi cung ứng &amp; AI Agent (AWS, GCP, npm, PyPI, Composer, ARTEX) · Sự cố vận hành &amp; Xâm nhập (Microsoft 365, RIKEN Fugaku, Equinor).'
  ja: '<strong>調査範囲:</strong> データベース（PostgreSQL、MySQL、Oracle、ClickHouse） · 開発ツール・IDE環境（VS Code、Visual Studio、GitHub Actions） · ブラウザ（Chrome/V8） · 言語・ランタイム（.NET、Linux、NodeJS、PHP、Java） · フレームワーク（Next.js、Nuxt、Laravel、Spring Boot、Tomcat、Quasar） · クラウド・サプライチェーン・AIエージェント（AWS、GCP、npm、PyPI、Composer、ARTEX） · 障害・侵入事案（Microsoft 365、RIKEN富岳、Equinor）。'

card:
  title:
    vi: Báo cáo tháng 11/2026
    ja: 2026年11月レポート
  date:
    vi: Cập nhật đến 2026-11-23 · Định kỳ hàng tháng
    ja: 2026年11月23日 時点 · 月次定期レポート
  items:
  - sev: crit
    label: Linux kernel NFSD (CVE-2026-99362)
    text:
      vi: 'CVE-2026-99362 (CVSS 9.8): ghi tràn slab-out-of-bounds trong <code>nfsd4_sequence()</code> (NFSv4.1+, kernel ≥ 3.16), gây panic/DoS hoặc nguy cơ RCE. Đã vá ở upstream 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 và Debian DLA-4927-1; giới hạn cổng TCP/UDP 2049 hoặc tắt NFSv4.1+ nếu chưa vá được. Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">phân tích</a>.'
      ja: 'CVE-2026-99362（CVSS 9.8）：<code>nfsd4_sequence()</code>（NFSv4.1+、カーネル 3.16 以降）における slab-out-of-bounds 書き込み。パニック/DoS や RCE の恐れ。upstream 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 および Debian DLA-4927-1 で修正済み。未適用時は 2049番ポート制限または NFSv4.1+ 無効化を。<a href="@home@featured/linux-cve-2026-99362/analysis/">分析</a>を参照。'
  - sev: high
    label: PostgreSQL (RDBMS)
    text:
      vi: 'Đợt cập nhật bảo mật lớn vá 52 CVEs (32 lỗi CVSS 8.8, gồm CVE-2026-6460 RCE qua Type Confusion). Nâng cấp ngay lên 18.7/17.12/16.16/15.20/14.25; PostgreSQL 14 chính thức EOL.'
      ja: '52件のCVEを修正する大規模セキュリティリリース（型混乱RCE CVE-2026-6460など32件がCVSS 8.8）。直ちに 18.7/17.12/16.16/15.20/14.25 へ更新、PostgreSQL 14 は公式 EOL。'
  - sev: crit
    label: Database engines (PG/MySQL/Oracle)
    text:
      vi: 'Nghiên cứu "Narrow Grants, Wide Engines" (Depthfirst): quyền thấp (TEMPORARY / CREATE TEMPORARY TABLES) vẫn chạm tới lỗi bộ nhớ trong engine → RCE. Oracle DB CVE-2026-114819 (CVSS 9.9) + ORDS CVE-2026-91609; MySQL CVE-2026-101786 (26.7.0–26.7.1); PostgreSQL CVE-2026-116331 đã vá cùng bản 18.7/17.12/…; ClickHouse chưa có CVE. Vá Oracle (CSPU 11/2026) + ORDS, không để ORDS lộ internet. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '研究「Narrow Grants, Wide Engines」（Depthfirst）：低権限（TEMPORARY / CREATE TEMPORARY TABLES）でもエンジンのメモリ破壊に到達し RCE。Oracle DB CVE-2026-114819（CVSS 9.9）＋ ORDS CVE-2026-91609、MySQL CVE-2026-101786（26.7.0〜26.7.1）、PostgreSQL CVE-2026-116331 は 18.7/17.12/… と同じリリースで修正済み、ClickHouse は CVE なし。Oracle（2026年11月 CSPU）と ORDS を更新し、ORDS をインターネットに公開しない。<a href="@home@featured/database-rce-narrow-grants/analysis/">分析</a>を参照。'
  - sev: crit
    label: Apache HTTP Server
    text:
      vi: 'CVE-2026-119618: Lỗ hổng Race Condition trong mod_http2 dẫn đến heap corruption &amp; RCE (Critical). Nâng cấp ngay lên 2.4.71+ hoặc tạm tắt mod_http2.'
      ja: 'CVE-2026-119618: mod_http2 の競合状態によるヒープ破壊・RCE脆弱性（Critical）。直ちに 2.4.71+ へ更新、または一時的に mod_http2 を無効化。'
  - sev: crit
    label: PHP (đã phát hành bản vá)
    text:
      vi: 'PHP đã phát hành 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36 (và 8.6.0 GA) ngày 19-11, vá 17 CVE gồm 7 lỗi CVSS 9.2 và CVE-2026-115560 (session upload progress). Nâng phiên bản + restart; 8.1 trở xuống không có bản vá. Xem <a href="@home@featured/php-security-release-2026-11-19/advisory/">phân tích</a>.'
      ja: 'PHP が 11/19 に 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36（および 8.6.0 GA）を公開。CVSS 9.2 が 7 件を含む 17 件の CVE（CVE-2026-115560 セッション upload progress を含む）を修正。更新＋再起動を。8.1 以前は修正版なし。<a href="@home@featured/php-security-release-2026-11-19/advisory/">分析</a>を参照。'
  - sev: crit
    label: nginx (HTTP/2)
    text:
      vi: 'CVE-2026-123007 (nginx2root, CVSS 9.2 theo NetSPI): hỏng bộ nhớ trong HTTP/2 flow control, có thể RCE không cần xác thực (1.9.5–1.31.8). Nâng cấp lên 1.30.7 / 1.31.9 và restart, hoặc tạm tắt HTTP/2. Xem <a href="@home@featured/nginx-cve-2026-123007/analysis/">phân tích</a>.'
      ja: 'CVE-2026-123007（nginx2root、NetSPI による CVSS 9.2）：HTTP/2 フロー制御のメモリ破壊で認証不要 RCE の恐れ（1.9.5〜1.31.8）。1.30.7 / 1.31.9 へ更新し再起動、または一時的に HTTP/2 を無効化。<a href="@home@featured/nginx-cve-2026-123007/analysis/">分析</a>を参照。'
  - sev: high
    label: Java (Oracle JDK / OpenJDK)
    text:
      vi: 'CVE-2026-114938 (Java4Shell, CVSS 8.1): tràn heap ở Base64 decoder trên x86-64 AVX-512 (Java 17.0.6+, 21, 25, 27). Nâng JDK lên 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1 (Corretto 17.0.21.1.2) và restart. Xem <a href="@home@featured/java-cve-2026-114938/analysis/">phân tích</a>.'
      ja: 'CVE-2026-114938（Java4Shell, CVSS 8.1）：x86-64 AVX-512 上の Base64 デコーダーでヒープ破壊（Java 17.0.6+、21、25、27）。JDK を 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1（Corretto 17.0.21.1.2）へ更新し再起動。<a href="@home@featured/java-cve-2026-114938/analysis/">分析</a>を参照。'
  - sev: crit
    label: VS Code &amp; Dev Tools
    text:
      vi: 'CVE-2026-120779 / CVE-2026-120780: Lỗ hổng RCE nghiêm trọng (CVSS 9.6) qua workspace/repo độc hại. Nâng cấp ngay lên 1.145.3+ và bật Workspace Trust.'
      ja: 'CVE-2026-120779 / CVE-2026-120780: 悪意あるワークスペース/リポジトリによる重大なRCE脆弱性（CVSS 9.6）。直ちに 1.145.3+ へ更新し Workspace Trust を有効化。'
  - sev: crit
    label: Chrome / V8
    text:
      vi: 'Chrome 158 vá 204 lỗi bảo mật, gồm 6 lỗi Critical. Cập nhật Stable lên 158.0.8127.36 (Linux) / 158.0.8127.36 hoặc .37 (Windows/macOS); tiếp tục lưu ý zero-day CVE-2026-125350 đã được vá trước đó.'
      ja: 'Chrome 158 は Critical 6件を含む204件のセキュリティ修正を収録。Stable を Linux は 158.0.8127.36、Windows/macOS は 158.0.8127.36 または .37 に更新。以前修正されたゼロデイ CVE-2026-125350 にも引き続き注意。'
  - sev: high
    label: .NET &amp; Frameworks
    text:
      vi: 'Patch Tuesday tháng 11 vá .NET 10/9/8; Apache Tomcat lỗi bypass xác thực SASL (CVSS 9.1); Next.js 16.4.5 vá RCE App Router cache; Nuxt lên 4.6.3.'
      ja: '11月 Patch Tuesday による .NET 10/9/8 修正。Apache Tomcat の SASL 認証バイパス（CVSS 9.1）、Next.js 16.4.5 の App Router キャッシュ RCE 修正、Nuxt 4.6.3 更新。'
  - sev: high
    label: Hạ tầng &amp; Chuỗi cung ứng
    text:
      vi: 'AWS Nitro Enclave (CVE-2026-98433); GCP Cloud Run/Vertex sandbox escape (CVE-2026-98512); cảnh báo chiến dịch npm/PyPI giả mạo công cụ MCP nhắm vào AI agent.'
      ja: 'AWS Nitro Enclave（CVE-2026-98433）、GCP Cloud Run/Vertex サンドボックス脱出（CVE-2026-98512）、AIエージェントを標的とした悪意ある MCP パッケージの検知。'
  - sev: high
    label: ARTEX (FBI FLASH) &amp; Sự cố 11/2026
    text:
      vi: 'FBI FLASH-20261113-001 cảnh báo framework AI tấn công ARTEX (chiếm quyền đặc quyền &lt;3 giờ, nhắm hệ thống ngoại vi &amp; AI agent); RIKEN Fugaku và Equinor bị xâm nhập thật, còn các sự cố Microsoft 365, FAA, Chase, NSANet, Apple (12–17/11) đều là lỗi nội bộ/nâng cấp, không phải tấn công mạng.'
      ja: 'FBI FLASH-20261113-001 が AI 攻撃フレームワーク ARTEX を警告（3時間未満で特権奪取、周辺システム・AI エージェントを標的）。RIKEN富岳と Equinor は実侵害であった一方、Microsoft 365・FAA・Chase・NSANet・Apple（11/12〜17）の障害はいずれも内部変更や不具合によるものでサイバー攻撃ではない。'

sections:
- title:
    vi: 1. Việc cần làm ngay
    ja: 1. 今すぐ対応すべき事項
  type: actions
  rows:
  - task:
      vi: 'Rà soát máy chủ <strong>Linux NFS (nfsd NFSv4.1+)</strong>: cập nhật kernel vá <strong>CVE-2026-99362</strong> (CVSS 9.8, <code>6.12.117</code> / <code>6.18.61</code> / <code>7.3.2</code> / <code>7.4-rc1</code> hoặc Debian DLA-4927-1) và reboot, hoặc siết firewall cổng 2049 / tắt tạm NFSv4.1+. Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">phân tích</a>'
      ja: '<strong>Linux NFS サーバー（nfsd NFSv4.1+）</strong>を点検：<strong>CVE-2026-99362</strong> 修正カーネル（CVSS 9.8、<code>6.12.117</code> / <code>6.18.61</code> / <code>7.3.2</code> / <code>7.4-rc1</code> または Debian DLA-4927-1）へ更新・再起動、または 2049番ポートのファイアウォール制限／NFSv4.1+ 一時無効化を実施（<a href="@home@featured/linux-cve-2026-99362/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay lập tức
      ja: 即時対応
    impact:
      vi: 'Máy chủ Linux kernel ≥ 3.16 chạy <code>nfsd</code> có bật NFSv4.1+ (cổng TCP/UDP 2049), đặc biệt file server dùng chung mạng nội bộ đa tenant hoặc mở cổng ra ngoài. Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">phân tích</a>.'
      ja: 'NFSv4.1+ を有効にして <code>nfsd</code> を稼働させている Linux カーネル 3.16 以降のサーバー（TCP/UDP 2049番ポート）。マルチテナント内部網や外部公開環境で特に影響大（<a href="@home@featured/linux-cve-2026-99362/analysis/">分析</a>）。'
    fix:
      vi: 'Cập nhật kernel lên <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong> (hoặc Debian <code>DLA-4927-1</code>) rồi reboot. Tạm thời: chỉ cho phép IP client tin cậy vào cổng 2049 hoặc tắt NFSv4.1/4.2. Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">phân tích &amp; hướng dẫn</a>.'
      ja: 'カーネルを <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong>（または Debian <code>DLA-4927-1</code>）へ更新して再起動。暫定：2049番ポートを信頼済みクライアント IP のみに制限するか NFSv4.1/4.2 を無効化（<a href="@home@featured/linux-cve-2026-99362/analysis/">分析・対策ガイド</a>）。'
  - task:
      vi: 'Kiểm kê và nâng cấp <strong>Spring Security</strong> lên <strong>7.1.3 / 7.0.9 / 7.2.0</strong> (hoặc <strong>Spring Boot 4.1.3 / 4.0.10 / 4.2.0</strong>) để vá <strong>CVE-2026-59273</strong> (CVSS 9.8, RCE qua <code>ELRequestMatcher</code> khi bind input ngoài). Xem <a href="@home@featured/spring-security-cve-2026-59273/analysis/">phân tích</a>'
      ja: '<strong>Spring Security</strong> を <strong>7.1.3 / 7.0.9 / 7.2.0</strong>（または <strong>Spring Boot 4.1.3 / 4.0.10 / 4.2.0</strong>）へ更新し <strong>CVE-2026-59273</strong>（CVSS 9.8、外部入力バインド時の <code>ELRequestMatcher</code> 経由 RCE）を修正（<a href="@home@featured/spring-security-cve-2026-59273/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay khi có thể (ưu tiên dự án dùng <code>ELRequestMatcher</code> với data binding)
      ja: できるだけ早く（データバインドで <code>ELRequestMatcher</code> を使う案件を優先）
  - task:
      vi: 'Vá <strong>PHP</strong> lên <strong>8.2.36 / 8.3.37 / 8.4.28 / 8.5.13</strong> (hoặc 8.6.0): restart PHP-FPM/Apache, rebuild image; nhánh 8.1 trở xuống cần nâng nhánh. Xem <a href="@home@featured/php-security-release-2026-11-19/advisory/">phân tích</a>'
      ja: '<strong>PHP</strong> を <strong>8.2.36 / 8.3.37 / 8.4.28 / 8.5.13</strong>（または 8.6.0）へ更新：PHP-FPM/Apache 再起動、イメージ再ビルド。8.1 以前はブランチ更新が必要（<a href="@home@featured/php-security-release-2026-11-19/advisory/">分析</a>）'
    sev: crit
    due:
      vi: Ngay trong ngày 19-11-2026 (bản vá đã phát hành, vá + restart sớm nhất có thể)
      ja: 2026-11-19 当日（修正版は公開済み。できるだけ早く更新＋再起動）
    impact:
      vi: 'Mọi ứng dụng PHP (PHP-FPM, mod_php, FrankenPHP, Laravel, WordPress), Docker image <code>php:*</code>, hosting managed.'
      ja: 'すべての PHP アプリケーション（PHP-FPM、mod_php、FrankenPHP、Laravel、WordPress）、<code>php:*</code> イメージ、マネージドホスティング。'
    fix:
      vi: 'Sau khi có bản vá: nâng PHP, restart (reload không đủ), rebuild image. PHP 8.1 trở xuống dự kiến không có bản vá, cần nâng nhánh.'
      ja: '修正版公開後：PHP を更新して再起動（reload では不十分）、イメージ再ビルド。PHP 8.1 以下は修正版が出ない見込みのためブランチ移行が必要。'
  - task:
      vi: 'Vá <strong>engine cơ sở dữ liệu</strong> theo nghiên cứu "Narrow Grants, Wide Engines": <strong>Oracle Database</strong> bản cập nhật CSPU 11/2026 (<strong>CVE-2026-114819</strong>, CVSS 9.9) + <strong>ORDS</strong> bản sau 26.2.1 từ CPU 10/2026 (<strong>CVE-2026-91609</strong>) và không để ORDS lộ internet; <strong>MySQL Server/Cluster 26.7.x</strong> lên bản sau 26.7.1 (<strong>CVE-2026-101786</strong>); xác nhận <strong>PostgreSQL</strong> đã ở 18.7 / 17.12 / 16.16 / 15.20 / 14.25 (<strong>CVE-2026-116331</strong> vá cùng bản); <strong>ClickHouse</strong>: hạn chế quyền tạo bảng tạm và khóa <code>format_binary_max_string_size</code> bằng settings constraints; rà soát quyền <code>TEMPORARY</code> / <code>CREATE TEMPORARY TABLES</code>. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích</a>'
      ja: '研究「Narrow Grants, Wide Engines」を受けた<strong>データベースエンジン</strong>の更新：<strong>Oracle Database</strong> に 2026年11月 CSPU（<strong>CVE-2026-114819</strong>、CVSS 9.9）、<strong>ORDS</strong> を 2026年10月 CPU の 26.2.1 より新しい版へ（<strong>CVE-2026-91609</strong>）更新し ORDS をインターネットに公開しない。<strong>MySQL Server/Cluster 26.7.x</strong> を 26.7.1 より新しい版へ（<strong>CVE-2026-101786</strong>）。<strong>PostgreSQL</strong> が 18.7 / 17.12 / 16.16 / 15.20 / 14.25 であることを確認（<strong>CVE-2026-116331</strong> は同リリースで修正）。<strong>ClickHouse</strong> は一時テーブル作成権限を制限し、settings constraints で <code>format_binary_max_string_size</code> を固定。<code>TEMPORARY</code> / <code>CREATE TEMPORARY TABLES</code> 権限を棚卸し（<a href="@home@featured/database-rce-narrow-grants/analysis/">分析</a>）'
    sev: crit
    due:
      vi: Ngay lập tức với ORDS lộ internet và Oracle DB; MySQL 26.7.x / ClickHouse trước 26-11-2026
      ja: インターネット公開の ORDS と Oracle DB は即時、MySQL 26.7.x / ClickHouse は 2026年11月26日まで
    impact:
      vi: 'Oracle Database 19.3–19.32 / 21.3–21.24 / 23.4.0–23.26.3, ORDS 24.2.0–26.2.1, MySQL Server/Cluster 26.7.0–26.7.1, PostgreSQL 14–18 chưa lên bản 12-11, ClickHouse cho phép user tự đổi <code>format_binary_max_string_size</code>. Dịch vụ managed (RDS/Aurora, Cloud SQL...) do nhà cung cấp vá theo lịch bảo trì, chưa xác minh từng nhà cung cấp.'
      ja: 'Oracle Database 19.3〜19.32 / 21.3〜21.24 / 23.4.0〜23.26.3、ORDS 24.2.0〜26.2.1、MySQL Server/Cluster 26.7.0〜26.7.1、11/12 リリース未適用の PostgreSQL 14〜18、ユーザーが <code>format_binary_max_string_size</code> を変更できる ClickHouse。マネージドサービス（RDS/Aurora、Cloud SQL など）は事業者がメンテナンスで適用（事業者ごとの確認は未実施）。'
    fix:
      vi: 'Áp bản vá Oracle (CSPU 11/2026) và ORDS (CPU 10/2026), MySQL bản sau 26.7.1 (xem release notes), PostgreSQL 18.7/17.12/16.16/15.20/14.25. Giảm bề mặt (không thay bản vá): <code>REVOKE TEMPORARY ON DATABASE &lt;db&gt; FROM PUBLIC;</code> với role không cần; thu hồi <code>CREATE TEMPORARY TABLES</code> ở MySQL/ClickHouse. REVOKE TEMPORARY không giúp gì cho đường tấn công Oracle.'
      ja: 'Oracle（2026年11月 CSPU）と ORDS（2026年10月 CPU）、MySQL は 26.7.1 より新しい版（リリースノート参照）、PostgreSQL は 18.7/17.12/16.16/15.20/14.25 を適用。攻撃面の縮小（修正の代替ではない）：不要なロールに <code>REVOKE TEMPORARY ON DATABASE &lt;db&gt; FROM PUBLIC;</code>、MySQL/ClickHouse の <code>CREATE TEMPORARY TABLES</code> を剥奪。REVOKE TEMPORARY は Oracle の経路には効果なし。'
