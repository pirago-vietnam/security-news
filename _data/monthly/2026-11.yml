- title:
    vi: 2. Công cụ phát triển &amp; Môi trường IDE (Development Tools)
    ja: 2. 開発ツール・IDE環境（Development Tools）
  type: component
  rows:
  - name: Microsoft Visual Studio Code
    sev: crit
    summary:
      vi: 'Bản tin Patch Tuesday tháng 11/2026: <strong>CVE-2026-120779 (CVSS 9.6 - Critical)</strong> lỗi Code Injection (CWE-94) dẫn tới Remote Code Execution không cần xác thực khi mở workspace/repo chứa cấu hình độc hại; <strong>CVE-2026-120780 (CVSS 8.3 - High)</strong> lỗi bypass phân quyền dẫn đến RCE; <strong>CVE-2026-119982</strong> lỗi vượt rào kiểm soát Workspace Trust khi tải workspace từ xa.'
      ja: '2026年11月 Patch Tuesday：<strong>CVE-2026-120779（CVSS 9.6 - Critical）</strong>悪意ある設定を含むワークスペース/リポジトリを開くことで認証不要でリモートコード実行（RCE）に至るコードインジェクション（CWE-94）、<strong>CVE-2026-120780（CVSS 8.3 - High）</strong>アクセス制御不備によるRCE、<strong>CVE-2026-119982</strong> リモートワークスペース取得時のWorkspace Trustバイパスを修正。'
    impact:
      vi: 'Mọi lập trình viên và kỹ sư sử dụng Visual Studio Code (Windows, macOS, Linux) phiên bản trước 1.145.3. Nguy cơ đặc biệt cao khi clone repo mã nguồn mở chưa kiểm chứng, tải zip project từ bên ngoài hoặc nhấp vào liên kết URI <code>vscode://</code> được kẻ tấn công gài bẫy.'
      ja: 'バージョン 1.145.3 未満の Visual Studio Code を利用する全開発者・エンジニア（Windows、macOS、Linux）。第三者から提供されたリポジトリ、未検証のオープンソースコード、または <code>vscode://</code> 形式の悪意あるURIリンクを開いた際に重大な侵害リスク。'
    fix:
      vi: 'Nâng cấp ngay lên Visual Studio Code <strong>1.145.3 trở lên</strong> qua menu <strong>Help &gt; Check for Updates</strong> hoặc tải bản mới nhất từ trang chủ Microsoft. Đảm bảo bật <strong>Workspace Trust</strong> (<code>security.workspace.trust.enabled: true</code>), không bấm "Trust" đối với thư mục hoặc repo chưa rõ nguồn gốc.'
      ja: 'ヘルプメニュー（<strong>Help &gt; Check for Updates</strong>）または公式サイトから <strong>1.145.3 以上</strong>へ直ちに更新してください。<strong>Workspace Trust</strong>（<code>security.workspace.trust.enabled: true</code>）を必ず有効にし、出所不明のリポジトリで信頼（Trust）を許可しないでください。'
  - name: Microsoft Visual Studio
    sev: high
    summary:
      vi: 'Đợt cập nhật Patch Tuesday tháng 11/2026 vá <strong>CVE-2026-114151</strong> và <strong>CVE-2026-118745</strong>: Lỗ hổng thực thi mã tùy ý (RCE / Arbitrary Code Execution) khi mở project file, custom MSBuild target hoặc tải dependency package chứa mã khai thác.'
      ja: '2026年11月 Patch Tuesday にて <strong>CVE-2026-114151</strong> および <strong>CVE-2026-118745</strong> を修正。悪意あるプロジェクトファイル、カスタム MSBuild ターゲット、またはパッケージ依存関係の処理時に任意コード実行（RCE）に至る脆弱性。'
    impact:
      vi: 'Kỹ sư phát triển phần mềm sử dụng Microsoft Visual Studio 2022 trên Windows khi mở các solution (.sln, .csproj) từ nguồn bên ngoài.'
      ja: '外部から取得したソリューション（.sln、.csproj）を開く Windows 環境の Visual Studio 2022 利用エンジニア。'
    fix:
      vi: 'Mở Visual Studio Installer và cập nhật Visual Studio 2022 lên bản phát hành mới nhất tháng 11/2026.'
      ja: 'Visual Studio Installer を起動し、Visual Studio 2022 を2026年11月の最新サービスリリースに更新してください。'
  - name: GitHub Actions (Self-Hosted Runners)
    sev: high
    summary:
      vi: 'Advisory <strong>CVE-2026-11204</strong>: Lỗ hổng phạm vi và lưu vết token trên runner tự host (Self-Hosted Runner Controller). Quá trình dọn dẹp sau job trên các runner dùng chung có thể để rò rỉ OIDC token tạm thời hoặc biến môi trường sang các job tiếp theo từ các PR khác nhau.'
      ja: 'セキュリティアドバイザリ <strong>CVE-2026-11204</strong>：セルフホスト型 GitHub Actions ランナーコントローラーにおけるトークン永続化・漏えいの脆弱性。共有ランナーでのジョブ完了後のクリーンアップ不備により、異なるPR送信者の後続ジョブに一時的な OIDC トークンや環境変数が漏えいするリスク。'
    impact:
      vi: 'Các hệ thống CI/CD sử dụng GitHub Actions self-hosted runner dùng chung giữa các repository hoặc cho phép workflow chạy từ pull request nhánh ngoài/fork.'
      ja: '複数リポジトリで共有されているセルフホスト型ランナー、または外部フォークからの PR でワークフロー実行を許可している CI/CD パイプライン。'
    fix:
      vi: 'Chuyển toàn bộ hạ tầng runner tự host sang dạng container pod dùng một lần (ephemeral single-use pods). Áp dụng chặt chẽ khối <code>permissions:</code> tối thiểu trong file workflow (vd: <code>contents: read</code>) và pin SHA commit đối với third-party Actions.'
      ja: 'セルフホストランナー基盤を使い捨てコンテナポッド（ephemeral single-use pods）へ移行してください。ワークフロー定義内で最小限の <code>permissions:</code>（例: <code>contents: read</code>）を明示し、外部アクションはコミットSHAで固定してください。'

- title:
    vi: 3. Trình duyệt &amp; Chuỗi cung ứng Package (Browsers &amp; Package Registries)
    ja: 3. ブラウザおよびパッケージサプライチェーン（Browsers &amp; Package Registries）
  type: component
  rows:
  - name: Google Chrome &amp; Chromium
    sev: crit
    summary:
      vi: 'Ngày 17-11, Google phát hành <strong>Chrome 158</strong> với <strong>204 bản sửa bảo mật</strong>, gồm 6 lỗi Critical: <strong>CVE-2026-130963</strong> (use-after-free trong WebView), <strong>CVE-2026-131031</strong> (ghi ngoài phạm vi trong GPU), <strong>CVE-2026-131060</strong> (tràn bộ đệm trong Media), <strong>CVE-2026-131008</strong> (use-after-free trong GarbageCollection), <strong>CVE-2026-131054</strong> (ghi ngoài phạm vi trong ANGLE) và <strong>CVE-2026-130975</strong> (use-after-free trong WebAudio). Trước đó, Google đã vá zero-day <strong>CVE-2026-125350</strong> đang bị khai thác trong XML.'
      ja: 'Google は11月17日、<strong>Chrome 158</strong> で <strong>204件のセキュリティ修正</strong>を公開。Critical は6件：<strong>CVE-2026-130963</strong>（WebView の use-after-free）、<strong>CVE-2026-131031</strong>（GPU の範囲外書き込み）、<strong>CVE-2026-131060</strong>（Media のバッファオーバーフロー）、<strong>CVE-2026-131008</strong>（GarbageCollection の use-after-free）、<strong>CVE-2026-131054</strong>（ANGLE の範囲外書き込み）、<strong>CVE-2026-130975</strong>（WebAudio の use-after-free）。以前には悪用が確認された XML のゼロデイ <strong>CVE-2026-125350</strong> も修正済み。'
    impact:
      vi: 'Toàn bộ người dùng duyệt web bằng Google Chrome, Microsoft Edge, Brave, Opera trên Windows, macOS và Linux. Các tiến trình headless Chromium / Puppeteer phục vụ render trang.'
      ja: 'Windows、macOS、Linux 上で Google Chrome、Microsoft Edge、Brave、Opera を利用する全ユーザー、およびページ描画処理を行うヘッドレス Chromium / Puppeteer 環境。'
    fix:
      vi: 'Cập nhật Chrome Stable qua <strong>Settings &gt; About Google Chrome</strong> lên <strong>158.0.8127.36</strong> (Linux) hoặc <strong>158.0.8127.36/.37</strong> (Windows/macOS), hoặc bản mới hơn, rồi khởi động lại. Google triển khai dần trong những ngày hoặc tuần tới; kiểm tra thông báo riêng cho Extended Stable và các trình duyệt Chromium khác.'
      ja: '<strong>Settings &gt; About Google Chrome</strong> から Chrome Stable を Linux は <strong>158.0.8127.36</strong>、Windows/macOS は <strong>158.0.8127.36/.37</strong> 以降に更新し、再起動してください。Google は数日から数週間かけて順次配信します。Extended Stable および他の Chromium 系ブラウザは各提供元の情報を確認してください。'
  - name: npm &amp; PyPI (AI Coding Agent Supply Chain)
    sev: high
    summary:
      vi: 'Phát hiện chiến dịch diện rộng với hơn 140 package mã độc trên npm và PyPI mạo danh các máy chủ giao thức Model Context Protocol (MCP), tool connector và tiện ích hỗ trợ AI coding agent. Khi được agent hoặc kỹ sư cài đặt thử nghiệm, mã độc âm thầm quét và exfiltrate các file <code>.env</code>, private key SSH, và thông tin xác thực AWS (<code>~/.aws/credentials</code>).'
      ja: 'Model Context Protocol（MCP）サーバー、ツールコネクタ、AIコーディングアシスタントの支援ツールを装った140件以上の悪意ある npm/PyPI パッケージによる協調攻撃を検知。エージェントや開発者がインストール・実行した際、<code>.env</code>、SSH秘密鍵、AWS認証情報（<code>~/.aws/credentials</code>）を外部へ不正送信。'
    impact:
      vi: 'Máy trạm của kỹ sư sử dụng các công cụ AI coding assistant (Claude Code, Cursor, Copilot Workspace...), môi trường dev/staging có cài đặt package mới chưa qua kiểm duyệt.'
      ja: 'AIコーディング支援ツール（Claude Code、Cursor、Copilot 等）を利用する開発環境、未検証パッケージをインストールする開発・ステージング環境。'
    fix:
      vi: 'Tuân thủ nghiêm ngặt việc khóa phiên bản bằng lockfile (<code>npm ci</code>, <code>pnpm-lock.yaml</code>). Kiểm tra kỹ nguồn gốc package và tác giả trước khi cấu hình MCP server hoặc cho phép AI agent cài đặt thư viện mới. Sử dụng các công cụ quét chuỗi cung ứng (Socket.dev, GitHub Dependency Review).'
      ja: 'ロックファイルによる依存関係固定（<code>npm ci</code>、<code>pnpm-lock.yaml</code>）を徹底してください。MCP サーバー登録や AI エージェントによるライブラリ自動追加の前にパッケージの出所を必ず監査してください。Socket.dev や GitHub Dependency Review による検証を推奨します。'
  - name: PHP Composer
    sev: high
    summary:
      vi: '<strong>CVE-2026-109620 (Critical)</strong>: Lỗ hổng Object Injection và Remote Code Execution trong các package tiện ích phổ biến thuộc hệ sinh thái Composer, phát sinh trong quá trình tự động phân giải phụ thuộc và ghi cache.'
      ja: '<strong>CVE-2026-109620（Critical）</strong>：Composer エコシステム内の主要ユーティリティパッケージにおけるオブジェクト注入およびリモートコード実行（RCE）の脆弱性。依存関係の自動解決およびキャッシュ生成時にトリガーされる恐れ。'
    impact:
      vi: 'Ứng dụng PHP và hệ thống CI/CD tự động chạy <code>composer install</code> hoặc <code>composer update</code> chứa các package bị ảnh hưởng.'
      ja: '影響を受けるパッケージを利用し、<code>composer install</code> や <code>composer update</code> を実行する PHP アプリケーションおよび CI/CD 環境。'
    fix:
      vi: 'Chạy lệnh <code>composer audit</code> để rà soát toàn bộ dependency tree; nâng cấp các package bị cảnh báo lên bản phát hành mới nhất.'
      ja: '<code>composer audit</code> を実行して依存関係ツリー全体を監査し、警告対象パッケージを最新パッチ適用版へ更新してください。'

- title:
    vi: 4. Hệ điều hành &amp; Ngôn ngữ lập trình (OS &amp; Languages)
    ja: 4. OSおよびプログラミング言語（OS &amp; Languages）
  type: component
  rows:
  - name: Linux kernel NFSD (NFSv4.1+)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-99362</strong> (CVSS <strong>9.8</strong> - Critical): lỗi trong <code>nfsd4_sequence()</code> khi client thương lượng <code>ca_maxresponsesize_cached</code> ở mức tối thiểu (<code>NFSD_MIN_HDR_SEQ_SZ</code>, cấp phát slot <code>sl_data[]</code> độ dài 0) nhưng gửi yêu cầu <code>COMPOUND</code> đặc biệt khiến <code>nfsd4_store_cache_entry</code> ghi phản hồi vượt ranh giới slot (<code>KASAN: slab-out-of-bounds</code> trong <code>read_bytes_from_xdr_buf</code>) → hỏng bộ nhớ kernel, panic/DoS hoặc nguy cơ thực thi mã từ xa. Đã vá ở upstream <code>6.12.117</code>, <code>6.18.61</code>, <code>7.3.2</code>, <code>7.4-rc1</code> và Debian 12 LTS (<code>DLA-4927-1</code>); RHEL, Ubuntu và Amazon Linux đang chờ bản cập nhật. Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">bài phân tích chuyên sâu</a>.'
      ja: '<strong>CVE-2026-99362</strong>（CVSS <strong>9.8</strong> - Critical）：<code>nfsd4_sequence()</code> においてクライアントが <code>ca_maxresponsesize_cached</code> を最小値（<code>NFSD_MIN_HDR_SEQ_SZ</code>、長さ 0 の <code>sl_data[]</code> スロット割当）に設定した状態で細工された <code>COMPOUND</code> 要求を送信すると、<code>nfsd4_store_cache_entry</code> がスロット境界外へ書き込み（<code>read_bytes_from_xdr_buf</code> での <code>KASAN: slab-out-of-bounds</code>）、カーネルメモリ破壊・パニック/DoS やリモートコード実行に至る恐れ。upstream <code>6.12.117</code> / <code>6.18.61</code> / <code>7.3.2</code> / <code>7.4-rc1</code> および Debian 12 LTS（<code>DLA-4927-1</code>）で修正済み。RHEL・Ubuntu・Amazon Linux は修正待ち。<a href="@home@featured/linux-cve-2026-99362/analysis/">詳細分析ページ</a>を参照。'
    impact:
      vi: 'Máy chủ Linux chạy kernel &ge; <code>3.16</code> có bật dịch vụ <code>nfsd</code> hỗ trợ NFSv4.1+ (cổng TCP/UDP 2049), bao gồm file server nội bộ, NAS Linux và node lưu trữ chia sẻ.'
      ja: 'NFSv4.1+ を有効にして <code>nfsd</code> を稼働させている Linux カーネル <code>3.16</code> 以降のサーバー（TCP/UDP 2049番ポート）。社内ファイルサーバー、Linux ベース NAS、共有ストレージノードが対象。'
    fix:
      vi: 'Cập nhật kernel lên <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong> (hoặc bản distro như Debian <code>DLA-4927-1</code>: <code>linux-6.12</code> <code>6.12.117-1~deb12u1</code>) và reboot. Tạm thời: siết firewall/security group cổng 2049 chỉ cho IP client tin cậy, hoặc tắt NFSv4.1/4.2 trong <code>/etc/nfs.conf</code> (hoặc dừng <code>nfs-server</code> nếu không sử dụng). Xem <a href="@home@featured/linux-cve-2026-99362/analysis/">hướng dẫn chi tiết</a>.'
      ja: 'カーネルを <strong>6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1</strong>（または Debian <code>DLA-4927-1</code>：<code>linux-6.12</code> <code>6.12.117-1~deb12u1</code> 等のディストリ修正版）へ更新し再起動してください。暫定対策として、ファイアウォールで2049番ポートを信頼済みクライアントのみに制限するか、<code>/etc/nfs.conf</code> で NFSv4.1/4.2 を無効化（不要なら <code>nfs-server</code> を停止）してください。<a href="@home@featured/linux-cve-2026-99362/analysis/">詳細ガイド</a>を参照。'
  - name: Linux kernel KVM (AMD)
    sev: high
    summary:
      vi: '<strong>CVE-2026-99312</strong> (<code>CWE-825</code>, CVSS v3.1 <strong>8.8</strong> theo Linux CNA / 7.8 theo Red Hat &amp; SUSE): lỗi không reset ngữ cảnh MMU khi mô phỏng <code>INIT</code> ở trạng thái <code>CR0.PG=0</code> trên AMD SVM bật nested virtualization → Page-Table UAF cho phép guest thoát VM đọc/ghi RAM vật lý host (đã chứng minh đọc ~127 GB RAM trên DigitalOcean Droplet). Đã vá ở upstream <code>6.12.118</code>, <code>6.18.64</code>, <code>7.3.5</code>, <code>7.4-rc2</code>; SUSE (SP7/16.x/Micro 6.x), Debian sid và DigitalOcean đã vá; RHEL 9/10, Ubuntu 22.04/24.04 và Debian 12/13 đang chờ. Xem <a href="@home@featured/linux-cve-2026-99312/analysis/">bài phân tích chuyên sâu</a>.'
      ja: '<strong>CVE-2026-99312</strong>（<code>CWE-825</code>、Linux CNA CVSS v3.1 <strong>8.8</strong> / Red Hat・SUSE 7.8）：nested virtualization 有効な AMD SVM 環境で <code>CR0.PG=0</code> のまま <code>INIT</code> エミュレーション時に MMU を初期化せず、ページテーブル UAF によりゲストからホスト物理 RAM を読み書き可能（DigitalOcean Droplet で約127GB読取実証）。upstream <code>6.12.118</code> / <code>6.18.64</code> / <code>7.3.5</code> / <code>7.4-rc2</code>、SUSE（SP7/16.x/Micro 6.x）、Debian sid、DigitalOcean で対応済み。RHEL 9/10・Ubuntu・Debian 12/13 は修正待ち。<a href="@home@featured/linux-cve-2026-99312/analysis/">詳細分析ページ</a>を参照。'
    impact:
      vi: 'Chỉ ảnh hưởng máy chủ hypervisor Linux KVM dùng CPU <strong>AMD</strong>, bật <code>kvm_amd.nested=1</code> và chạy kernel từ <code>5.15.81</code> trở lên (trừ <code>5.10.y</code>, <code>5.4.y</code>, Intel VMX và cloud VM khách thông thường).'
      ja: '<strong>AMD</strong> CPU を搭載し <code>kvm_amd.nested=1</code> を有効化したカーネル <code>5.15.81</code> 以降の Linux KVM ハイパーバイザーのみ対象（<code>5.10.y</code>・<code>5.4.y</code>・Intel VMX・通常のクラウド VM ゲストは対象外）。'
    fix:
      vi: 'Cập nhật kernel host lên bản đã vá và reboot. Nếu chưa thể vá ngay và không cần chạy VM lồng nhau, tắt nested virtualization: <code>modprobe -r kvm_amd &amp;&amp; modprobe kvm_amd nested=0</code> và lưu vào <code>/etc/modprobe.d/</code>.'
      ja: 'ホストカーネルを修正版へ更新して再起動してください。即時更新が困難で L2 仮想化が不要な場合は、<code>modprobe -r kvm_amd &amp;&amp; modprobe kvm_amd nested=0</code> で無効化し <code>/etc/modprobe.d/</code> に永続化してください。'
  - name: Linux kernel
    sev: high
    summary:
      vi: 'Tiếp tục theo dõi <strong>CVE-2026-98432</strong> (use-after-free trong ngăn xếp IPv4 TCP khi xử lý IP options, nguy cơ thực thi mã qua MPTCP handshake, CVSS 9.8). Amazon Linux (AL2/AL2023) đã có kernel vá chính thức; Ubuntu các bản 22.04 / 24.04 tiếp tục phát hành USN. Xem chi tiết tại <a href="@home@featured/linux-cve-2026-98432/analysis/">bài phân tích chuyên sâu</a>.'
      ja: '<strong>CVE-2026-98432</strong>（IPオプション処理時のIPv4 TCPスタックにおけるuse-after-free、MPTCPハンドシェイク経由のコード実行リスク、CVSS 9.8）の追跡。Amazon Linux（AL2/AL2023）は公式パッチ済み。Ubuntu 22.04 / 24.04 はUSNアップデートを継続配布中。<a href="@home@featured/linux-cve-2026-98432/analysis/">詳細分析ページ</a>を参照。'
    impact:
      vi: 'Máy chủ Linux mở cổng TCP trực tiếp ra internet hoặc bật MPTCP (Go 1.24+ bật mặc định trên Linux), máy chủ đứng sau NLB TCP pass-through listener.'
      ja: 'TCPポートを直接インターネット公開しているLinuxサーバー、MPTCPが有効な環境（Linux上のGo 1.24+でデフォルト有効）、NLB TCPパススルー配下のサーバー。'
    fix:
      vi: 'Cập nhật kernel bản mới nhất và reboot máy chủ. Nếu chưa thể reboot, áp dụng cấu hình nftables/iptables u32 chặn gói IPv4 chứa IP options hoặc tắt MPTCP (<code>sysctl -w net.mptcp.enabled=0</code>).'
      ja: '最新カーネルに更新して再起動してください。即時再起動が困難な場合は、nftables/iptables u32でIPオプション付きパケットを遮断するか、MPTCPを無効化（<code>sysctl -w net.mptcp.enabled=0</code>）してください。'
  - name: .NET (gồm ASP.NET Core)
    sev: high
    summary:
      vi: 'Đợt cập nhật Patch Tuesday 10-11-2026: <strong>CVE-2026-118746 (CVSS 6.8)</strong> lỗi Security Feature Bypass trong cơ chế Unix Negotiate authentication khi thiếu thông tin channel-binding; <strong>CVE-2026-114146 / CVE-2026-114147</strong> lỗi leo thang đặc quyền (EoP) và từ chối dịch vụ (DoS) trong middleware xử lý request của ASP.NET Core.'
      ja: '2026年11月10日 Patch Tuesday：<strong>CVE-2026-118746（CVSS 6.8）</strong>チャネルバインディング情報欠落時に不正リクエストを許容する Unix Negotiate 認証バイパス脆弱性、<strong>CVE-2026-114146 / CVE-2026-114147</strong> ASP.NET Core リクエスト処理・ミドルウェアにおける特権昇格（EoP）およびサービス拒否（DoS）。'
    impact:
      vi: 'Dịch vụ backend chạy .NET 8.0, 9.0, 10.0 trên Linux/Docker hoặc sử dụng middleware ASP.NET Core xử lý request công khai.'
      ja: 'Linux/Docker 環境で .NET 8.0、9.0、10.0 を稼働させているバックエンドサービス、および外部リクエストを受け付ける ASP.NET Core ミドルウェア。'
    fix:
      vi: 'Cập nhật .NET SDK và runtime lên <strong>10.0.15</strong>, <strong>9.0.23</strong>, <strong>8.0.34</strong> (hoặc SDK 11.0.100+). Rebuild lại các Docker container sử dụng base image .NET cập nhật tháng 11/2026.'
      ja: '.NET SDK およびランタイムを <strong>10.0.15</strong>、<strong>9.0.23</strong>、<strong>8.0.34</strong>（または SDK 11.0.100+）に更新してください。2026年11月更新の .NET ベースイメージを用いて Docker コンテナを再ビルド・再デプロイしてください。'
  - name: Node.js
    sev: med
    summary:
      vi: 'Duy trì các bản vá bảo mật 26.12.1 / 24.22.1 / 22.23.4 (khắc phục lỗi Brotli <a href="@home@featured/brotli-cve-2026-111497/analysis/">CVE-2026-111497</a> và bypass xác thực tên miền chứng chỉ TLS). Tháng 11 không có đợt cập nhật kernel khẩn cấp cho Node.js core; tiếp tục chú trọng an toàn supply chain npm.'
      ja: 'セキュリティリリース（26.12.1 / 24.22.1 / 22.23.4）の適用を維持（Brotli メモリ範囲外書き込み <a href="@home@featured/brotli-cve-2026-111497/analysis/">CVE-2026-111497</a> および TLS ホスト名検証バイパスの修正）。11月に Node.js コアの緊急リリースはなく、npm サプライチェーン監査を重点的に実施。'
    impact:
      vi: 'Các ứng dụng backend, API, SSR (Next.js, Nuxt) và môi trường phát triển / CI pipeline.'
      ja: 'バックエンドアプリケーション、API、SSR（Next.js、Nuxt）、および開発環境・CIパイプライン。'
    fix:
      vi: 'Đảm bảo ứng dụng chạy trên các phiên bản Node.js được hỗ trợ (Active/Maintenance LTS). Chạy định kỳ <code>npm audit</code> và khóa phiên bản bằng package-lock.json / pnpm-lock.yaml.'
      ja: 'サポート対象のLTSバージョンで稼働していることを確認してください。<code>npm audit</code>の定期実施とpackage-lock.json / pnpm-lock.yamlによるバージョン固定を徹底してください。'
  - name: PHP
    sev: high
    summary:
      vi: 'Duy trì cảnh giác sau cuộc khủng hoảng PHP2Shell (CVE-2026-109618, CVE-2026-109619 - CVSS 9.2 Critical RCE qua upload progress). Các bản vá chính thức 8.5.12, 8.4.27, 8.3.36, 8.2.35 đã phát hành ổn định; lưu ý các nhánh 8.1 trở xuống đã EOL không có bản vá từ upstream.'
      ja: 'PHP2Shell（CVE-2026-109618、CVE-2026-109619 - CVSS 9.2 Critical、upload progress 経由の RCE）を受けた警戒体制を維持。公式修正版 8.5.12、8.4.27、8.3.36、8.2.35 の稼働を確認。8.1 以前の EOL ブランチには upstream パッチがない点に留意。'
    impact:
      vi: 'Mọi ứng dụng PHP (PHP-FPM, FrankenPHP, Laravel, WordPress). Môi trường chưa nâng cấp PHP hoặc chưa tắt upload progress.'
      ja: 'すべての PHP アプリケーション（PHP-FPM、FrankenPHP、Laravel、WordPress 等）。未更新環境または upload progress を無効化していない環境。'
    fix:
      vi: 'Đảm bảo đã nâng PHP lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35. Đặt cấu hình <code>session.upload_progress.enabled = 0</code> trong <code>php.ini</code>. Xem <a href="@home@featured/php-cve-2026-109618-109619/php2shell/">hướng dẫn nội bộ</a>.'
      ja: 'PHP を 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 へアップグレード済みであることを確認してください。<code>php.ini</code> で <code>session.upload_progress.enabled = 0</code> を設定してください。<a href="@home@featured/php-cve-2026-109618-109619/php2shell/">社内対応ガイド</a>を参照。'

- title:
    vi: 5. Frameworks Web &amp; Hệ sinh thái Java (Frameworks &amp; Java Ecosystem)
    ja: 5. WebフレームワークおよびJavaエコシステム（Frameworks &amp; Java Ecosystem）
  type: component
  rows:
  - name: Next.js
    sev: high
    summary:
      vi: 'Bản vá <strong>GHSA-673q-mjm6-r5xr / CVE-2026-96889 (Critical)</strong>: Lỗ hổng RCE liên quan đến hàm <code>use cache</code> trong App Router khi trả về dữ liệu kiểu TypedArray, kết hợp với lỗ hổng xử lý file SVG trong thư viện xử lý ảnh <code>sharp / librsvg</code>.'
      ja: 'セキュリティアドバイザリ <strong>GHSA-673q-mjm6-r5xr / CVE-2026-96889（Critical）</strong>：App Router の <code>use cache</code> 関数が TypedArray を返却する際のリモートコード実行（RCE）の脆弱性、および画像処理コンポーネント（<code>sharp / librsvg</code>）における SVG 処理不備。'
    impact:
      vi: 'Các ứng dụng Next.js sử dụng App Router, Server Components và Image Optimization.'
      ja: 'App Router、Server Components、および Image Optimization を活用している Next.js アプリケーション。'
    fix:
      vi: 'Nâng cấp Next.js lên <strong>16.4.5</strong> hoặc <strong>15.5.29 trở lên</strong>.'
      ja: 'Next.js を <strong>16.4.5</strong> または <strong>15.5.29 以上</strong>にアップグレードしてください。'
  - name: Nuxt
    sev: high
    summary:
      vi: '<strong>CVE-2026-119198 &amp; CVE-2026-119200</strong>: Lỗ hổng tiết lộ file tùy ý trên development server qua thao tác sự kiện HMR, và lỗi bypass chuẩn hóa đường dẫn URL trong engine Nitro (<code>/%2e/admin</code>).'
      ja: '<strong>CVE-2026-119198 &amp; CVE-2026-119200</strong>：HMR イベント操作による開発サーバー上の任意ファイル漏えい、および Nitro ルーティング正規化バイパス（<code>/%2e/admin</code>）によるパストラバーサル。'
    impact:
      vi: 'Ứng dụng chạy Nuxt 4 (môi trường dev, staging và production dùng Nitro engine).'
      ja: 'Nuxt 4 を利用するアプリケーション（開発、ステージング、および Nitro エンジン稼働の本番環境）。'
    fix:
      vi: 'Nâng cấp Nuxt lên <strong>4.6.3 trở lên</strong>. Lưu ý Nuxt 3 đã hết vòng đời hỗ trợ (EOL), không có bản vá chính thức.'
      ja: 'Nuxt を <strong>4.6.3 以上</strong>にアップグレードしてください。なお Nuxt 3 は EOL となっており公式修正はありません。'
  - name: Laravel
    sev: med
    summary:
      vi: 'Tiếp tục theo dõi <strong>CVE-2026-114509</strong>: Lỗ hổng trong hệ thống TokenGuard cho phép giả danh người dùng mà không cần token hợp lệ khi cơ sở dữ liệu MySQL/MariaDB hoạt động ở chế độ so khớp không phân biệt chữ hoa chữ thường.'
      ja: '<strong>CVE-2026-114509</strong> の継続対応：大文字小文字を区別しない MySQL/MariaDB 環境において、TokenGuard 認証サブシステムの不備により有効なトークンなしでユーザーになりすましが可能な脆弱性。'
    impact:
      vi: 'Ứng dụng Laravel sử dụng API Token Authentication với cơ sở dữ liệu MySQL / MariaDB.'
      ja: 'MySQL / MariaDB を使用し、API トークン認証を採用している Laravel アプリケーション。'
    fix:
      vi: 'Nâng cấp Laravel lên <strong>13.29.0+</strong> (hoặc <strong>12.68.0+</strong> đối với nhánh Laravel 12).'
      ja: 'Laravel を <strong>13.29.0 以上</strong>（Laravel 12 系は <strong>12.68.0 以上</strong>）にアップグレードしてください。'
  - name: Spring Security (ELRequestMatcher)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-59273 (CVSS 9.8 - Critical)</strong>: <code>ELRequestMatcher</code> đánh giá SpEL trong ngữ cảnh không giới hạn (reflection, type reference, gọi method tùy ý) thay vì giới hạn như tài liệu. Khi ứng dụng bind input ngoài vào thuộc tính kiểu này, kẻ tấn công chưa xác thực có thể RCE. Chưa có trong CISA KEV (2026-11-20).'
      ja: '<strong>CVE-2026-59273（CVSS 9.8 - Critical）</strong>：<code>ELRequestMatcher</code> がドキュメントと異なり制限のない文脈（リフレクション・型参照・任意メソッド呼び出し）で SpEL を評価。外部入力がこの型のプロパティにバインドされると未認証で RCE の恐れ。CISA KEV 未掲載（2026-11-20）。'
    impact:
      vi: 'Spring Security <strong>7.1.0–7.1.2</strong>, <strong>7.0.0–7.0.8</strong>, <strong>6.5.0–6.5.12</strong>, <strong>6.4.0–6.4.19</strong>, <strong>5.8.0–5.8.28</strong>, &le; <strong>5.7.26</strong> (khi có bind input ngoài vào <code>ELRequestMatcher</code>).'
      ja: 'Spring Security <strong>7.1.0〜7.1.2</strong>、<strong>7.0.0〜7.0.8</strong>、<strong>6.5.0〜6.5.12</strong>、<strong>6.4.0〜6.4.19</strong>、<strong>5.8.0〜5.8.28</strong>、<strong>5.7.26</strong> 以前（外部入力を <code>ELRequestMatcher</code> にバインドする場合）。'
    fix:
      vi: 'Nâng cấp Spring Security lên <strong>7.1.3 / 7.0.9 / 7.2.0</strong> (hoặc Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>); nhánh 6.5/6.4/5.8/5.7 chỉ có bản vá Enterprise Support. Xem <a href="@home@featured/spring-security-cve-2026-59273/analysis/">phân tích &amp; biện pháp tạm thời</a>.'
      ja: 'Spring Security を <strong>7.1.3 / 7.0.9 / 7.2.0</strong>（または Spring Boot <strong>4.1.3 / 4.0.10 / 4.2.0</strong>）へ更新。6.5/6.4/5.8/5.7 は Enterprise Support のみ。<a href="@home@featured/spring-security-cve-2026-59273/analysis/">分析・暫定対策</a>を参照。'
  - name: Spring Boot &amp; Spring Framework
    sev: high
    summary:
      vi: '<strong>CVE-2026-40976 (CVSS 9.1 - Critical)</strong>: Bỏ qua kiểm soát bảo mật web khi cấu hình Actuator mặc định không khai báo security filter chain rõ ràng; <strong>CVE-2026-41843</strong> path traversal khi phân giải tài nguyên tĩnh; <strong>CVE-2026-59283</strong> bypass SpEL evaluation.'
      ja: '<strong>CVE-2026-40976（CVSS 9.1 - Critical）</strong>：明示的なセキュリティフィルターチェーンが設定されていないデフォルト Actuator 構成における Web セキュリティバイパス、<strong>CVE-2026-41843</strong> 静的リソース処理のパストラバーサル、<strong>CVE-2026-59283</strong> SpEL 評価バイパス。'
    impact:
      vi: 'Ứng dụng Spring Boot servlet và Spring MVC / WebFlux.'
      ja: 'サーブレットベースの Spring Boot アプリケーションおよび Spring MVC / WebFlux 環境。'
    fix:
      vi: 'Nâng cấp Spring Boot lên <strong>4.0.6</strong>, <strong>3.5.14</strong>, <strong>3.4.16</strong>, hoặc <strong>3.3.19</strong>.'
      ja: 'Spring Boot を <strong>4.0.6</strong>、<strong>3.5.14</strong>、<strong>3.4.16</strong>、または <strong>3.3.19</strong> にアップグレードしてください。'
  - name: Apache HTTP Server (mod_http2)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-119618 (Critical)</strong>: Lỗi Race Condition (CWE-362 - Concurrent Execution using Shared Resource with Improper Synchronization) trong hàm <code>assign_headers()</code> của module <code>mod_http2</code>. Khi xử lý nhiều HTTP/2 stream đồng thời trên cùng một kết nối TCP, lỗi đồng bộ có thể gây hỏng bộ nhớ heap (heap corruption) và thực thi mã từ xa (RCE) không cần xác thực.'
      ja: '<strong>CVE-2026-119618（Critical）</strong>：<code>mod_http2</code> モジュールの <code>assign_headers()</code> における競合状態（Race Condition / CWE-362）の脆弱性。単一TCP接続上で複数のHTTP/2ストリームを多重処理する際の同期不備により、ヒープ破壊および認証不要のリモートコード実行（RCE）に至る恐れ。'
    impact:
      vi: 'Các máy chủ web, reverse proxy hoặc container chạy Apache HTTP Server từ <strong>2.4.55 đến 2.4.70</strong> (hoặc <code>mod_h2</code> bản độc lập 2.0.8–2.0.42) có bật HTTP/2 (<code>mod_http2</code>).'
      ja: 'HTTP/2（<code>mod_http2</code>）を有効にしている <strong>Apache HTTP Server 2.4.55〜2.4.70</strong>（またはスタンドアロン版 <code>mod_h2</code> 2.0.8〜2.0.42）稼働中のWebサーバー、リバースプロキシ、コンテナ環境。'
    fix:
      vi: 'Nâng cấp ngay Apache HTTP Server lên phiên bản <strong>2.4.71 trở lên</strong> (phát hành ngày 11-11-2026). Nếu chưa thể nâng cấp ngay, tạm thời vô hiệu hóa <code>mod_http2</code> (tắt <code>LoadModule http2_module</code> hoặc loại bỏ <code>h2</code>/<code>h2c</code> khỏi chỉ thị <code>Protocols</code>). Xem <a href="@home@featured/apache-cve-2026-119618/analysis/">trang phân tích &amp; hướng dẫn chi tiết</a>.'
      ja: '直ちに Apache HTTP Server を <strong>2.4.71 以上</strong>（2026年11月11日リリース）へアップグレードしてください。即時適用が困難な場合の一時対策として、<code>mod_http2</code> を無効化（<code>LoadModule http2_module</code> の停止、または <code>Protocols</code> ディレクティブから <code>h2</code>/<code>h2c</code> を除外）してください。<a href="@home@featured/apache-cve-2026-119618/analysis/">詳細分析・対策ガイド</a>を参照。'
  - name: nginx (HTTP/2)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-123007 "nginx2root" (Critical)</strong>: hỏng bộ nhớ trong xử lý flow control của HTTP/2, tồn tại khoảng 10 năm, có thể dẫn đến RCE không cần xác thực. Cùng đợt vá có <strong>CVE-2026-123633</strong> (use-after-free HTTP/2). Trạng thái PoC/khai thác: các nguồn mâu thuẫn, chưa có trong CISA KEV.'
      ja: '<strong>CVE-2026-123007「nginx2root」（Critical）</strong>：約10年存在した HTTP/2 フロー制御処理のメモリ破壊で、認証不要の RCE に至る恐れ。同時に <strong>CVE-2026-123633</strong>（HTTP/2 の use-after-free）も修正。PoC・悪用状況は情報源により食い違い、CISA KEV には未掲載。'
    impact:
      vi: 'nginx OSS <strong>1.9.5–1.31.8</strong> có bật HTTP/2; NGINX Plus R34–R36, 37.0.0–37.2.0.1. Ubuntu, OpenResty, ingress-nginx chưa có bản vá lúc đưa tin.'
      ja: 'HTTP/2 を有効にした nginx OSS <strong>1.9.5〜1.31.8</strong>、NGINX Plus R34〜R36・37.0.0〜37.2.0.1。報道時点で Ubuntu、OpenResty、ingress-nginx は未修正。'
    fix:
      vi: 'Nâng cấp lên <strong>1.30.7 / 1.31.9</strong> (Plus 37.3.0.1 / 37.0.8.1) và restart. Tạm thời: <code>http2 off;</code> (hoặc bỏ <code>http2</code> khỏi <code>listen</code> nếu &lt;1.25.1). Xem <a href="@home@featured/nginx-cve-2026-123007/analysis/">phân tích &amp; hướng dẫn</a>.'
      ja: '<strong>1.30.7 / 1.31.9</strong>（Plus 37.3.0.1 / 37.0.8.1）へ更新して再起動。暫定：<code>http2 off;</code>（1.25.1 未満は <code>listen</code> から <code>http2</code> を削除）。<a href="@home@featured/nginx-cve-2026-123007/analysis/">分析・対策ガイド</a>を参照。'
  - name: Apache Tomcat
    sev: high
    summary:
      vi: '<strong>CVE-2026-101296 (CVSS 9.1 - Critical)</strong>: JNDI Realm cấu hình cơ chế SASL non-GSSAPI cho phép bỏ qua xác thực từ xa không cần thông tin đăng nhập; <strong>CVE-2026-103119 (High)</strong> buffer under-read trong AJP connector dẫn đến rò rỉ dữ liệu giữa các request; <strong>CVE-2026-101356 (High)</strong> trộn lẫn request/response trong HTTP/2 async servlet.'
      ja: '<strong>CVE-2026-101296（CVSS 9.1 - Critical）</strong>：non-GSSAPI SASL 機構を用いた JNDI Realm における認証バイパス、<strong>CVE-2026-103119（High）</strong>AJP コネクタのバッファアンダーリードによるリクエスト間データ漏えい、<strong>CVE-2026-101356（High）</strong>HTTP/2 非同期サーブレットでのオブジェクト誤再利用によるレスポンス混同。'
    impact:
      vi: 'Máy chủ Apache Tomcat độc lập hoặc servlet container nhúng trong Spring Boot.'
      ja: 'スタンドアロンの Apache Tomcat サーバーまたは Spring Boot 内蔵のサーブレットコンテナ。'
    fix:
      vi: 'Nâng cấp Apache Tomcat lên <strong>11.0.27</strong>, <strong>10.1.61</strong>, hoặc <strong>9.0.123</strong>.'
      ja: 'Apache Tomcat を <strong>11.0.27</strong>、<strong>10.1.61</strong>、または <strong>9.0.123</strong> に更新してください。'
  - name: Netty &amp; Jackson
    sev: med
    summary:
      vi: '<strong>CVE-2026-116541 / CVE-2026-116539</strong> (heap buffer overflow trong <code>netty-tcnative</code> khi ghi BIO record TLS 1.3); <strong>CVE-2026-89407</strong> (ReDoS trong <code>jackson-core</code> NumberInput); <strong>CVE-2026-68497</strong> cạn kiệt bộ nhớ khi stream JSON bất đồng bộ.'
      ja: '<strong>CVE-2026-116541 / CVE-2026-116539</strong>（<code>netty-tcnative</code> の TLS 1.3 post-handshake BIO 処理におけるヒープオーバーフロー）、<strong>CVE-2026-89407</strong>（<code>jackson-core</code> NumberInput の ReDoS）、<strong>CVE-2026-68497</strong>（非同期 JSON ストリーミング時のメモリ枯渇）。'
    impact:
      vi: 'Ứng dụng Java microservices sử dụng Netty (Spring WebFlux, gRPC) và thư viện Jackson parse JSON.'
      ja: 'Netty を使用する Java マイクロサービス（Spring WebFlux、gRPC）および JSON 解析に Jackson を用いるアプリケーション。'
    fix:
      vi: 'Cập nhật <code>netty-tcnative</code> lên <strong>2.0.84.Final trở lên</strong> và cập nhật các gói <code>jackson-core</code> lên bản bảo trì mới nhất.'
      ja: '<code>netty-tcnative</code> を <strong>2.0.84.Final 以上</strong>に更新し、<code>jackson-core</code> を最新の保守リリースへアップデートしてください。'
  - name: Quasar Framework
    sev: med
    summary:
      vi: '<strong>CVE-2026-106108 / GHSA-vhhq-m2gm-rwc9</strong>: Lỗ hổng directory traversal trong <code>@quasar/app-vite</code> (v3.1.0 đến v3.2.0) khi xử lý hàm <code>getSsgPages()</code> trong chế độ Static Site Generation (SSG).'
      ja: '<strong>CVE-2026-106108 / GHSA-vhhq-m2gm-rwc9</strong>：静的サイト生成（SSG）モードの <code>getSsgPages()</code> 処理時における <code>@quasar/app-vite</code>（v3.1.0〜v3.2.0）のディレクトリトラバーサルの脆弱性。'
    impact:
      vi: 'Ứng dụng web Quasar sử dụng Vite và chế độ build SSG.'
      ja: 'Vite および SSG ビルドモードを採用している Quasar Web アプリケーション。'
    fix:
      vi: 'Nâng cấp <code>@quasar/app-vite</code> lên <strong>v3.3.0</strong> và Quasar core lên <strong>v2.32.2 trở lên</strong>.'
      ja: '<code>@quasar/app-vite</code> を <strong>v3.3.0</strong>、Quasar コアパッケージを <strong>v2.32.2 以上</strong>にアップグレードしてください。'

- title:
    vi: '6. Cơ sở dữ liệu (Databases: PostgreSQL, MySQL, Oracle, ClickHouse)'
    ja: '6. データベース（Databases: PostgreSQL、MySQL、Oracle、ClickHouse）'
  type: component
  rows:
  - name: PostgreSQL (RDBMS)
    sev: high
    summary:
      vi: '<strong>Đợt phát hành bảo mật quý 4/2026 ngày 12-11 vá 52 CVEs</strong>: Đáng chú ý có 32 lỗ hổng đạt mức <strong>CVSS 8.8 (High)</strong>, tiêu biểu là <strong>CVE-2026-6460</strong> (lỗi Type Confusion khi thực thi DDL như <code>ALTER TABLE ... ALTER COLUMN ... SET DATA TYPE</code> hoặc chuỗi lệnh DDL dẫn đến RCE với quyền tiến trình postgres). Ngoài ra vá các lỗi memory corruption / type confusion trong PL/Perl, PL/Tcl, tìm kiếm văn bản (<code>ts_rank_cd()</code>), logical replication, dblink, và các công cụ client: <code>pg_dump</code> (SQL injection qua tên not-null constraint và command injection trong file tar restore), <code>reindexdb</code> (lỗi trích dẫn tên index). Cùng bản phát hành này cũng vá <strong>CVE-2026-116331</strong> (type confusion ở tối ưu hóa aggregate min/max, CVSS 8.8, người tạo object có thể chạy mã với quyền OS user của database), được công bố trong nghiên cứu "Narrow Grants, Wide Engines" của Depthfirst; khác với CVE-2026-6460. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích DB engine RCE</a>.'
      ja: '<strong>2026年11月12日の定期セキュリティリリースにて52件のCVEを修正</strong>：うち32件が <strong>CVSS 8.8（High）</strong> に達し、代表的な <strong>CVE-2026-6460</strong> では <code>ALTER TABLE ... ALTER COLUMN ... SET DATA TYPE</code> 等のDDL実行やDDL連鎖時に型混乱（Type Confusion）が生じ、postgres プロセス権限での任意コード実行（RCE）に至るリスク。さらに PL/Perl、PL/Tcl、全文検索（<code>ts_rank_cd()</code>）、ロジカルレプリケーション、dblink のメモリ破壊・型混乱、およびクライアントツール（<code>pg_dump</code> の not-null 制約名 SQLi / tar リストア時のコマンド注入、<code>reindexdb</code> のインデックス名エスケープ不備）を修正。同じリリースで <strong>CVE-2026-116331</strong>（min/max 集約の最適化における型混乱、CVSS 8.8。オブジェクト作成者がデータベースの OS ユーザー権限で任意コード実行）も修正済み。Depthfirst の研究「Narrow Grants, Wide Engines」で公表されたもので、CVE-2026-6460 とは別物。<a href="@home@featured/database-rce-narrow-grants/analysis/">DB エンジン RCE 分析</a>を参照。'
    impact:
      vi: 'Mọi hệ thống sử dụng PostgreSQL tự host, container Docker/K8s (CloudNativePG) hoặc dịch vụ cơ sở dữ liệu đám mây (AWS RDS/Aurora PostgreSQL, GCP Cloud SQL). Đặc biệt nguy cơ cao với các cơ sở dữ liệu cho phép nhiều người dùng/role ứng dụng thực hiện thao tác DDL hoặc sử dụng công cụ client <code>pg_dump</code> với cơ sở dữ liệu có đối tượng do bên thứ ba đặt tên. <strong>Lưu ý đặc biệt:</strong> PostgreSQL 14 đã chính thức <strong>End-of-Life (EOL)</strong> từ ngày 12-11-2026 (bản 14.25 là bản phát hành cuối cùng, sẽ không nhận thêm bất kỳ bản vá nào).'
      ja: 'セルフホスト環境、Docker/K8sコンテナ（CloudNativePG）、およびマネージドデータベース（AWS RDS/Aurora PostgreSQL、GCP Cloud SQL）を利用する全システム。複数ユーザー/アプリロールにDDL実行権限がある環境、または第三者が命名したDBオブジェクトに対して <code>pg_dump</code> を実行する環境で重大。<strong>特記事項:</strong> PostgreSQL 14 は 2026年11月12日をもって公式に <strong>サポート終了（EOL）</strong> となりました（14.25 が最終リリースであり以降の修正は提供されません）。'
    fix:
      vi: '<strong>(1) Nâng cấp server:</strong> Cập nhật cụm máy chủ PostgreSQL lên phiên bản tương ứng: <strong>18.7, 17.12, 16.16, 15.20, hoặc 14.25</strong>. <strong>(2) Cập nhật client tools:</strong> Nâng cấp đồng bộ các công cụ client (<code>pg_dump</code>, <code>reindexdb</code>, <code>psql</code>). <strong>(3) Bảo trì sau nâng cấp:</strong> Thực hiện <code>REINDEX</code> các GIN index nghi ngờ bị lỗi, GiST index của <code>pg_trgm</code> (<code>gist_trgm_ops</code>), B-tree index trên cột <code>bpchar</code> không độ dài, và chạy <code>REINDEX TABLE</code> nếu gặp lỗi "missing chunk number". <strong>(4) Chụp Full Backup ngay:</strong> Nếu đang dùng cơ chế incremental backup, bắt buộc chụp ngay bản full backup mới để tránh bản sao lưu bị hỏng ngầm. <strong>(5) Di chuyển khỏi PostgreSQL 14:</strong> Lập kế hoạch nâng cấp khẩn cấp các database đang chạy bản 14 lên phiên bản được hỗ trợ (PostgreSQL 15–18). Xem <a href="@home@featured/postgresql-cve-2026-6460/analysis/">hướng dẫn chi tiết</a>.'
      ja: '<strong>(1) サーバー更新:</strong> PostgreSQL クラスタを該当バージョン（<strong>18.7、17.12、16.16、15.20、14.25</strong>）へアップグレード。<strong>(2) クライアントツール更新:</strong> <code>pg_dump</code>、<code>reindexdb</code>、<code>psql</code> 等のクライアントバイナリも同期して更新。<strong>(3) 更新後メンテナンス:</strong> 破損の疑いがある GIN インデックス、<code>pg_trgm</code> の GiST インデックス（<code>gist_trgm_ops</code>）、長さ指定のない <code>bpchar</code> 列の B-tree インデックスの <code>REINDEX</code>、および "missing chunk number" エラー発生テーブルでの <code>REINDEX TABLE</code> を実施。<strong>(4) 即時フルバックアップ:</strong> 増分バックアップ運用中の環境では破損連鎖を防ぐため直ちに新規フルバックアップを取得。<strong>(5) PostgreSQL 14 の移行:</strong> EOL となったバージョン 14 の環境はサポート対象（PostgreSQL 15〜18）への移行計画を至急策定・推進。<a href="@home@featured/postgresql-cve-2026-6460/analysis/">詳細ガイド</a>を参照。'
  - name: MySQL Server / MySQL Cluster
    sev: high
    summary:
      vi: '<strong>CVE-2026-101786</strong> (Server: Optimizer, CVSS 7.2, Oracle đánh giá PR:High), công bố trong CPU 20-10-2026. Theo Depthfirst, tài khoản chỉ có <code>CREATE TEMPORARY TABLES ON *.*</code> và không đọc được bảng nào đã đạt RCE trên 26.7.0, tức quyền cần thiết thấp hơn đánh giá của Oracle.'
      ja: '<strong>CVE-2026-101786</strong>（Server: Optimizer、CVSS 7.2、Oracle の評価は PR:High）。2026年10月20日の CPU で公開。Depthfirst によれば <code>CREATE TEMPORARY TABLES ON *.*</code> のみで既存テーブルを読めないアカウントでも 26.7.0 で RCE に到達しており、Oracle の評価より低い権限で成立。'
    impact:
      vi: 'Chỉ MySQL Server 26.7.0–26.7.1 và MySQL Cluster 26.7.0–26.7.1 (8.4 LTS / 9.7 không nằm trong danh sách cho CVE này). <strong>Lưu ý:</strong> từ 7/2026 MySQL đánh số theo lịch <code>YY.M.P</code>; <code>26.7.0</code> là bản Innovation tháng 7/2026 (sau 9.7 không có 9.8), không phải bản 8.x.'
      ja: 'MySQL Server 26.7.0〜26.7.1 と MySQL Cluster 26.7.0〜26.7.1 のみ（8.4 LTS / 9.7 は本 CVE の対象一覧に含まれない）。<strong>注意：</strong>2026年7月から MySQL はカレンダー方式 <code>YY.M.P</code> を採用しており、<code>26.7.0</code> は 2026年7月の Innovation 版です（9.7 の次は 9.8 ではない）。8.x ではありません。'
    fix:
      vi: 'Nâng lên bản phát hành sau 26.7.1 theo CPU 10/2026 (advisory không ghi số phiên bản cụ thể, kiểm tra release notes). Thu hồi <code>CREATE TEMPORARY TABLES</code> khỏi tài khoản không cần. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '2026年10月 CPU に基づき 26.7.1 より新しいリリースへ更新（アドバイザリに具体的な版番号はないためリリースノートを確認）。不要なアカウントから <code>CREATE TEMPORARY TABLES</code> を剥奪。<a href="@home@featured/database-rce-narrow-grants/analysis/">分析</a>を参照。'
  - name: Oracle Database (Oracle Text) + Oracle REST Data Services (ORDS)
    sev: crit
    summary:
      vi: '<strong>CVE-2026-114819</strong> (Oracle Text, CVSS 9.9, Oracle: cần quyền Create Session, không khai thác được khi chưa xác thực) vá trong CSPU 11/2026; <strong>CVE-2026-91609</strong> (ORDS GraphQL, CVSS 6.5, PR:L) vá trong CPU 20-10-2026. Depthfirst cho biết chuỗi hai lỗi qua endpoint ORDS lộ ra ngoài có thể chạy lệnh <strong>trước khi đăng nhập</strong>, trong khi Oracle không đánh giá lỗi nào là unauthenticated. Hai góc nhìn khác nhau; nên coi ORDS lộ internet là ưu tiên cao nhất.'
      ja: '<strong>CVE-2026-114819</strong>（Oracle Text、CVSS 9.9。Oracle の評価は Create Session 権限が必要で認証なしでは悪用不可）は 2026年11月 CSPU で修正。<strong>CVE-2026-91609</strong>（ORDS GraphQL、CVSS 6.5、PR:L）は 2026年10月20日の CPU で修正。Depthfirst は外部公開された ORDS エンドポイント経由で両者を連鎖させると<strong>ログイン前</strong>にコマンド実行に至ると主張する一方、Oracle はいずれも認証不要とは評価していない。見解が異なるため、インターネット公開の ORDS を最優先で扱うこと。'
    impact:
      vi: 'Oracle Database 19.3–19.32, 21.3–21.24, 23.4.0–23.26.3; ORDS 24.2.0–26.2.1.'
      ja: 'Oracle Database 19.3〜19.32、21.3〜21.24、23.4.0〜23.26.3、ORDS 24.2.0〜26.2.1。'
    fix:
      vi: 'Áp CSPU 11/2026 cho Oracle Database; nâng ORDS lên bản mới nhất sau 26.2.1 (CPU 10/2026); không để ORDS lộ internet hoặc đặt sau lớp kiểm soát truy cập. <code>REVOKE TEMPORARY</code> không giúp gì cho đường tấn công này. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: 'Oracle Database に 2026年11月 CSPU を適用。ORDS を 26.2.1 より新しい最新版へ更新（2026年10月 CPU）。ORDS をインターネットに公開しない、またはアクセス制御の背後に置く。<code>REVOKE TEMPORARY</code> はこの経路には効果なし。<a href="@home@featured/database-rce-narrow-grants/analysis/">分析</a>を参照。'
  - name: ClickHouse
    sev: high
    summary:
      vi: '<strong>Chưa có CVE</strong>: lỗi tràn số nguyên dẫn đến ghi ngoài vùng nhớ khi đọc độ dài chuỗi RowBinary, xảy ra khi user đặt <code>format_binary_max_string_size = 0</code> (0 = không giới hạn; mặc định 1 GiB) và có <code>CREATE TEMPORARY TABLE</code> trên <code>*.*</code>. Depthfirst tái hiện được shell trên 26.7.5.10 (stable).'
      ja: '<strong>CVE 未割り当て</strong>：RowBinary の文字列長読み取りにおける整数オーバーフローによる範囲外書き込み。ユーザーが <code>format_binary_max_string_size = 0</code>（0 = 無制限、既定は 1 GiB）を設定し、<code>*.*</code> に対する <code>CREATE TEMPORARY TABLE</code> を持つ場合に到達。Depthfirst は 26.7.5.10（stable）でシェル取得を再現。'
    impact:
      vi: 'ClickHouse cho phép user tạo bảng tạm và tự thay đổi <code>format_binary_max_string_size</code>. Chưa có phiên bản sửa được xác nhận và chưa thấy advisory công khai của ClickHouse.'
      ja: '一時テーブル作成と <code>format_binary_max_string_size</code> の変更をユーザーに許可している ClickHouse。修正版は未確認で、ClickHouse の公開アドバイザリも見当たらない。'
    fix:
      vi: 'Hạn chế quyền <code>CREATE TEMPORARY TABLE</code>; dùng settings profile với constraints (vd. <code>min</code> = 1, hoặc <code>readonly</code> / <code>const</code>) để user không đổi được <code>format_binary_max_string_size</code>; giới hạn user readonly; theo dõi changelog và GitHub security advisories của ClickHouse. Xem <a href="@home@featured/database-rce-narrow-grants/analysis/">phân tích</a>.'
      ja: '<code>CREATE TEMPORARY TABLE</code> 権限を制限。settings profile の constraints（例：<code>min</code> = 1、または <code>readonly</code> / <code>const</code>）で <code>format_binary_max_string_size</code> を変更不可にし、readonly ユーザーを制限。ClickHouse の changelog と GitHub セキュリティアドバイザリを監視。<a href="@home@featured/database-rce-narrow-grants/analysis/">分析</a>を参照。'

- title:
    vi: '7. Hạ tầng đám mây (Infrastructure: AWS &amp; GCP)'
    ja: '7. クラウドインフラ（Infrastructure: AWS &amp; GCP）'
  type: provider
  rows:
  - name: AWS
    sev: high
    summary:
      vi: '<strong>CVE-2026-98433</strong>: Lỗ hổng side-channel vi kiến trúc ảnh hưởng đến môi trường ảo hóa Nitro thế hệ cũ trên Amazon EC2 đa người thuê (multi-tenant), có nguy cơ suy đoán khóa mật mã khi xảy ra tranh chấp bộ nhớ cực cao; AWS đã hoàn tất triển khai vá hypervisor và firmware tự động trên toàn cầu. Đồng thời AWS đã hoàn tất vá tầng host cho RDS/Aurora đối với lỗi kernel TCP IPv4.'
      ja: '<strong>CVE-2026-98433</strong>：マルチテナント Amazon EC2 の旧世代 Nitro 仮想化環境におけるマイクロアーキテクチャ・サイドチャネルの脆弱性。極度のメモリ競合条件下で暗号鍵が推測されるリスクに対し、AWS は全世界でハイパーバイザーおよびファームウェアの自動パッチ適用を完了。また RDS/Aurora の IPv4 TCP ホスト層パッチも完了。'
    impact:
      vi: 'Các EC2 instance chạy lâu ngày chưa reboot thuộc danh sách bảo trì của AWS; hạ tầng NLB TCP pass-through listener.'
      ja: 'メンテナンス対象としてフラグが立っている未再起動 EC2 インスタンス、NLB TCP パススルー環境。'
    fix:
      vi: 'Kiểm tra AWS Health Dashboard / Trusted Advisor để reboot các instance có thông báo bảo trì phần cứng. Đặt CloudFront / ALB ở tầng biên để kết thúc kết nối TCP trước khi chuyển tiếp backend.'
      ja: 'AWS Health Dashboard / Trusted Advisor を確認し、メンテナンス通知のあるインスタンスを再起動してください。エッジ層に CloudFront / ALB を配置して TCP 接続を終端させてください。'
  - name: GCP
    sev: high
    summary:
      vi: '<strong>CVE-2026-98512</strong>: Lỗ hổng kiểm tra dữ liệu đầu vào trong container runtime loader của Google Cloud Run và Vertex AI Custom Training Jobs, cho phép payload độc hại leo thang đặc quyền cục bộ và vượt rào sandbox thực thi tới nhân host worker. Google đã cập nhật các managed runtime.'
      ja: '<strong>CVE-2026-98512</strong>：Google Cloud Run および Vertex AI カスタムトレーニングジョブのコンテナランタイムローダーにおける入力検証不備。細工されたコンテナペイロードによりローカル特権昇格およびサンドボックス脱出が発生するリスク。Google はマネージドランタイムを更新済み。'
    impact:
      vi: 'Các workload chạy trên Cloud Run và Vertex AI sử dụng custom container image cũ chưa cập nhật base image.'
      ja: '旧世代のベースイメージを使用している Cloud Run および Vertex AI のカスタムコンテナワークロード。'
    fix:
      vi: 'Rebuild lại toàn bộ custom container image triển khai trên Cloud Run / Vertex AI bằng base image mới nhất; kích hoạt Confidential Computing / Confidential VMs cho các workload nhạy cảm.'
      ja: 'Cloud Run / Vertex AI にデプロイするカスタムコンテナを最新のベースイメージで再ビルドしてください。機密性の高いワークロードでは Confidential Computing / Confidential VMs の有効化を検討してください。'

- title:
    vi: 8. Sự cố hạ tầng, xâm nhập &amp; cảnh báo mối đe dọa (Incidents, Outages &amp; Threat Advisories)
    ja: 8. インフラ障害・侵入事案・脅威アドバイザリ（Incidents, Outages &amp; Threat Advisories）
  type: provider
  rows:
  - name: FBI FLASH-20261113-001 (ARTEX)
    sev: high
    summary:
      vi: 'Cảnh báo ngày 13-11-2026 về <strong>ARTEX</strong> — nền tảng agentic AI mã nguồn mở dùng LLM bị tin tặc lợi dụng từ ít nhất 08/2026 để tự động hóa xâm nhập (một số vụ leo thang tới quyền đặc quyền trong <strong>dưới 3 giờ</strong>). Ghi nhận &gt;1.600 console ARTEX mở công khai đầu tháng 11; dù repo GitHub gốc đã gỡ ngày 08-10, các bản fork, lưu trữ và bản thương mại ARTEX PRO vẫn lưu hành.'
      ja: '2026年11月13日付の警告。オープンソースの LLM 駆動エージェント基盤 <strong>ARTEX</strong> が少なくとも2026年8月以降、侵入の自動化に悪用され、一部事案では<strong>3時間未満</strong>で特権アクセスへ到達。11月初旬時点で 1,600 台超の公開コンソールが確認され、元 GitHub リポジトリ削除（10/8）後もフォーク・アーカイブ・商用版 ARTEX PRO が流通しています。'
    impact:
      vi: 'Các ngành tài chính, chính phủ, công nghệ, quốc phòng, bán dẫn, năng lượng, y tế, sản xuất, viễn thông, pháp lý; đặc biệt nhắm vào <strong>hệ thống ngoại vi</strong> ít được bảo vệ hơn ứng dụng chủ lực (cổng đối tác, ứng dụng nhân viên, dịch vụ cũ, tích hợp bên thứ ba, AI agent và connector).'
      ja: '金融・政府・IT・防衛・半導体・エネルギー・医療・製造・通信・法務など。特に主力アプリより防御が手薄な<strong>周辺システム</strong>（パートナーポータル、社内アプリ、レガシーサービス、外部連携、AI エージェントおよびコネクタ）が標的となります。'
    fix:
      vi: 'Kiểm kê mọi ứng dụng/AI agent mở internet; giới hạn scope và quyền (least privilege, OAuth consent grant); đưa giao diện quản trị/agent vào mạng riêng; gỡ và xoay vòng secret nhúng cứng trong cấu hình/biến môi trường/script; lưu giữ log đăng nhập và hành động của agent.'
      ja: '公開アプリ・AI エージェントの総点検、最小権限化（権限・OAuth 同意見直し）、管理画面・エージェント UI の閉域化、設定・環境変数・スクリプト内の固定シークレット削除とローテーション、エージェント操作およびサインインログの保全を実施してください。'
  - name: RIKEN (Siêu máy tính Fugaku &amp; Rikyu)
    sev: high
    summary:
      vi: 'Xâm nhập thật: kẻ tấn công truy cập trái phép máy chủ nội bộ trong giai đoạn 10–13/11 và RIKEN phải ngắt kết nối siêu máy tính Fugaku ngày 14-11. Lộ họ tên, email, user ID của 4.222 người dùng Fugaku và họ tên, email của 375 người dùng Rikyu; SSH private key và access key nằm trong số tệp bị tiếp cận (một số key đã bị thử dùng sang hệ thống khác). Truyền thông nêu nghi vấn khai thác status dashboard công khai của Fugaku (RIKEN đang tiếp tục xác minh phương thức).'
      ja: '実侵害事案：11/10〜13 に内部サーバーへ不正アクセスがあり、RIKEN は 11/14 にスーパーコンピュータ「富岳」を停止。富岳ユーザー 4,222 名の氏名・メール・ユーザー ID、Rikyu ユーザー 375 名の氏名・メールが流出し、SSH 秘密鍵やアクセス鍵も閲覧され一部が他システムへの試行に悪用されました。報道では公開ステータスダッシュボードの悪用が指摘されています（侵入経路は RIKEN が確認中）。'
    impact:
      vi: 'Tổ chức vận hành HPC, cụm tính toán, máy chủ nghiên cứu hoặc hệ thống có status dashboard / cổng giám sát công khai dùng chung mạng hoặc lưu khóa SSH/API.'
      ja: 'HPC・計算クラスタ・研究サーバー、または公開ステータスダッシュボードや監視ポータルとネットワーク・SSH 鍵/API 鍵を共有する環境。'
    fix:
      vi: 'Tách biệt hoàn toàn status dashboard công khai khỏi máy chủ nội bộ; không lưu SSH private key / access key tĩnh trên nút tiếp xúc công khai; thu hồi và cấp lại toàn bộ khóa bị nghi lộ.'
      ja: '公開ステータスダッシュボードを内部サーバーから完全に分離し、公開系ノードに静的な SSH 秘密鍵やアクセス鍵を置かないでください。侵害が疑われる鍵は即時失効・再発行してください。'
  - name: Equinor
    sev: med
    summary:
      vi: 'Xâm nhập thật: ngày 17-11-2026 Equinor phát hiện tấn công mạng đang diễn ra nhằm vào "một số hệ thống CNTT"; đến ngày 20-11 xác nhận đã chặn đứng cuộc tấn công, hoạt động khai thác/sản xuất không bị ảnh hưởng và chưa có dấu hiệu dữ liệu bị đánh cắp hay chỉnh sửa.'
      ja: '実侵害事案：2026年11月17日に「一部の IT システム」に対する進行中のサイバー攻撃を検知し、11月20日までに攻撃を阻止したと発表。操業・生産への影響はなく、データの窃取や改ざんの兆候も確認されていません。'
    impact:
      vi: 'Hệ thống CNTT doanh nghiệp (corporate IT) tách biệt với mạng vận hành/OT.'
      ja: 'OT/生産系から分離された企業 IT システム。'
    fix:
      vi: 'Duy trì phân tách mạng IT/OT nghiêm ngặt, giám sát phát hiện bất thường và diễn tập cô lập nhanh hệ thống CNTT bị xâm nhập.'
      ja: 'IT/OT ネットワーク分離を維持し、異常検知の監視と侵害 IT システムの迅速な隔離手順を確認してください。'
  - name: Microsoft 365, Apple, Chase, FAA, NSANet (Sự cố vận hành)
    sev: low
    summary:
      vi: 'Các sự cố gián đoạn diện rộng từ 12–17/11/2026 đều có nguyên nhân <strong>nội bộ / vận hành</strong> theo xác nhận của đơn vị vận hành và cơ quan chức năng, <strong>không phải tấn công mạng hay chuỗi tấn công liên hoàn</strong>: Microsoft 365 (12–13/11, lỗi từ đợt nâng cấp dung lượng mạng trước đó); FAA (13/11, quá tải switch/router viễn thông gây hủy &gt;4.700 chuyến bay, DHS xác nhận không nghi tấn công mạng); Chase (16/11, lỗi phần mềm trên phần cứng on-premise); NSANet (17/11, suy giảm trong bảo trì định kỳ, CNN không ghi nhận bằng chứng tấn công); Apple iCloud (17/11, sau một bản cập nhật nội bộ).'
      ja: '2026年11月12〜17日に相次いだ大規模障害はいずれも<strong>内部要因・運用起因</strong>であり、<strong>サイバー攻撃や連動攻撃ではない</strong>と各事業者・当局が説明：Microsoft 365（11/12〜13、先行のネットワーク容量増強時の不具合）、FAA（11/13、通信ルーター/スイッチ過負荷により4,700便超が欠航、DHS はサイバー攻撃の疑いなしと表明）、Chase（11/16、オンプレミスハードウェアのソフトウェアバグ）、NSANet（11/17、定期メンテナンス中の性能低下、CNN も攻撃の証拠なしと報道）、Apple iCloud（11/17、内部アップデート起因）。'
    impact:
      vi: 'Mọi đội ngũ vận hành cloud, on-premise và dịch vụ AI phụ thuộc lịch nâng cấp/bảo trì của nhà cung cấp hoặc hạ tầng nội bộ.'
      ja: 'クラウド、オンプレミス、および AI サービスを運用するすべてのチーム（ベンダーまたは自社の変更・保守スケジュールに依存する環境）。'
    fix:
      vi: 'Không đánh đồng sự cố vận hành với tấn công mạng; áp dụng staging, cửa sổ đóng băng (freeze), cơ chế rollback rõ ràng cho mọi thay đổi mạng/cấu hình, kể cả trên hạ tầng tự host (on-premise).'
      ja: '運用障害とサイバー攻撃を混同せず切り分けること。オンプレミス・セルフホスト環境を含め、ネットワーク・設定変更にはステージング検証、フリーズ期間、明確なロールバック手順を適用してください。'

- title:
    vi: 9. Ghi chú về độ tin cậy &amp; Nguồn tham khảo
    ja: 9. 情報の信頼性に関する注記 &amp; 参考情報
  type: list
  items:
  - vi: '<strong>Đối chiếu nguồn chính thức PostgreSQL &amp; Help Net Security:</strong> Ngày 12-11-2026, PostgreSQL Global Development Group phát hành bản cập nhật bảo mật định kỳ quý 4/2026 vá 52 CVEs cho tất cả các nhánh hỗ trợ (18.7, 17.12, 16.16, 15.20, 14.25), trong đó có 32 lỗi CVSS 8.8 (tiêu biểu là CVE-2026-6460 RCE qua Type Confusion), đồng thời công bố phiên bản 14.25 là bản phát hành cuối cùng đánh dấu PostgreSQL 14 chính thức End-of-Life (EOL).'
    ja: '<strong>PostgreSQL 公式および Help Net Security との照合済み:</strong> 2026年11月12日、PostgreSQL Global Development Group はサポート対象ブランチ（18.7、17.12、16.16、15.20、14.25）に対して計52件のCVEを修正する定期セキュリティリリースを公開。32件が CVSS 8.8（代表例：型混乱 RCE CVE-2026-6460）に達し、同時にバージョン 14.25 が最終リリースとなり、PostgreSQL 14 が公式に EOL（サポート終了）となったことを発表。'
  - vi: '<strong>Đối chiếu nguồn chính thức Apache HTTP Server &amp; CVE.org (CVE-2026-119618):</strong> Lỗi đồng bộ trong <code>mod_http2</code> (<code>assign_headers()</code>) do Anthropic OSS Scanner và Google Cloud Vulnerability Research phát hiện, đã được Apache Software Foundation xác nhận và vá trong bản phát hành Apache HTTP Server 2.4.71 ngày 11-11-2026.'
    ja: '<strong>Apache HTTP Server &amp; CVE.org 公式ソースとの照合済み（CVE-2026-119618）:</strong> <code>mod_http2</code>（<code>assign_headers()</code>）の競合状態は Anthropic OSS Scanner および Google Cloud Vulnerability Research により報告され、Apache Software Foundation により2026年11月11日リリースの Apache HTTP Server 2.4.71 で修正されました。'
  - vi: '<strong>Đối chiếu nguồn chính thức Microsoft MSRC &amp; Patch Tuesday:</strong> CVE-2026-120779, CVE-2026-120780 (Visual Studio Code), CVE-2026-118746 (.NET), CVE-2026-114146/47 (ASP.NET Core) và CVE-2026-114151 (Visual Studio) được công bố trong bản tin bảo mật Patch Tuesday tháng 11/2026.'
    ja: '<strong>Microsoft MSRC &amp; Patch Tuesday 公式ソースとの照合済み:</strong> CVE-2026-120779、CVE-2026-120780（VS Code）、CVE-2026-118746（.NET）、CVE-2026-114146/47（ASP.NET Core）、CVE-2026-114151（Visual Studio）は 2026年11月 Patch Tuesday にて公開。'
  - vi: '<strong>Nghiên cứu "Narrow Grants, Wide Engines" (Zheng Yu, Depthfirst, 18-11-2026):</strong> Đánh giá của nhà cung cấp và nhà nghiên cứu khác nhau: MySQL CVE-2026-101786 được Oracle chấm PR:High nhưng Depthfirst đạt RCE chỉ với <code>CREATE TEMPORARY TABLES</code>; Oracle không xếp CVE-2026-114819 / CVE-2026-91609 là unauthenticated, còn Depthfirst cho biết chuỗi qua ORDS lộ ra ngoài chạy được trước khi đăng nhập. Chưa ghi nhận khai thác ngoài thực tế; chưa có PoC đầy đủ công khai (chỉ trích đoạn); The Hacker News chưa tái hiện độc lập toàn bộ chuỗi. ClickHouse chưa có CVE và chưa có bản sửa được xác nhận.'
    ja: '<strong>研究「Narrow Grants, Wide Engines」（Zheng Yu、Depthfirst、2026年11月18日）:</strong> ベンダーと研究者の評価に差異あり。MySQL CVE-2026-101786 は Oracle の評価が PR:High だが Depthfirst は <code>CREATE TEMPORARY TABLES</code> のみで RCE に到達。Oracle は CVE-2026-114819 / CVE-2026-91609 をいずれも認証不要と評価していないが、Depthfirst は外部公開 ORDS 経由の連鎖でログイン前に実行可能と主張。実環境での悪用は未確認、完全な PoC は未公開（一部抜粋のみ）、The Hacker News も全連鎖を独自には再現していない。ClickHouse は CVE 未割り当てで修正版も未確認。'
  - vi: '<strong>Chrome 158 ngày 17-11:</strong> Google công bố 204 bản sửa bảo mật, trong đó có 6 lỗi Critical; bản Stable được triển khai dần. Xem <a href="https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_01699533288.html" target="_blank" rel="noopener noreferrer">thông báo chính thức của Google</a>.'
    ja: '<strong>11月17日の Chrome 158:</strong> Google は Critical 6件を含む204件のセキュリティ修正を発表し、Stable を段階的に配信。<a href="https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_01699533288.html" target="_blank" rel="noopener noreferrer">Google の公式発表</a>を参照。'
  - vi: '<strong>Cảnh báo Zero-Day Google Chrome (CVE-2026-125350):</strong> Lỗ hổng Use-After-Free trong trình phân tích XML đã được Google xác nhận có mã khai thác hoạt động thực tế (in the wild); bản vá khẩn cấp đã phát hành trên các kênh Stable và Extended Stable.'
    ja: '<strong>Google Chrome ゼロデイ警告（CVE-2026-125350）:</strong> XML パーサーの Use-After-Free 脆弱性は Google により実環境での悪用（in the wild）が確認済み。Stable および Extended Stable チャンネルにて緊急アップデートが配信されています。'
  - vi: '<strong>Cảnh báo chuỗi cung ứng công cụ AI Coding:</strong> Các chiến dịch mã độc mạo danh máy chủ Model Context Protocol (MCP) và công cụ mở rộng IDE đang gia tăng; khuyến nghị toàn bộ kỹ sư áp dụng nguyên tắc kiểm tra mã nguồn và xác minh tính toàn vẹn của lockfile trước khi tích hợp vào môi trường làm việc.'
    ja: '<strong>AIコーディングツールのサプライチェーン警戒:</strong> Model Context Protocol（MCP）サーバーやIDE拡張ツールを騙る悪意あるパッケージが増加しています。全エンジニアは作業環境に組み込む前にソースコードの監査およびロックファイルの整合性検証を徹底してください。'
  - vi: '<strong>Đối chiếu nguồn chính thức Linux kernel CNA, git.kernel.org &amp; các distro (CVE-2026-99312):</strong> Công bố ngày 18-11-2026 (cập nhật 19-11); Terra Security chứng minh đọc ~127 GB RAM host trên DigitalOcean Droplet trong môi trường kiểm soát (DigitalOcean đã live-patch toàn bộ hypervisor ngày 19-11). Chưa có PoC công khai, chưa ghi nhận khai thác thực tế và chưa có trong CISA KEV (kiểm tra 21-11-2026).'
    ja: '<strong>Linux カーネル CNA・git.kernel.org・各ディストリとの照合済み（CVE-2026-99312）:</strong> 2026年11月18日公開（11/19更新）。Terra Security は制御環境下の DigitalOcean Droplet でホスト RAM 約127GB読取を実証（DigitalOcean は11/19に全ハイパーバイザーへライブパッチ完了）。公開 PoC・実環境悪用は未確認、CISA KEV 未掲載（2026年11月21日確認）。'
  - vi: '<strong>Tổng hợp sự cố 12–17/11 &amp; cảnh báo FBI FLASH-20261113-001 (ARTEX):</strong> Dựa trên tổng hợp nguồn công khai của ibl.ai (21-11-2026) đối chiếu BleepingComputer, Al Jazeera, NBC News, CNN, Macworld, thông cáo Equinor và FBI FLASH-20261113-001. Không có nguồn nào xác nhận mối liên hệ giữa các sự cố gián đoạn (Microsoft 365, FAA, Chase, NSANet, Apple) với nhau hay với hai vụ xâm nhập (RIKEN Fugaku, Equinor) hoặc ARTEX; tin đồn "tòa án Mỹ ngoại tuyến" ngày 18-11 chưa có nguồn xác thực.'
    ja: '<strong>11/12〜17の障害まとめおよび FBI FLASH-20261113-001（ARTEX）:</strong> ibl.ai（2026年11月21日）が BleepingComputer、Al Jazeera、NBC News、CNN、Macworld、Equinor 声明、FBI FLASH-20261113-001 を照合した整理に基づく。各障害（Microsoft 365、FAA、Chase、NSANet、Apple）同士、あるいは侵入事案（RIKEN富岳、Equinor）や ARTEX との関連を示す出典はなく、11/18の「米国裁判所オフライン」説にも確認できる出典はありません。'
  - vi: '<strong>Đối chiếu nguồn chính thức Linux kernel CNA, NVD &amp; Debian LTS (CVE-2026-99362):</strong> Công bố ngày 19-11-2026; upstream đã vá ở 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1, Debian 12 LTS phát hành bản vá qua DLA-4927-1 (<code>linux-6.12</code>), trong khi RHEL, Ubuntu và Amazon Linux đang chờ bản cập nhật. Chưa có PoC công khai, chưa ghi nhận khai thác thực tế và chưa có trong CISA KEV (kiểm tra 23-11-2026).'
    ja: '<strong>Linux カーネル CNA・NVD・Debian LTS 公式情報との照合済み（CVE-2026-99362）:</strong> 2026年11月19日公開。upstream は 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 で修正済み、Debian 12 LTS は DLA-4927-1（<code>linux-6.12</code>）で修正公開済み、RHEL・Ubuntu・Amazon Linux は修正待ち。公開 PoC・実環境悪用は未確認、CISA KEV 未掲載（2026年11月23日確認）。'
  - vi: '<strong>Liên kết tham khảo:</strong> <a href="https://www.postgresql.org/about/news/" target="_blank" rel="noopener noreferrer">PostgreSQL Release Announcement</a> · <a href="https://www.helpnetsecurity.com/2026/11/13/postgresql-security-update-november-2026/" target="_blank" rel="noopener noreferrer">Help Net Security PostgreSQL Advisory</a> · <a href="@home@featured/postgresql-cve-2026-6460/analysis/">PiraGo Analysis: PostgreSQL Security Update Nov 2026</a> · <a href="https://httpd.apache.org/security/vulnerabilities_24.html" target="_blank" rel="noopener noreferrer">Apache HTTP Server 2.4 Security</a> · <a href="https://www.cve.org/CVERecord?id=CVE-2026-119618" target="_blank" rel="noopener noreferrer">CVE-2026-119618</a> · <a href="https://msrc.microsoft.com/update-guide" target="_blank" rel="noopener noreferrer">Microsoft MSRC Update Guide</a> · <a href="https://chromereleases.googleblog.com/" target="_blank" rel="noopener noreferrer">Chrome Releases Blog</a> · <a href="https://spring.io/security/cve" target="_blank" rel="noopener noreferrer">Spring Security Advisories</a> · <a href="https://tomcat.apache.org/security.html" target="_blank" rel="noopener noreferrer">Apache Tomcat Security</a> · <a href="@home@featured/apache-cve-2026-119618/analysis/">PiraGo Analysis: Apache CVE-2026-119618</a> · <a href="@home@featured/java-cve-2026-114938/analysis/">PiraGo Analysis: Java CVE-2026-114938</a> · <a href="@home@featured/linux-cve-2026-98432/analysis/">PiraGo Analysis: Linux CVE-2026-98432</a> · <a href="@home@featured/php-cve-2026-109618-109619/php2shell/">PiraGo Guide: PHP2Shell</a> · <a href="https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html" target="_blank" rel="noopener noreferrer">The Hacker News: Database RCE (PostgreSQL, MySQL, Oracle)</a> · <a href="https://depthfirst.com/research/narrow-grants-wide-engines" target="_blank" rel="noopener noreferrer">Depthfirst: Narrow Grants, Wide Engines</a> · <a href="https://www.postgr