h1:
  vi: Báo cáo bảo mật tháng 9/2026
  ja: 2026年9月 セキュリティレポート
sub:
  vi: Tháng đã kết thúc. Báo cáo này bổ sung sau, tính đến <strong>2026-10-23</strong>.
  ja: 9月は終了しています。本レポートは後日追補したもので、<strong>2026-10-23</strong>時点の情報です。
placeholder:
  vi: '🔍 Tìm kiếm CVE, framework, thư viện (vd: Next.js, Chrome, Tomcat, AWS)...'
  ja: '🔍 CVE、フレームワーク、ライブラリで検索（例: Next.js, Chrome, Tomcat, AWS）...'
scope:
  vi: <strong>Phạm vi rà soát:</strong> AWS, GCP · NodeJS, PHP, Java, .NET, JavaScript · Next.js, Nuxt, Quasar, Laravel, Spring Boot. Các lỗi tháng 9 có thể đã có bản vá mới hơn, xem thêm <a href="@home@monthly/2026-10/">báo cáo tháng 10/2026</a>.
  ja: <strong>調査範囲:</strong> AWS, GCP · NodeJS, PHP, Java, .NET, JavaScript · Next.js, Nuxt, Quasar, Laravel, Spring Boot。9月の脆弱性にはその後さらに新しい修正版が出ている場合があります。<a href="@home@monthly/2026-10/">2026年10月のレポート</a>もご確認ください。
card:
  title:
    vi: Báo cáo tháng 09/2026
    ja: 2026年9月レポート
  date:
    vi: Bổ sung đến 2026-10-23 · Lưu trữ
    ja: 2026年10月23日 まで追補 · アーカイブ
  items:
  - sev: crit
    label: Next.js
    text:
      vi: 'CVE-2026-94545: chiếm quyền server từ xa qua <code>next/og</code> (CVSS 9.5), thêm 7 lỗi cache/SSRF ngày 09-30. Nâng lên 16.3.6 trở lên.'
      ja: 'CVE-2026-94545: <code>next/og</code> 経由でサーバーを遠隔乗っ取り (CVSS 9.5)。9月30日にはキャッシュ/SSRFの脆弱性7件が追加。16.3.6 以上へアップグレード。'
  - sev: high
    label: Chrome
    text:
      vi: 'CVE-2026-87491: zero-day V8 đang bị khai thác. Cập nhật Chrome 153.x.'
      ja: 'CVE-2026-87491: 悪用が確認されているV8のゼロデイ。Chrome 153.x へアップデート。'
  - sev: crit
    label: Spring Boot
    text:
      vi: Tomcat đi kèm có lỗi bỏ qua ràng buộc bảo mật WebSocket (CVE-2026-76183, CVSS 9.8). Nâng Tomcat lên 10.1.60 / 9.0.122.
      ja: 同梱のTomcatにWebSocketのセキュリティ制約を回避される脆弱性 (CVE-2026-76183、CVSS 9.8)。Tomcat を 10.1.60 / 9.0.122 へアップグレード。
  - sev: crit
    label: GCP
    text:
      vi: 'GCP-2026-058: thiếu kiểm tra quyền ở GKE Multi-Cloud (Google xếp Critical, chưa rõ chi tiết).'
      ja: 'GCP-2026-058: GKE Multi-Cloud における権限チェックの不備 (GoogleはCriticalに分類、詳細は未公表)。'
sections:
- title:
    vi: 1. Việc cần làm
    ja: 1. 必要な対応
  type: actions
  rows:
  - task:
      vi: Nâng cấp <strong>Next.js</strong> (RCE qua <code>next/og</code>, và 7 lỗi cache/SSRF ngày 09-30)
      ja: <strong>Next.js</strong> をアップグレード（<code>next/og</code> 経由の RCE、および 09-30 公開のキャッシュ/SSRF 関連 7 件）
    sev: crit
    due:
      vi: Ngay
      ja: 即時
  - task:
      vi: Cập nhật <strong>Chrome</strong> lên 153.x (zero-day V8 đang bị khai thác)
      ja: <strong>Chrome</strong> を 153.x に更新（悪用が確認されている V8 のゼロデイ）
    sev: high
    due:
      vi: Ngay
      ja: 即時
  - task:
      vi: Nâng <strong>Tomcat / Netty / Jackson</strong> đi kèm Spring Boot
      ja: Spring Boot に同梱される <strong>Tomcat / Netty / Jackson</strong> をアップグレード
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Nâng <strong>PHP</strong> lên bản có vá 11 advisory (nay lên thẳng bản tháng 10)
      ja: <strong>PHP</strong> を 11 件のアドバイザリが修正された版へ更新（現在は 10 月版へ直接更新を推奨）
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Cập nhật <strong>.NET</strong> 8.0.31 / 9.0.20 / 10.0.12; kiểm tra <strong>SSM Agent</strong> và <strong>EKS Network Policy Agent</strong>
      ja: <strong>.NET</strong> 8.0.31 / 9.0.20 / 10.0.12 に更新。<strong>SSM Agent</strong> と <strong>EKS Network Policy Agent</strong> を確認
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
- title:
    vi: 2. Ngôn ngữ
    ja: 2. 言語
  type: component
  rows:
  - name: PHP
    summary:
      vi: 'Bản 8.5.11 và 8.4.26 (09-24) vá 11 advisory. Đáng chú ý: tràn bộ nhớ heap ở OpenSSL khi gặp chứng chỉ wildcard đặc biệt (CVE-2026-91767), kiểm tra tên miền chứng chỉ sai (CVE-2026-91769), lộ thông tin đăng nhập khi chuyển hướng HTTP (CVE-2026-91766), bỏ qua ACL IPv6 của PHP-FPM (CVE-2026-91768), lỗi Phar, SOAP, MySQLnd. Không thấy báo cáo khai thác.'
      ja: 8.5.11 および 8.4.26（09-24）で 11 件のアドバイザリが修正されました。主なものは、特殊なワイルドカード証明書に遭遇した際の OpenSSL でのヒープオーバーフロー（CVE-2026-91767）、証明書のドメイン名検証の誤り（CVE-2026-91769）、HTTP リダイレクト時の認証情報漏えい（CVE-2026-91766）、PHP-FPM の IPv6 ACL バイパス（CVE-2026-91768）、Phar・SOAP・MySQLnd の不具合です。悪用の報告は確認されていません。
    sev: high
    impact:
      vi: Ứng dụng PHP dùng OpenSSL/HTTP stream/SOAP/Phar, PHP-FPM giới hạn client bằng <code>listen.allowed_clients</code>.
      ja: OpenSSL/HTTP ストリーム/SOAP/Phar を使用する PHP アプリケーション、<code>listen.allowed_clients</code> でクライアントを制限している PHP-FPM。
    fix:
      vi: Nâng lên 8.5.11 / 8.4.26 trở lên (nay nên lên bản tháng 10, xem <a href="@home@monthly/2026-10/">báo cáo 10/2026</a>). Chưa xác nhận lỗi nào đã vá cho nhánh 8.3, 8.2.
      ja: 8.5.11 / 8.4.26 以上に更新してください（現在は 10 月版への更新を推奨、<a href="@home@monthly/2026-10/">10月レポート</a>を参照）。8.3 および 8.2 系で修正済みの脆弱性は確認できていません。
  - name: Node.js
    summary:
      vi: Không có bản vá bảo mật trong tháng 9 (đợt trước 07-29, đợt sau 10-21).
      ja: 9 月にセキュリティ修正リリースはありませんでした（前回は 07-29、次回は 10-21）。
    sev: low
    impact:
      vi: Không có.
      ja: なし。
    fix:
      vi: Không cần làm gì riêng cho tháng 9.
      ja: 9 月分として特別な対応は不要です。
  - name: Java
    summary:
      vi: Không có CPU quý trong tháng 9. Oracle ra bản vá nhỏ ngày 09-15, có 3 bản vá cho Java SE (khai thác từ xa, không cần đăng nhập), chưa rõ CVE và điểm. Các lỗi điểm 10.0 trong đợt này thuộc sản phẩm khác (WebLogic, Access Manager, Forms...), không phải Java SE.
      ja: 9 月に四半期 CPU はありませんでした。Oracle は 09-15 に小規模な修正を公開し、Java SE 向けに 3 件の修正（リモートから認証なしで悪用可能）が含まれますが、CVE とスコアは不明です。このリリースのスコア 10.0 の脆弱性は他製品（WebLogic、Access Manager、Forms など）のもので、Java SE ではありません。
    sev: med
    impact:
      vi: Oracle JDK/JRE. WebLogic và các sản phẩm Oracle Fusion Middleware nếu có dùng.
      ja: Oracle JDK/JRE。WebLogic および Oracle Fusion Middleware 製品（使用している場合）。
    fix:
      vi: Theo dõi Oracle CPU tháng 10 (xem <a href="@home@monthly/2026-10/">báo cáo 10/2026</a>).
      ja: 10 月の Oracle CPU を確認してください（<a href="@home@monthly/2026-10/">10月レポート</a>を参照）。
  - name:
      vi: .NET (gồm ASP.NET Core)
      ja: .NET（ASP.NET Core を含む）
    summary:
      vi: Patch Tuesday 09-08. <strong>.NET:</strong> vá ở 8.0.31 / 9.0.20 / 10.0.12; có 3 lỗi 8.8 liên quan xử lý file PDB (CVE-2026-69439, -71328, -69522) và lỗi từ chối dịch vụ ASP.NET Core (CVE-2026-69304). Chưa thấy khai thác. <strong>Windows (ngoài phạm vi, chỉ để biết):</strong> 2 lỗi leo thang đặc quyền đang bị khai thác (CVE-2026-81963, -85880) và nhiều lỗi chạy mã từ xa.
      ja: 09-08 の Patch Tuesday。<strong>.NET:</strong> 8.0.31 / 9.0.20 / 10.0.12 で修正。PDB ファイル処理に関する CVSS 8.8 の 3 件（CVE-2026-69439、-71328、-69522）と、ASP.NET Core のサービス拒否（CVE-2026-69304）があります。悪用は未確認です。<strong>Windows（対象外、参考情報）:</strong> 悪用が確認されている権限昇格 2 件（CVE-2026-81963、-85880）と、多数のリモートコード実行の脆弱性があります。
    sev: high
    impact:
      vi: Ứng dụng .NET 8/9/10 và công cụ build dùng DiaSymReader; máy chủ Windows.
      ja: .NET 8/9/10 アプリケーション、および DiaSymReader を使用するビルドツール、Windows サーバー。
    fix:
      vi: Cập nhật runtime/SDK lên 8.0.31 / 9.0.20 / 10.0.12 trở lên, build lại image container.
      ja: ランタイム/SDK を 8.0.31 / 9.0.20 / 10.0.12 以上に更新し、コンテナイメージを再ビルドしてください。
  - name:
      vi: JavaScript (trình duyệt + npm)
      ja: JavaScript（ブラウザ + npm）
    summary:
      vi: <strong>Chrome:</strong> CVE-2026-87491, lỗi ghi ngoài vùng nhớ ở V8, <strong>đang bị khai thác</strong> (zero-day thứ 7 của 2026), vá ở Chrome 153.0.8010.36 (09-09). Cùng bản có 230 bản vá bảo mật. Các nguồn không thống nhất mức độ (High hay Medium). <strong>npm:</strong> chiến dịch MALFEX, 8 gói độc hại phát tán RAT và mã đánh cắp dữ liệu trên Windows (một nguồn duy nhất).
      ja: <strong>Chrome:</strong> CVE-2026-87491、V8 の境界外書き込みの脆弱性で、<strong>悪用が確認されています</strong>（2026 年 7 件目のゼロデイ）。Chrome 153.0.8010.36（09-09）で修正されました。同バージョンには 230 件のセキュリティ修正が含まれます。情報源によって重大度の評価が一致していません（High または Medium）。<strong>npm:</strong> MALFEX キャンペーン。Windows 上で RAT と情報窃取コードを配布する 8 件の悪意あるパッケージ（情報源は 1 件のみ）。
    sev: high
    impact:
      vi: Người dùng Chrome, Edge, Brave; ứng dụng Electron/WebView; máy dev và CI cài gói npm.
      ja: Chrome、Edge、Brave のユーザー、Electron/WebView アプリケーション、npm パッケージをインストールする開発マシンと CI。
    fix:
      vi: Cập nhật trình duyệt và Electron. Dùng lockfile, <code>npm ci</code>, kiểm tra gói mới thêm.
      ja: ブラウザと Electron を更新してください。lockfile と <code>npm ci</code> を使用し、新規追加されたパッケージを確認してください。
- title:
    vi: 3. Framework
    ja: 3. フレームワーク
  type: component
  rows:
  - name: Next.js
    summary:
      vi: '<strong>CVE-2026-94545</strong> (09-22, CVSS 9.5): chiếm quyền server từ xa qua <code>ImageResponse</code> của <code>next/og</code> khi dữ liệu người dùng đi vào nội dung SVG. Ngày 09-30 có thêm 7 advisory: SSRF qua Image Optimization (CVE-2026-94483, 8.3), lẫn cache <code>use cache</code> (CVE-2026-103004, -94544), ghi đè/nhiễm cache ISR/SSG (CVE-2026-94543, -94484), lộ dữ liệu qua MCP endpoint của <code>next dev</code> (CVE-2026-94486).'
      ja: '<strong>CVE-2026-94545</strong>（09-22、CVSS 9.5）: ユーザーデータが SVG コンテンツに入る場合、<code>next/og</code> の <code>ImageResponse</code> 経由でサーバーをリモートから乗っ取れます。09-30 にさらに 7 件のアドバイザリが公開されました: Image Optimization 経由の SSRF（CVE-2026-94483、8.3）、<code>use cache</code> のキャッシュ混同（CVE-2026-103004、-94544）、ISR/SSG キャッシュの上書き/汚染（CVE-2026-94543、-94484）、<code>next dev</code> の MCP エンドポイント経由のデータ漏えい（CVE-2026-94486）。'
    sev: crit
    impact:
      vi: Next.js 16.2.0 đến trước 16.3.6 dùng <code>next/og</code> trên Node.js (không phải Edge). Các lỗi cache/SSRF ảnh hưởng 15.x và 16.x, chủ yếu tự host.
      ja: Node.js（Edge ではない）上で <code>next/og</code> を使用する Next.js 16.2.0 以上 16.3.6 未満。キャッシュ/SSRF の脆弱性は 15.x および 16.x に影響し、主にセルフホスト環境が対象です。
    fix:
      vi: Nâng lên 16.3.6 trở lên cho lỗi RCE. Các lỗi 09-30 cần 16.3.8 / 15.5.27 (một số số hiệu chưa xác nhận); nên lên thẳng bản tháng 10 (16.4.1 / 15.5.28).
      ja: RCE については 16.3.6 以上にアップグレードしてください。09-30 の脆弱性には 16.3.8 / 15.5.27 が必要です（一部のバージョン番号は未確認）。10 月版（16.4.1 / 15.5.28）への直接更新を推奨します。
  - name:
      vi: Spring Boot (Tomcat, Netty, Jackson đi kèm)
      ja: Spring Boot（同梱の Tomcat、Netty、Jackson）
    summary:
      vi: 'Không có CVE mới của Spring Boot/Framework trong tháng 9. Phụ thuộc đi kèm: <strong>Tomcat</strong> CVE-2026-76183 (bỏ qua ràng buộc bảo mật WebSocket, CVSS 9.8) và CVE-2026-86350 (lộ header HTTP/2 giữa các request, 9.1); <strong>Netty</strong> 23 advisory vá ở 4.1.138.Final (HTTP/2, request smuggling); <strong>Jackson</strong> 4 lỗi từ chối dịch vụ (vá ở 2.18.11 / 2.21.7).'
      ja: '9 月に Spring Boot/Framework の新しい CVE はありません。同梱される依存関係: <strong>Tomcat</strong> CVE-2026-76183（WebSocket のセキュリティ制約バイパス、CVSS 9.8）および CVE-2026-86350（リクエスト間での HTTP/2 ヘッダー漏えい、9.1）、<strong>Netty</strong> 23 件のアドバイザリが 4.1.138.Final で修正（HTTP/2、リクエストスマグリング）、<strong>Jackson</strong> サービス拒否 4 件（2.18.11 / 2.21.7 で修正）。'
    sev: high
    impact:
      vi: Ứng dụng Spring Boot (kể cả bản hết hỗ trợ) dùng Tomcat nhúng, WebSocket, HTTP/2 hoặc Netty (WebFlux).
      ja: 組み込み Tomcat、WebSocket、HTTP/2、または Netty（WebFlux）を使用する Spring Boot アプリケーション（サポート終了版を含む）。
    fix:
      vi: Nâng Tomcat lên 10.1.60 / 9.0.122, Netty lên 4.1.138.Final, Jackson lên 2.18.11 / 2.21.7. Scanner (OSV/GHSA) có thể thiếu phạm vi phiên bản của Netty.
      ja: Tomcat を 10.1.60 / 9.0.122、Netty を 4.1.138.Final、Jackson を 2.18.11 / 2.21.7 にアップグレードしてください。スキャナー（OSV/GHSA）では Netty のバージョン範囲が不足している場合があります。
  - name: Laravel
    summary:
      vi: 'CVE-2026-102279 (09-10, CVSS 3.1): XSS ở trang debug khi bật <code>APP_DEBUG</code>, kích hoạt khi rê chuột vào tooltip.'
      ja: 'CVE-2026-102279（09-10、CVSS 3.1）: <code>APP_DEBUG</code> 有効時のデバッグページでの XSS。ツールチップにマウスを重ねると発動します。'
    sev: low
    impact:
      vi: Ứng dụng Laravel bật debug (thường là môi trường dev/staging).
      ja: デバッグを有効にしている Laravel アプリケーション（通常は dev/staging 環境）。
    fix:
      vi: Nâng lên 13.30.0 / 12.69.0, tắt <code>APP_DEBUG</code> ở production.
      ja: 13.30.0 / 12.69.0 にアップグレードし、本番環境では <code>APP_DEBUG</code> を無効にしてください。
  - name: Quasar
    summary:
      vi: 'CVE-2026-106101 (09-11, CVSS 3.1): <code>openURL()</code> bị phần tử HTML chèn vào làm hỏng trên iOS (từ chối dịch vụ phía client).'
      ja: 'CVE-2026-106101（09-11、CVSS 3.1）: 挿入された HTML 要素により iOS で <code>openURL()</code> が破損します（クライアント側のサービス拒否）。'
    sev: low
    impact:
      vi: Ứng dụng Quasar trên iOS (Cordova/Capacitor) hiển thị nội dung người dùng nhập.
      ja: ユーザー入力コンテンツを表示する、iOS 上の Quasar アプリケーション（Cordova/Capacitor）。
    fix:
      vi: Nâng <code>quasar</code> lên 2.32.2 trở lên.
      ja: <code>quasar</code> を 2.32.2 以上にアップグレードしてください。
  - name: Nuxt
    summary:
      vi: Không tìm thấy advisory tháng 9 (chỉ xem 2 trang đầu danh sách, chưa chắc là không có).
      ja: 9 月のアドバイザリは見つかりませんでした（一覧の最初の 2 ページのみ確認したため、存在しないとは断定できません）。
    sev: low
    impact:
      vi: Không có.
      ja: なし。
    fix:
      vi: Xem báo cáo 10/2026 cho các advisory mới hơn.
      ja: より新しいアドバイザリについては 10 月レポートを参照してください。
- title:
    vi: 4. Hạ tầng
    ja: 4. インフラストラクチャ
  type: provider
  rows:
  - name: GCP
    summary:
      vi: 'GCP-2026-058 (09-02): thiếu kiểm tra quyền project trong API cluster GKE Multi-Cloud. Google xếp Critical, chưa có CVE; chưa đọc chi tiết bản tin.'
      ja: 'GCP-2026-058（09-02）: GKE Multi-Cloud の cluster API でプロジェクト権限の確認が不足。Google は Critical と評価していますが、CVE は未割り当てです。ニュースの詳細は未確認です。'
    sev: crit
    impact:
      vi: GKE Multi-Cloud (cluster attached, AWS, Azure)
      ja: GKE Multi-Cloud（attached cluster、AWS、Azure）
    fix:
      vi: Đọc bản tin GKE để biết có cần hành động.
      ja: 対応が必要かどうか、GKE のセキュリティ情報を確認してください。
  - name: GCP
    summary:
      vi: 'GCP-2026-063 (09-16, CVE-2026-15587): nâng quyền qua header xác thực nội bộ. GCP-2026-064 (09-28, CVE-2026-19759) và -065 (CVE-2026-81867, thực thi mã qua JavaScript Task): lỗi ở Application Integration.'
      ja: 'GCP-2026-063（09-16、CVE-2026-15587）: 内部認証ヘッダー経由の権限昇格。GCP-2026-064（09-28、CVE-2026-19759）および -065（CVE-2026-81867、JavaScript Task 経由のコード実行）: Application Integration の脆弱性。'
    sev: crit
    impact:
      vi: Google SecOps SOAR; Application Integration
      ja: Google SecOps SOAR、Application Integration
    fix:
      vi: Không cần làm gì, Google đã vá (SOAR tự nâng cấp lên 6.3.85+; Application Integration vá từ tháng 6).
      ja: 対応は不要です。Google が修正済みです（SOAR は 6.3.85 以上に自動アップグレード、Application Integration は 6 月に修正）。
  - name: GCP
    summary:
      vi: 'GCP-2026-060 và -062 (09-04, 09-11): nhiều lỗi Slurm (CVE-2026-65107...). GCP-2026-066 (09-28, CVE-2026-81375): đọc file nội bộ qua Email Task (đã vá 06-30). GCP-2026-059 (09-04): thiếu kiểm tra quyền ở HTTP Connector (đã vá từ 12/2025).'
      ja: 'GCP-2026-060 および -062（09-04、09-11）: Slurm の複数の脆弱性（CVE-2026-65107 ほか）。GCP-2026-066（09-28、CVE-2026-81375）: Email Task 経由の内部ファイル読み取り（06-30 に修正済み）。GCP-2026-059（09-04）: HTTP Connector の権限確認不足（2025 年 12 月に修正済み）。'
    sev: high
    impact:
      vi: Cluster Toolkit, Cluster Director; Application Integration; Integration Connectors
      ja: Cluster Toolkit、Cluster Director、Application Integration、Integration Connectors
    fix:
      vi: 'Cluster Toolkit: xem bản tin sản phẩm. Còn lại không cần làm gì.'
      ja: 'Cluster Toolkit: 製品のセキュリティ情報を確認してください。それ以外は対応不要です。'
  - name: GCP
    summary:
      vi: 'GCP-2026-061 (09-09): lỗi containerd khi khôi phục container từ checkpoint không tin cậy.'
      ja: 'GCP-2026-061（09-09）: 信頼できないチェックポイントからコンテナを復元する際の containerd の脆弱性。'
    sev: med
    impact:
      vi: GKE có cài thêm <code>criu</code> trên node (cluster mặc định không bị)
      ja: ノードに <code>criu</code> を追加インストールしている GKE（デフォルトのクラスターは影響なし）
    fix:
      vi: Cluster mặc định không cần làm gì.
      ja: デフォルトのクラスターは対応不要です。
  - name: AWS
    summary:
      vi: '2026-107-AWS (09-10, CVE-2026-89049): SSM Agent cho phép port forwarding tới endpoint metadata và lấy credentials IAM của instance. 2026-112 (09-14, CVE-2026-86830): TEAM for IAM Identity Center cấp quyền cao ngoài ý muốn.'
      ja: '2026-107-AWS（09-10、CVE-2026-89049）: SSM Agent でメタデータエンドポイントへのポートフォワーディングが可能となり、インスタンスの IAM 認証情報を取得できます。2026-112（09-14、CVE-2026-86830）: TEAM for IAM Identity Center が意図しない高い権限を付与します。'
    sev: high
    impact:
      vi: EC2/máy dùng SSM Agent dưới 3.3.4851.0; TEAM dưới 1.5.1
      ja: SSM Agent 3.3.4851.0 未満を使用する EC2/マシン、TEAM 1.5.1 未満
    fix:
      vi: Nâng SSM Agent / TEAM; giới hạn <code>ssm:StartSession</code> trong lúc chờ.
      ja: SSM Agent / TEAM をアップグレードし、それまでの間は <code>ssm:StartSession</code> を制限してください。
  - name: AWS
    summary:
      vi: '2026-113-AWS (09-16, CVE-2026-86831): EKS Network Policy Agent trộn lẫn pod trùng tên giữa namespace, có thể lách NetworkPolicy.'
      ja: '2026-113-AWS（09-16、CVE-2026-86831）: EKS Network Policy Agent が名前空間をまたいで同名の pod を混同し、NetworkPolicy を回避される可能性があります。'
    sev: high
    impact:
      vi: EKS dùng Network Policy Agent dưới 1.4.0 / VPC CNI từ 1.14.0 đến dưới 1.22.3
      ja: Network Policy Agent 1.4.0 未満 / VPC CNI 1.14.0 以上 1.22.3 未満を使用する EKS
    fix:
      vi: Nâng agent lên 1.4.0 và VPC CNI add-on lên 1.22.4.
      ja: agent を 1.4.0、VPC CNI アドオンを 1.22.4 にアップグレードしてください。
  - name: AWS
    summary:
      vi: 'Lỗi ở SDK/thư viện: 2026-114 (IoT SDK for Python, không kiểm tra hostname chứng chỉ); 2026-115 (Amazon Connect Salesforce Lambda, thiếu kiểm tra quyền); 2026-106 (Deep Java Library); 2026-119 (GluonTS chạy lệnh từ model); 2026-117 (Kiro IDE); 2026-104 và -101 (postgres-mcp-server); 2026-118 (pgcollection, tự build).'
      ja: 'SDK/ライブラリの脆弱性: 2026-114（IoT SDK for Python、証明書のホスト名を検証しない）、2026-115（Amazon Connect Salesforce Lambda、権限確認の不足）、2026-106（Deep Java Library）、2026-119（GluonTS がモデルからコマンドを実行）、2026-117（Kiro IDE）、2026-104 および -101（postgres-mcp-server）、2026-118（pgcollection、自前ビルド）。'
    sev: high
    impact:
      vi: Dự án dùng các SDK/công cụ tương ứng. RDS/Aurora không bị ảnh hưởng bởi 2026-118.
      ja: 該当する SDK/ツールを使用するプロジェクト。RDS/Aurora は 2026-118 の影響を受けません。
    fix:
      vi: Cập nhật từng thư viện theo bản tin.
      ja: 各セキュリティ情報に従って、ライブラリごとに更新してください。
  - name: AWS
    summary:
      vi: Các bản tin còn lại (2026-099 đến 2026-119, gồm EFS CSI driver, ion-java, OpenSearch Dashboards, Go SDK v2, projen, JDBC Wrapper, s2n-quic...). AWS không nêu mức độ nên cột này là đánh giá tạm.
      ja: その他のセキュリティ情報（2026-099 から 2026-119。EFS CSI driver、ion-java、OpenSearch Dashboards、Go SDK v2、projen、JDBC Wrapper、s2n-quic などを含む）。AWS は重大度を示していないため、この列は暫定的な評価です。
    sev: med
    impact:
      vi: Người dùng thành phần tương ứng
      ja: 該当コンポーネントのユーザー
    fix:
      vi: Cập nhật nếu đang dùng.
      ja: 使用している場合は更新してください。
- title:
    vi: 5. Ghi chú về độ tin cậy
    ja: 5. 信頼性に関する注記
  type: list
  items:
  - vi: <strong>Đã đọc trực tiếp nguồn chính thức:</strong> PHP ChangeLog (php.net), nodejs.org, advisory GitHub của Next.js, Laravel, Quasar, trang bản tin AWS 2026-099 đến 119, trang danh sách bản tin GCP.
    ja: <strong>公式情報源を直接確認済み:</strong> PHP ChangeLog（php.net）、nodejs.org、Next.js・Laravel・Quasar の GitHub アドバイザリ、AWS セキュリティ情報 2026-099 から 119 のページ、GCP セキュリティ情報の一覧ページ。
  - vi: <strong>PHP:</strong> chưa mở từng advisory nên chưa có CVSS và phạm vi phiên bản; chỉ xem phần 8.5 và 8.4 của changelog.
    ja: <strong>PHP:</strong> 個別のアドバイザリは開いていないため、CVSS とバージョン範囲は未確認です。changelog の 8.5 と 8.4 の部分のみ確認しました。
  - vi: <strong>Next.js:</strong> các số hiệu bản vá ghi "16.3.?" trên trang advisory chưa được xác nhận. Chỉ xem trang 1 của danh sách advisory.
    ja: <strong>Next.js:</strong> アドバイザリページで「16.3.?」と記載されている修正バージョン番号は未確認です。アドバイザリ一覧は 1 ページ目のみ確認しました。
  - vi: <strong>Nuxt:</strong> chỉ xem 2 trang đầu của danh sách, nên "không có advisory tháng 9" chưa chắc chắn.
    ja: <strong>Nuxt:</strong> 一覧の最初の 2 ページのみ確認したため、「9 月のアドバイザリなし」は確実ではありません。
  - vi: <strong>Spring Boot:</strong> Tomcat, Netty, Jackson lấy từ một bài tổng hợp (HeroDevs), chưa đối chiếu với Apache/Netty/Jackson. spring.io không có mục tháng 9 (chưa kiểm tra nút "Load more").
    ja: <strong>Spring Boot:</strong> Tomcat、Netty、Jackson は 1 件のまとめ記事（HeroDevs）から引用しており、Apache/Netty/Jackson の公式情報とは照合していません。spring.io には 9 月の項目がありません（「Load more」ボタンは未確認）。
  - vi: <strong>Java:</strong> bản vá 09-15 của Oracle chỉ có từ một trang tổng hợp (aicybr.com), chưa đọc oracle.com.
    ja: <strong>Java:</strong> Oracle の 09-15 の修正は、まとめページ（aicybr.com）のみが情報源で、oracle.com は確認していません。
  - vi: <strong>.NET và Windows:</strong> chưa đọc MSRC; số liệu từ Help Net Security, Tenable và aicybr.com. Số CVE tổng khác nhau giữa các nguồn (964 đến 974). Mô tả CVE-2026-69439 chưa thống nhất giữa các nguồn.
    ja: <strong>.NET と Windows:</strong> MSRC は確認しておらず、数値は Help Net Security、Tenable、aicybr.com によるものです。CVE の総数は情報源によって異なります（964 から 974）。CVE-2026-69439 の説明は情報源間で一致していません。
  - vi: <strong>Chrome:</strong> CVE-2026-87491 từ BleepingComputer; bản 09-09 không thấy trong danh sách Chrome Releases, nên ngày và số bản cần xác minh. Không đọc được nội dung các bản 09-22 và 09-29. MALFEX chỉ có một nguồn.
    ja: <strong>Chrome:</strong> CVE-2026-87491 は BleepingComputer によるものです。09-09 版は Chrome Releases の一覧に見当たらないため、日付とバージョン番号は要確認です。09-22 と 09-29 のリリースの内容は確認できませんでした。MALFEX は情報源が 1 件のみです。
  - vi: <strong>GCP:</strong> chỉ đọc trang danh sách, chưa mở từng bản tin; GCP-2026-058 chưa rõ cần làm gì.
    ja: <strong>GCP:</strong> 一覧ページのみ確認し、個別のセキュリティ情報は開いていません。GCP-2026-058 は必要な対応が不明です。
  - vi: <strong>AWS:</strong> bản tin không nêu mức độ, nên cột mức độ là đánh giá tạm. Chưa kiểm tra bản tin 2026-098 trở xuống (có thể rơi vào 09-01 đến 09-03).
    ja: <strong>AWS:</strong> セキュリティ情報に重大度が示されていないため、重大度の列は暫定的な評価です。2026-098 以前のセキュリティ情報（09-01 から 09-03 にかかる可能性があります）は確認していません。
  - vi: <strong>Chuyển từ tháng 8:</strong> GCP-2026-055 (08-25, mức cao) là lỗi RCE ở Next.js và libheif, vá ở Next.js 16.3.3 / 15.5.24 trở lên và cần build lại image với libheif đã vá.
    ja: <strong>8 月からの持ち越し:</strong> GCP-2026-055（08-25、重大度高）は Next.js と libheif の RCE で、Next.js 16.3.3 / 15.5.24 以上で修正されており、修正済みの libheif でイメージを再ビルドする必要があります。
