  ja: 2026年10月 セキュリティレポート
sub:
  vi: Số liệu tính đến <strong>2026-10-30</strong>. Tháng chưa kết thúc, cần cập nhật lại cuối tháng.
  ja: <strong>2026年10月30日</strong>時点の情報です。月はまだ終了していないため、月末に再更新が必要です。
placeholder:
  vi: '🔍 Tìm kiếm CVE, framework, thư viện (vd: PHP, Next.js, AWS, RCE)...'
  ja: '🔍 CVE、フレームワーク、ライブラリで検索（例: PHP, Next.js, AWS, RCE）...'
scope:
  vi: <strong>Phạm vi rà soát:</strong> Hạ tầng (AWS, GCP) · Ngôn ngữ (NodeJS, PHP, Java, .NET, JavaScript) · Framework (Next.js, Nuxt, Quasar, Laravel, Spring Boot).
  ja: <strong>調査範囲:</strong> インフラ（AWS, GCP） · 言語（NodeJS, PHP, Java, .NET, JavaScript） · フレームワーク（Next.js, Nuxt, Quasar, Laravel, Spring Boot）。
card:
  title:
    vi: Báo cáo tháng 10/2026
    ja: 2026年10月レポート
  date:
    vi: Cập nhật đến 2026-10-30 · Định kỳ hàng tháng
    ja: 2026年10月30日 時点 · 月次定期レポート
  items:
  - sev: crit
    label: PHP
    text:
      vi: 'CVE-2026-109618/-109619 ("PHP2Shell"): chiếm quyền server từ xa. Nâng lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 và tạm đặt <code>session.upload_progress.enabled=0</code> (phòng ngừa thêm CVE-2026-115560).'
      ja: 'CVE-2026-109618/-109619 ("PHP2Shell"): サーバーの遠隔乗っ取り。8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 へアップグレードし、暫定措置として <code>session.upload_progress.enabled=0</code> を設定 (CVE-2026-115560 の予防にもなります)。'
  - sev: crit
    label: Next.js
    text:
      vi: 2 lỗi chiếm quyền server từ xa (<code>use cache</code>, Image Optimization). Nâng lên 16.4.1 / 15.5.28.
      ja: サーバーを遠隔から乗っ取られる脆弱性が2件 (<code>use cache</code>、Image Optimization)。16.4.1 / 15.5.28 へアップグレード。
  - sev: high
    label: Linux kernel
    text:
      vi: 'CVE-2026-98432: lỗi use-after-free TCP IPv4 (CVSS 9.8 theo kernel CNA, chưa thấy khai thác thực tế). Cập nhật kernel và reboot; ưu tiên máy/node lộ internet.'
      ja: 'CVE-2026-98432: TCP IPv4 の use-after-free (カーネル CNA の CVSS は 9.8、実際の悪用は未確認)。カーネルを更新して再起動。インターネットに公開されたホスト/ノードを優先。'
  - sev: high
    label: Laravel
    text:
      vi: 'CVE-2026-114509: giả danh người dùng không cần token (MySQL/MariaDB). Nâng lên 13.38.0 / 12.70.1.'
      ja: 'CVE-2026-114509: トークンなしでユーザーになりすまし可能 (MySQL/MariaDB)。13.38.0 / 12.70.1 へアップグレード。'
  - sev: high
    label: AWS/GCP
    text:
      vi: 'Rò rỉ khóa intermediate CA eMudhra (CVE-2026-111943): cập nhật trust bundle (<code>yum update ca-certificates</code>, botocore ≥ 1.43.117) và thay thế chứng chỉ liên quan trước <strong>28-10-2026</strong>.'
      ja: 'eMudhra の中間CA鍵の漏えい (CVE-2026-111943): トラストバンドルを更新 (<code>yum update ca-certificates</code>、botocore ≥ 1.43.117) し、関連する証明書を <strong>2026年10月28日</strong>までに交換してください。'
sections:
- title:
    vi: 1. Việc cần làm ngay
    ja: 1. 今すぐ対応すべき事項
  type: actions
  rows:
  - task:
      vi: Nâng cấp <strong>PHP</strong> lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 và tạm đặt <code>session.upload_progress.enabled=0</code> (phòng ngừa PHP2Shell và CVE-2026-115560)
      ja: <strong>PHP</strong> を 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 にアップグレードし、暫定的に <code>session.upload_progress.enabled=0</code> を設定する（PHP2Shell および CVE-2026-115560 の予防）
    sev: crit
    due:
      vi: Ngay
      ja: 即時
  - task:
      vi: Nâng cấp <strong>Next.js</strong> lên 16.4.1 / 15.5.28 (2 lỗi chiếm quyền server từ xa qua <code>use cache</code> và Image Optimization)
      ja: <strong>Next.js</strong> を 16.4.1 / 15.5.28 にアップグレードする（<code>use cache</code> と Image Optimization 経由のリモートサーバー乗っ取りが可能な 2 件の脆弱性）
    sev: crit
    due:
      vi: Ngay
      ja: 即時
  - task:
      vi: Nâng cấp <strong>Laravel</strong> lên 13.38.0 / 12.70.1 (tối thiểu 13.29.0 / 12.68.0, lỗi đăng nhập giả mạo không cần token và xóa dữ liệu)
      ja: <strong>Laravel</strong> を 13.38.0 / 12.70.1 にアップグレードする（最低でも 13.29.0 / 12.68.0。トークン不要のなりすましログインとデータ削除の脆弱性）
    sev: crit
    due:
      vi: Ngay nếu dùng token API với MySQL/MariaDB
      ja: MySQL/MariaDB で API トークンを使用している場合は即時
  - task:
      vi: Cập nhật chứng chỉ CA và trust bundle trên <strong>AWS &amp; GCP</strong> do sự cố rò rỉ khóa CA eMudhra (CVE-2026-111943); thay thế chứng chỉ trước hạn
      ja: eMudhra CA の鍵漏えいインシデント（CVE-2026-111943）に伴い、<strong>AWS &amp; GCP</strong> 上の CA 証明書と trust bundle を更新し、期限前に証明書を差し替える
    sev: high
    due:
      vi: Trước 28-10-2026
      ja: 2026年10月28日まで
  - task:
      vi: Nâng cấp <strong>Node.js</strong> lên 26.12.1 / 24.22.1 / 22.23.4 (4 lỗi mức cao, có 1 lỗi chiếm quyền qua Brotli)
      ja: <strong>Node.js</strong> を 26.12.1 / 24.22.1 / 22.23.4 にアップグレードする（高レベルの脆弱性 4 件。うち 1 件は Brotli 経由の乗っ取りが可能）
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Nâng cấp <strong>Nuxt</strong> lên 4.6.2 (vá 5 advisory ngày 16-10; Nuxt 3 đã EOL không có bản vá, cần kế hoạch lên Nuxt 4)
      ja: <strong>Nuxt</strong> を 4.6.2 にアップグレードする（10月16日に 5 件のアドバイザリを修正。Nuxt 3 は EOL でパッチなし、Nuxt 4 への移行計画が必要）
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: 'Cập nhật <strong>kernel Linux</strong> (EC2/GCE, node EKS/GKE, Docker host) cho CVE-2026-98432 rồi reboot; ưu tiên máy mở cổng TCP ra internet. <a href="@home@linux-cve-2026-98432/analysis/">Phân tích chi tiết</a>'
      ja: 'CVE-2026-98432 に対応するため、<strong>Linux カーネル</strong> (EC2/GCE、EKS/GKE ノード、Docker ホスト) を更新して再起動する。インターネットに TCP ポートを公開しているホストを優先。<a href="@home@linux-cve-2026-98432/analysis/">詳細分析</a>'
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Cập nhật <strong>Java</strong> (Oracle CPU 10-20, Corretto) và <strong>.NET / ASP.NET Core</strong> (Patch Tuesday 10-13)
      ja: <strong>Java</strong>（Oracle CPU 10月20日、Corretto）と <strong>.NET / ASP.NET Core</strong>（Patch Tuesday 10月13日）を更新する
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Cập nhật <strong>Chrome/Chromium</strong> lên bản 155.x mới nhất
      ja: <strong>Chrome/Chromium</strong> を最新の 155.x に更新する
    sev: high
    due:
      vi: Trong tuần
      ja: 今週中
  - task:
      vi: Cập nhật <strong>Quasar</strong> lên 2.35.2 / @quasar/app-vite 3.10.3 và rà soát gói phụ thuộc <strong>npm</strong>
      ja: <strong>Quasar</strong> を 2.35.2 / @quasar/app-vite 3.10.3 に更新し、<strong>npm</strong> の依存パッケージを点検する
    sev: med
    due:
      vi: Trong tháng
      ja: 今月中
- title:
    vi: 2. Ngôn ngữ
    ja: 2. 言語
  type: component
  rows:
  - name: PHP
    summary:
      vi: 'CVE-2026-109618, -109619 ("PHP2Shell", CVSS 9.2, chiếm server từ xa không cần đăng nhập). Ngày 10-23 công bố thêm thông báo CVE-2026-115560: nguy cơ RCE nếu đổi serialize handler sang <code>php</code> ở runtime trong khi bật upload progress.'
      ja: CVE-2026-109618, -109619（「PHP2Shell」、CVSS 9.2、認証不要でリモートからサーバーを乗っ取り可能）。10月23日に CVE-2026-115560 の告知が追加公開されました。upload progress が有効な状態で、実行時に serialize handler を <code>php</code> に変更すると RCE の恐れがあります。
    sev: crit
    impact:
      vi: Mọi ứng dụng PHP (PHP-FPM, mod_php, FrankenPHP, LiteSpeed), kể cả Laravel, Drupal. Nhánh 8.1 trở xuống đã EOL không có bản vá chính thức.
      ja: Laravel、Drupal を含むすべての PHP アプリケーション（PHP-FPM、mod_php、FrankenPHP、LiteSpeed）。8.1 以前のブランチは EOL で公式パッチはありません。
    fix:
      vi: Nâng PHP lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35. Đặt thêm <code>session.upload_progress.enabled = 0</code> trong <code>php.ini</code> để phòng ngừa CVE-2026-115560. <a href="https://github.com/pirago-vietnam/security-news/tree/main/php-cve-2026-109618-109619/01-tong-quan.md" target="_blank" rel="noopener noreferrer">Chi tiết runbook nội bộ</a>
      ja: PHP を 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 にアップグレードしてください。CVE-2026-115560 の予防として、<code>php.ini</code> に <code>session.upload_progress.enabled = 0</code> も設定してください。<a href="https://github.com/pirago-vietnam/security-news/tree/main/php-cve-2026-109618-109619/01-tong-quan.md" target="_blank" rel="noopener noreferrer">社内ランブックの詳細</a>
  - name: Node.js
    summary:
      vi: 'Bản phát hành 10-21: lỗi Brotli ghi ngoài vùng nhớ (có thể chiếm quyền, CVE-2026-111497); 2 lỗi bỏ qua kiểm tra tên miền của chứng chỉ TLS (CVE-2026-105483, -106069); lỗi <code>dns.resolve</code> (CVE-2026-105482). Thêm 6 lỗi nhẹ hơn.'
      ja: 10月21日リリース：Brotli のメモリ範囲外書き込み（乗っ取りの可能性あり、CVE-2026-111497）、TLS 証明書のホスト名検証を回避される 2 件の脆弱性（CVE-2026-105483, -106069）、<code>dns.resolve</code> の脆弱性（CVE-2026-105482）。ほかに軽度の脆弱性 6 件。
    sev: high
    impact:
      vi: Dịch vụ chạy Node.js 22.x, 24.x, 26.x (API, SSR, worker, Next.js, Nuxt). Client gọi HTTPS bằng Node có nguy cơ bị nghe lén.
      ja: Node.js 22.x、24.x、26.x で動作するサービス（API、SSR、ワーカー、Next.js、Nuxt）。Node で HTTPS 呼び出しを行うクライアントは盗聴される恐れがあります。
    fix:
      vi: Nâng lên 26.12.1 / 24.22.1 / 22.23.4. Bản đã hết hỗ trợ (EOL) luôn bị ảnh hưởng, cần chuyển bản.
      ja: 26.12.1 / 24.22.1 / 22.23.4 にアップグレードしてください。サポート終了（EOL）のバージョンは常に影響を受けるため、バージョンの移行が必要です。
  - name: Java
    summary:
      vi: 'Oracle CPU 10-20: 55 bản vá cho Java SE, 49 lỗi khai thác từ xa không cần đăng nhập (điểm cao nhất khoảng 7.5). AWS Corretto phát hành bản vá cập nhật trust bundle cho sự cố eMudhra CA.'
      ja: Oracle CPU 10月20日：Java SE 向けに 55 件のパッチ、認証不要でリモートから悪用可能な脆弱性が 49 件（最高スコアは約 7.5）。AWS Corretto は eMudhra CA インシデントに対応した trust bundle 更新パッチをリリースしました。
    sev: high
    impact:
      vi: Oracle JDK/JRE, OpenJDK và Amazon Corretto cùng nhánh, gồm ứng dụng Spring Boot. Nặng hơn với ứng dụng chạy mã không tin cậy.
      ja: Oracle JDK/JRE、OpenJDK、同ブランチの Amazon Corretto（Spring Boot アプリケーションを含む）。信頼できないコードを実行するアプリケーションでは特に深刻です。
    fix:
      vi: 'Nâng lên 27.0.1 / 25.0.5 / 21.0.13 / 17.0.21 / 11.0.33 / 8u511 hoặc Corretto tương ứng. Đợt tiếp theo: 11-17.'
      ja: 27.0.1 / 25.0.5 / 21.0.13 / 17.0.21 / 11.0.33 / 8u511、または対応する Corretto にアップグレードしてください。次回のリリースは 11月17日です。
  - name:
      vi: .NET (gồm ASP.NET Core)
      ja: .NET（ASP.NET Core を含む）
    summary:
      vi: 'Patch Tuesday 10-13: hơn 30 CVE cho .NET, 13 CVE cho ASP.NET Core. Đáng chú ý: 5 lỗi chạy mã từ xa (CVSS 8.8), CVE-2026-88092 (can thiệp request, 9.4), CVE-2026-70188 (bỏ qua bảo mật, 9.1). Microsoft xếp tất cả mức Important, chưa thấy bị khai thác.'
      ja: Patch Tuesday 10月13日：.NET に関する CVE が 30 件超、ASP.NET Core に関する CVE が 13 件。注目点は、リモートコード実行 5 件（CVSS 8.8）、CVE-2026-88092（リクエスト改ざん、9.4）、CVE-2026-70188（セキュリティ機能のバイパス、9.1）。Microsoft はすべて Important に分類しており、悪用は確認されていません。
    sev: high
    impact:
      vi: Ứng dụng .NET 8/9/10 và .NET Framework (Windows, Linux, container); web/API ASP.NET Core, nhất là sau reverse proxy.
      ja: .NET 8/9/10 および .NET Framework のアプリケーション（Windows、Linux、コンテナ）。ASP.NET Core の Web/API（特にリバースプロキシの背後）。
    fix:
      vi: Cập nhật runtime/SDK bản tháng 10, build lại image container.
      ja: 10月版のランタイム/SDK に更新し、コンテナイメージを再ビルドしてください。
  - name:
      vi: JavaScript (trình duyệt + npm)
      ja: JavaScript（ブラウザ + npm）
    summary:
      vi: <strong>Trình duyệt:</strong> Chrome 155 (10-06) sửa 247 lỗi, 4 lỗi Critical; các bản cập nhật 10-13, 10-15 và bản cập nhật desktop ngày 10-20 tiếp tục vá bổ sung. <strong>npm:</strong> chiến dịch gói độc hại giả "Apex Web3" (10-13) phát tán mã đánh cắp dữ liệu, nhắm cả AI coding agent.
      ja: <strong>ブラウザ:</strong> Chrome 155（10月6日）で 247 件の脆弱性を修正、うち Critical は 4 件。10月13日、10月15日の更新、および 10月20日のデスクトップ更新でさらに追加パッチが提供されました。<strong>npm:</strong> 偽の「Apex Web3」悪意あるパッケージのキャンペーン（10月13日）が情報窃取コードを拡散し、AI コーディングエージェントも標的にしています。
    sev: high
    impact:
      vi: Người dùng Chrome, Edge, Brave; ứng dụng Electron/WebView; máy dev và pipeline CI cài gói npm.
      ja: Chrome、Edge、Brave のユーザー、Electron/WebView アプリケーション、npm パッケージをインストールする開発マシンと CI パイプライン。
    fix:
      vi: Cập nhật trình duyệt và Electron. Dùng lockfile, <code>npm ci</code>, tắt install script khi không cần, kiểm tra gói mới thêm.
      ja: ブラウザと Electron を更新してください。lockfile と <code>npm ci</code> を使用し、不要な場合は install script を無効にし、新規追加されたパッケージを確認してください。
- title:
    vi: 3. Framework
    ja: 3. フレームワーク
  type: component
  rows:
  - name: Next.js
    summary:
      vi: 'Bản vá 10-14: (1) chiếm quyền server từ xa khi <code>use cache</code> trả về typed array (GHSA-673q-mjm6-r5xr), không có cách né tạm; (2) chiếm quyền qua Image Optimization với file SVG (CVE-2026-96889, GHSA-2464-fhr4-w9xw); (3) làm sập server qua Server Actions (GHSA-p3m5-59mp-jv5r).'
      ja: 10月14日のパッチ：(1) <code>use cache</code> が typed array を返す場合のリモートサーバー乗っ取り（GHSA-673q-mjm6-r5xr）、暫定的な回避策なし。(2) SVG ファイルを用いた Image Optimization 経由の乗っ取り（CVE-2026-96889、GHSA-2464-fhr4-w9xw）。(3) Server Actions 経由のサーバーダウン（GHSA-p3m5-59mp-jv5r）。
    sev: crit
    impact:
      vi: Ứng dụng Next.js 15.x và 16.x dùng App Router. Lỗi Image Optimization đến từ thư viện <code>sharp</code>, chạy trên Linux glibc.
      ja: App Router を使用する Next.js 15.x および 16.x のアプリケーション。Image Optimization の脆弱性はライブラリ <code>sharp</code> に起因し、Linux glibc 上で動作します。
    fix:
      vi: Nâng lên 16.4.1 / 15.5.28. Riêng CVE-2026-96889 có thể tạm dùng <code>sharp</code> ≥ 0.35.5.
      ja: 16.4.1 / 15.5.28 にアップグレードしてください。CVE-2026-96889 のみ、暫定的に <code>sharp</code> ≥ 0.35.5 でも対処可能です。
  - name: Laravel
    summary:
      vi: 'Advisory 10-19: CVE-2026-114509 (CVSS 9.2, GHSA-f9x3-7vq9-cph6) giả danh người dùng mà không cần token khi dùng MySQL/MariaDB. CVE-2026-114508 (6.5, GHSA-5wcm-3v2w-8362): request đọc có thể kích hoạt xóa dữ liệu bảng liên quan.'
      ja: 10月19日のアドバイザリ：CVE-2026-114509（CVSS 9.2、GHSA-f9x3-7vq9-cph6）MySQL/MariaDB 使用時にトークンなしでユーザーになりすませます。CVE-2026-114508（6.5、GHSA-5wcm-3v2w-8362）：読み取りリクエストが関連テーブルのデータ削除を引き起こす可能性があります。
    sev: crit
    impact:
      vi: Ứng dụng Laravel dùng guard token API (<code>TokenGuard</code>) trên MySQL/MariaDB; ứng dụng nạp quan hệ trên endpoint chỉ đọc. Vẫn cần vá PHP phía dưới.
      ja: MySQL/MariaDB 上で API トークンガード（<code>TokenGuard</code>）を使用する Laravel アプリケーション、読み取り専用エンドポイントでリレーションを読み込むアプリケーション。基盤となる PHP のパッチ適用も引き続き必要です。
    fix:
      vi: Nâng lên bản mới nhất 13.38.0 / 12.70.1 (tối thiểu 13.29.0 / 12.68.0). Luôn tắt <code>APP_DEBUG</code> ở production.
      ja: 最新版の 13.38.0 / 12.70.1 にアップグレードしてください（最低 13.29.0 / 12.68.0）。本番環境では必ず <code>APP_DEBUG</code> を無効にしてください。
  - name: Nuxt
    summary:
      vi: '5 advisory ngày 10-16: bỏ qua route rules/middleware khi đường dẫn khác chữ hoa/thường (GHSA-vjh5-4x84-xrqp) hoặc mã hóa % (GHSA-6gq8-jgmh-3ffp); <code>useHeadSafe</code> render dữ liệu chưa khử khuẩn ở Server Islands (GHSA-xfq5-w38q-pc2x); lỗi URL <code>javascript:</code> ở <code>&lt;NuxtLink&gt;</code> (GHSA-jjm6-p2m9-9w4x); lỗi <code>getRouterParam</code> với <code>%3F</code> (GHSA-w7gw-66vg-99gq). Còn hiệu lực: CVE-2026-71316 (lộ dữ liệu SSR cache).'
      ja: 10月16日の 5 件のアドバイザリ：パスの大文字小文字の違い（GHSA-vjh5-4x84-xrqp）または % エンコード（GHSA-6gq8-jgmh-3ffp）によるルートルール/ミドルウェアのバイパス、Server Islands で <code>useHeadSafe</code> がサニタイズされていないデータを描画（GHSA-xfq5-w38q-pc2x）、<code>&lt;NuxtLink&gt;</code> での <code>javascript:</code> URL の脆弱性（GHSA-jjm6-p2m9-9w4x）、<code>%3F</code> を含む <code>getRouterParam</code> の脆弱性（GHSA-w7gw-66vg-99gq）。引き続き有効：CVE-2026-71316（SSR キャッシュデータの漏えい）。
    sev: high
    impact:
      vi: Ứng dụng Nuxt 3/4 dùng route rules, middleware, server island, hoặc cache SSR. <strong>Lưu ý:</strong> Nuxt 3 đã kết thúc vòng đời (EOL 31-07-2026) và không được nhận bản vá cho các lỗi này.
      ja: ルートルール、ミドルウェア、server island、または SSR キャッシュを使用する Nuxt 3/4 アプリケーション。<strong>注意:</strong> Nuxt 3 はライフサイクルが終了しており（2026年7月31日 EOL）、これらの脆弱性に対するパッチは提供されません。
    fix:
      vi: Nâng Nuxt lên <strong>≥ 4.6.2</strong> (hoặc bản phụ 4.4.4 / 4.5.2). Với dự án Nuxt 3, cần lên kế hoạch nâng cấp lên Nuxt 4 do nhánh 3.x không còn được hỗ trợ.
      ja: Nuxt を <strong>≥ 4.6.2</strong>（またはマイナー版 4.4.4 / 4.5.2）にアップグレードしてください。Nuxt 3 のプロジェクトは、3.x ブランチがサポート対象外のため、Nuxt 4 へのアップグレード計画が必要です。
  - name: Quasar
    summary:
      vi: Các advisory bảo mật (prototype pollution ở <code>extend()</code> - GHSA-qgrf-j65m-5hh8; treo server SSR do regex User-Agent - GHSA-68jq-fhch-4xq4; rò rỉ env trang lỗi dev SSR - GHSA-r5mf-4r5x-q78f; ghi file qua icongenie - GHSA-wmpw-j6qv-mw88) đều đã được khắc phục hoàn toàn trên các bản hiện tại.
      ja: セキュリティアドバイザリ（<code>extend()</code> の prototype pollution - GHSA-qgrf-j65m-5hh8、User-Agent の正規表現による SSR サーバーのハング - GHSA-68jq-fhch-4xq4、開発用 SSR エラーページでの env 漏えい - GHSA-r5mf-4r5x-q78f、icongenie 経由のファイル書き込み - GHSA-wmpw-j6qv-mw88）は、いずれも現行バージョンで完全に修正済みです。
    sev: med
    impact:
      vi: Ứng dụng Quasar dùng SSR/SSG; máy dev dùng <code>icongenie</code>, <code>@quasar/cli</code>, <code>@quasar/app-vite</code>.
      ja: SSR/SSG を使用する Quasar アプリケーション、<code>icongenie</code>、<code>@quasar/cli</code>、<code>@quasar/app-vite</code> を使用する開発マシン。
    fix:
      vi: Nâng Quasar lên bản mới nhất <strong>≥ 2.35.2</strong> và <code>@quasar/app-vite</code> <strong>≥ 3.10.3</strong>. Tắt trang lỗi SSR dev ở môi trường dùng chung.
      ja: Quasar を最新版の <strong>≥ 2.35.2</strong>、<code>@quasar/app-vite</code> を <strong>≥ 3.10.3</strong> にアップグレードしてください。共有環境では開発用 SSR エラーページを無効にしてください。
  - name: Spring Boot
    summary:
      vi: 'Không có advisory mới trong tháng 10 (advisory gần nhất từ tháng 8). Còn hiệu lực: CVE-2026-40976 (CVSS 9.1) cấu hình bảo mật web mặc định không có tác dụng, mở mọi endpoint (4.0.0 đến 4.0.5). Tháng 9 có hơn 50 CVE từ Tomcat, Netty.'
      ja: 10月は新しいアドバイザリはありません（直近のアドバイザリは 8月）。引き続き有効：CVE-2026-40976（CVSS 9.1）デフォルトの Web セキュリティ設定が機能せず、すべてのエンドポイントが公開される（4.0.0 から 4.0.5）。9月には Tomcat、Netty 由来の CVE が 50 件超ありました。
    sev: med
    impact:
      vi: Spring Boot 4.0.0 đến 4.0.5 không tự cấu hình Spring Security; ứng dụng dùng Tomcat/Netty cũ.
      ja: Spring Security を自動構成しない Spring Boot 4.0.0 から 4.0.5、古い Tomcat/Netty を使用するアプリケーション。
    fix:
      vi: Dùng Spring Boot ≥ 4.0.6 / 3.5.14, cập nhật Tomcat/Netty, quét phụ thuộc kỹ.
      ja: Spring Boot ≥ 4.0.6 / 3.5.14 を使用し、Tomcat/Netty を更新し、依存関係を入念にスキャンしてください。
- title:
    vi: '4. Hạ tầng (Infrastructure: AWS &amp; GCP)'
    ja: '4. インフラ（Infrastructure: AWS &amp; GCP）'
  type: provider
  rows:
  - name: AWS
    summary:
      vi: '2026-150-AWS (10-24): Rò rỉ khóa private intermediate CA của eMudhra/emSign (CVE-2026-111943) do lỗi sinh số ngẫu nhiên yếu trên P-384. Khóa đã bị thu hồi 18/19-10.'
      ja: 2026-150-AWS（10月24日）：P-384 における弱い乱数生成の不具合により、eMudhra/emSign の intermediate CA 秘密鍵が漏えい（CVE-2026-111943）。鍵は 10月18/19日に失効済みです。
    sev: high
    impact:
      vi: Trust stores outbound TLS, CloudFront, ALB (OIDC/JWT), Amazon Linux 2/2023, Corretto JDK, Bottlerocket (≤ 1.67.0), SDK Python (botocore), EMR
      ja: アウトバウンド TLS の trust store、CloudFront、ALB（OIDC/JWT）、Amazon Linux 2/2023、Corretto JDK、Bottlerocket（≤ 1.67.0）、Python SDK（botocore）、EMR
    fix:
      vi: Chạy <code>sudo yum update ca-certificates</code> trên AL2/AL2023; nâng botocore ≥ 1.43.117; cập nhật Corretto JDK. <strong>Đặc biệt:</strong> Thay thế chứng chỉ nếu chuỗi cấp từ emSign trước <strong>28-10-2026</strong>.
      ja: AL2/AL2023 で <code>sudo yum update ca-certificates</code> を実行し、botocore を ≥ 1.43.117 に更新し、Corretto JDK を更新してください。<strong>特に:</strong> 証明書チェーンが emSign 発行の場合は、<strong>2026年10月28日</strong>までに証明書を差し替えてください。
  - name: AWS
    summary:
      vi: '2026-148-AWS (10-23): Lỗ hổng ở Amazon Web Services Multi Model Server (MMS ≤ 1.1.11, CVE-2026-115812 ghi file tùy ý/RCE qua giải nén, CVE-2026-115813 SSRF).'
      ja: 2026-148-AWS（10月23日）：Amazon Web Services Multi Model Server の脆弱性（MMS ≤ 1.1.11、CVE-2026-115812 は展開時の任意ファイル書き込み/RCE、CVE-2026-115813 は SSRF）。
    sev: high
    impact:
      vi: Triển khai MMS ≤ 1.1.11 (sản phẩm đã EOL)
      ja: MMS ≤ 1.1.11 のデプロイ（EOL 製品）
    fix:
      vi: MMS đã hết vòng đời; cần chuyển sang công cụ serving khác. Tạm thời cô lập cổng admin chỉ nghe loopback và hạn chế URL tải model.
      ja: MMS はサポート終了のため、別のサービング基盤への移行が必要です。暫定対応として、管理ポートを loopback のみで待ち受けるよう隔離し、モデルのダウンロード URL を制限してください。
  - name: AWS
    summary:
      vi: '2026-149-AWS (10-23): Bỏ sót kiểm tra đầu vào ở sandbox Python <code>run_script</code> trong AWS MCP Server (CVE-2026-115845).'
      ja: 2026-149-AWS（10月23日）：AWS MCP Server の Python サンドボックス <code>run_script</code> における入力検証の不備（CVE-2026-115845）。
    sev: low
    impact:
      vi: AWS MCP Server
      ja: AWS MCP Server
    fix:
      vi: AWS đã tự khắc phục trên toàn bộ hạ tầng; khách hàng không cần làm gì.
      ja: AWS がインフラ全体で修正済みのため、お客様側での対応は不要です。
  - name: AWS
    summary:
      vi: '2026-143-AWS (10-21): Lỗi PHP RCE (CVE-2026-109618, CVE-2026-109619). Nhánh 5.4 đến 8.1 chưa có bản vá từ upstream.'
      ja: 2026-143-AWS（10月21日）：PHP RCE の脆弱性（CVE-2026-109618、CVE-2026-109619）。5.4 から 8.1 のブランチには upstream のパッチがありません。
    sev: crit
    impact:
      vi: EC2, ECS/EKS, Lambda (custom runtime), Elastic Beanstalk chạy PHP
      ja: PHP を実行する EC2、ECS/EKS、Lambda（custom runtime）、Elastic Beanstalk
    fix:
      vi: Nâng PHP trong image/AMI lên bản mới, tắt upload progress.
      ja: イメージ/AMI 内の PHP を新しいバージョンにアップグレードし、upload progress を無効にしてください。
  - name: AWS
    summary:
      vi: '2026-144, 145-AWS (10-22): Kiểm tra quyền sai ở Athena v3 (CVE-2026-115416); chèn lệnh hệ điều hành ở SAM CLI Terraform hook (CVE-2026-115414). Các bản tin 2026-141, 142 (SageMaker SDK, CI/CD serverless), 2026-146, 147.'
      ja: 2026-144, 145-AWS（10月22日）：Athena v3 の権限チェックの誤り（CVE-2026-115416）、SAM CLI Terraform hook における OS コマンドインジェクション（CVE-2026-115414）。そのほかに 2026-141, 142（SageMaker SDK、サーバーレス CI/CD）、2026-146, 147 のニュース。
    sev: med
    impact:
      vi: Athena, SAM CLI dev/CI, SageMaker SDK, aws-c-mqtt
      ja: Athena、SAM CLI の開発/CI 環境、SageMaker SDK、aws-c-mqtt
    fix:
      vi: Cập nhật SAM CLI, SageMaker Python SDK và các thư viện liên quan.
      ja: SAM CLI、SageMaker Python SDK、および関連ライブラリを更新してください。
  - name: GCP
    summary:
      vi: 'GCP-2026-072 (10-24): Lỗi PHP RCE (CVE-2026-109618, CVE-2026-109619) ảnh hưởng đến Apigee Developer Portal do khách hàng tự triển khai chạy trên nền Drupal.'
      ja: GCP-2026-072（10月24日）：PHP RCE の脆弱性（CVE-2026-109618、CVE-2026-109619）が、お客様が自前でデプロイした Drupal ベースの Apigee Developer Portal に影響します。
    sev: crit
    impact:
      vi: Apigee Developer Portal tự triển khai (Drupal-based)
      ja: 自前でデプロイした Apigee Developer Portal（Drupal ベース）
    fix:
      vi: Cập nhật runtime PHP và Drupal theo khuyến cáo của GCP.
      ja: GCP の推奨に従い、PHP ランタイムと Drupal を更新してください。
  - name: GCP
    summary:
      vi: 'GCP-2026-071 (10-23): Lỗ hổng khóa riêng tư intermediate CA eMudhra (CVE-2026-111943) do weak entropy.'
      ja: GCP-2026-071（10月23日）：weak entropy による eMudhra intermediate CA 秘密鍵の脆弱性（CVE-2026-111943）。
    sev: med
    impact:
      vi: Base OS images của GCP, Google Cloud CLI, các dịch vụ nền tảng
      ja: GCP の Base OS images、Google Cloud CLI、基盤サービス
    fix:
      vi: Cập nhật Google Cloud CLI và cập nhật các gói root CA / hệ điều hành trên VM/GKE.
      ja: Google Cloud CLI を更新し、VM/GKE 上の root CA / OS パッケージを更新してください。
  - name: GCP
    summary:
      vi: 'GCP-2026-070 (10-21): Lỗi PHP RCE. Hạ tầng Google Cloud không bị ảnh hưởng, nhưng workload PHP khách hàng thì có.'
      ja: GCP-2026-070（10月21日）：PHP RCE の脆弱性。Google Cloud のインフラは影響を受けませんが、お客様の PHP ワークロードは影響を受けます。
    sev: crit
    impact:
      vi: App Engine, Cloud Run, GKE, Compute Engine chạy PHP
      ja: PHP を実行する App Engine、Cloud Run、GKE、Compute Engine
    fix:
      vi: Triển khai lại với PHP đã vá.
      ja: パッチ適用済みの PHP で再デプロイしてください。
  - name: GCP
    summary:
      vi: GCP-2026-068 (10-14, sửa phân quyền Application Integration - CVE-2026-85298); GCP-2026-069 (10-19, Istio &amp; Envoy).
      ja: GCP-2026-068（10月14日、Application Integration の権限修正 - CVE-2026-85298）、GCP-2026-069（10月19日、Istio &amp; Envoy）。
    sev: high
    impact:
      vi: Application Integration (đã vá sẵn), Cloud Service Mesh, GKE dùng Istio/Envoy
      ja: Application Integration（パッチ適用済み）、Cloud Service Mesh、Istio/Envoy を使用する GKE
    fix:
      vi: GCP-2026-068 không cần làm gì. Với Istio/Envoy, theo dõi bản tin Cloud Service Mesh.
      ja: GCP-2026-068 は対応不要です。Istio/Envoy については、Cloud Service Mesh のニュースを確認してください。
  - name: Linux kernel
    summary:
      vi: 'CVE-2026-98432 (công bố 15-10): use-after-free ở TCP IPv4 do <code>ireq_opt</code>/<code>inet_opt</code> bị giải phóng không chờ RCU; race giữa SYN retransmit và việc giải phóng socket. CVSS 9.8 (kernel CNA, Ubuntu), 8.1 (Red Hat, sơ bộ), Amazon 7.0 (chưa xác minh vector). Chưa vào CISA KEV, EPSS 0,388% (29-10).'
      ja: 'CVE-2026-98432（10月15日公開）：TCP IPv4 で <code>ireq_opt</code>/<code>inet_opt</code> が RCU を待たずに解放される use-after-free。SYN 再送とソケット解放の race。CVSS は 9.8（カーネル CNA、Ubuntu）、8.1（Red Hat、暫定）、Amazon は 7.0（ベクター未確認）。CISA KEV 未登録、EPSS 0.388%（10月29日）。'
    sev: high
    impact:
      vi: 'Mọi máy Linux có cổng TCP IPv4 đang listen: EC2/GCE, node EKS/GKE, Docker host (chung kernel). Fargate, Cloud Run, dịch vụ managed do nhà cung cấp vá.'
      ja: 'IPv4 の TCP ポートを待ち受ける全 Linux ホスト：EC2/GCE、EKS/GKE ノード、Docker ホスト（カーネル共有）。Fargate、Cloud Run、マネージドサービスはプロバイダーが対応。'
    fix:
      vi: 'Lên kernel đã vá (upstream 5.10.272 / 5.15.223 / 6.1.190 / 6.6.159 / 6.12.113 / 6.18.56 / 7.2.10; Debian bookworm 6.1.190-1, trixie 6.12.113-1; AL2023 kernel6.12 và kernel6.18) rồi reboot. Ubuntu, RHEL, AL2023 kernel mặc định, AL2 chưa có bản vá (30-10). Không có workaround chính thức. Chi tiết: <a href="@home@linux-cve-2026-98432/analysis/">trang phân tích</a>.'
      ja: '修正済みカーネル（upstream 5.10.272 / 5.15.223 / 6.1.190 / 6.6.159 / 6.12.113 / 6.18.56 / 7.2.10、Debian bookworm 6.1.190-1、trixie 6.12.113-1、AL2023 の kernel6.12 と kernel6.18）へ更新して再起動してください。Ubuntu、RHEL、AL2023 標準 kernel、AL2 は 10月30日時点で未修正です。公式な回避策はありません。詳細は<a href="@home@linux-cve-2026-98432/analysis/">分析ページ</a>。'
- title:
    vi: 5. Ghi chú về độ tin cậy
    ja: 5. 情報の信頼性に関する注記
  type: list
  items:
  - vi: <strong>Đã đối chiếu trực tiếp nguồn chính thức:</strong> Node.js, Next.js, advisory Laravel (GitHub Advisories), advisory Nuxt (GitHub Advisories - xác nhận vá tại 4.6.2, Nuxt 3 EOL), Quasar (GitHub Advisories &amp; Releases - xác nhận vá triệt để tại bản 2.35.2 / app-vite 3.10.3), php.net (thông báo cập nhật CVE-2026-115560 ngày 10-23), toàn bộ bản tin AWS (đến 2026-150-AWS ngày 10-24), toàn bộ bản tin Google Cloud (đến GCP-2026-072 ngày 10-24), danh sách CVE Microsoft qua SANS ISC.
    ja: <strong>公式ソースと直接照合済み:</strong> Node.js、Next.js、Laravel のアドバイザリ（GitHub Advisories）、Nuxt のアドバイザリ（GitHub Advisories - 4.6.2 で修正、Nuxt 3 EOL を確認）、Quasar（GitHub Advisories &amp; Releases - 2.35.2 / app-vite 3.10.3 で完全に修正されたことを確認）、php.net（10月23日の CVE-2026-115560 更新告知）、AWS のすべてのニュース（10月24日の 2026-150-AWS まで）、Google Cloud のすべてのニュース（10月24日の GCP-2026-072 まで）、SANS ISC 経由の Microsoft CVE 一覧。
  - vi: <strong>Chỉ qua bài tổng hợp:</strong> Oracle CPU (trang trả về 403, chưa có danh sách đầy đủ từng CVE của Java SE); CVE-2026-48019 (Laravel) và CVE-2026-40976 (Spring Boot).
    ja: <strong>まとめ記事のみ:</strong> Oracle CPU（ページが 403 を返し、Java SE の各 CVE の完全な一覧は未取得）、CVE-2026-48019（Laravel）および CVE-2026-40976（Spring Boot）。
  - vi: <strong>AWS:</strong> Bản tin AWS không phân loại mức độ đồng nhất (hầu hết gắn Important hoặc không ghi), cột mức độ trong bảng là đánh giá phân loại rủi ro kỹ thuật. <strong>.NET:</strong> mức độ theo CVSS và loại lỗi (Microsoft xếp tất cả Important).
    ja: <strong>AWS:</strong> AWS のニュースは重大度の分類が統一されておらず（大半が Important か記載なし）、表の重大度列は技術的なリスク分類に基づく評価です。<strong>.NET:</strong> 重大度は CVSS と脆弱性の種類に基づきます（Microsoft はすべて Important に分類）。
  - vi: <strong>Sự cố eMudhra CA (CVE-2026-111943):</strong> Đã được cả AWS (2026-150-AWS) và GCP (GCP-2026-071) xác nhận; chú ý hạn chót thay thế chứng chỉ trên AWS là 28-10-2026.
    ja: <strong>eMudhra CA インシデント（CVE-2026-111943）:</strong> AWS（2026-150-AWS）と GCP（GCP-2026-071）の両方で確認済みです。AWS での証明書差し替えの期限は 2026年10月28日である点にご注意ください。
  - vi: '<strong>Linux kernel CVE-2026-98432:</strong> điểm CVSS khác nhau giữa các nguồn (9.8 / 8.1 / 7.0); NVD chưa phân tích. Tình trạng bản vá lấy từ trang tracker của Debian, Ubuntu, Amazon Linux, chưa đọc nguyên văn commit upstream. Chưa xác minh được bulletin của Google/GKE. Việc một mô hình nội bộ chưa phát hành của Anthropic tạo được khai thác từ xa (có nhắc MPTCP) mới chỉ qua bản tóm tắt, chưa đọc nguyên văn bài gốc.'
    ja: '<strong>Linux カーネル CVE-2026-98432:</strong> CVSS は情報源により異なります（9.8 / 8.1 / 7.0）。NVD は未分析です。修正状況は Debian、Ubuntu、Amazon Linux のトラッカーによるもので、upstream のコミット原文は未確認です。Google/GKE のセキュリティ情報も未確認です。Anthropic の未公開内部モデルがリモート攻撃コードを作成したという件（MPTCP に言及）は要約のみで、原文は未確認です。'
- title:
    vi: 6. Nguồn tham khảo
    ja: 6. 参考資料
