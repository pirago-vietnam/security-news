# disclosed: 2026-11-18
- id: linux-cve-2026-99312
  category: vulnerability
  month: "2026-11"
  path: "featured/vulnerabilities/linux-cve-2026-99312/analysis/"
  icon: "🐧"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "Linux KVM CVE-2026-99312", ja: "Linux KVM CVE-2026-99312"}
  title: {vi: "Linux Kernel KVM (AMD) CVE-2026-99312 — Page-Table UAF cho phép thoát VM đọc/ghi RAM máy chủ", ja: "Linux Kernel KVM（AMD）CVE-2026-99312 — VM 脱出でホスト RAM を読み書き可能なページテーブル UAF"}
  date: {vi: "Cập nhật đến 2026-11-21 · CVSS 8.8 · Ảnh hưởng AMD KVM bật nested (≥5.15.81) · Đã vá ở 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2", ja: "2026年11月21日 時点 · CVSS 8.8 · nested 有効な AMD KVM（5.15.81以降）が対象 · 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2 で修正済み"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: high
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Không reset ngữ cảnh MMU khi mô phỏng INIT ở trạng thái CR0.PG=0 trên AMD SVM → Page-Table UAF (CWE-825), cho phép guest thoát VM đọc/ghi RAM vật lý của host (đã chứng minh đọc ~127 GB RAM trên DigitalOcean Droplet).", ja: "AMD SVM で CR0.PG=0 のまま INIT エミュレーション時に MMU を初期化せず、ページテーブル UAF（CWE-825）。ゲストからホスト物理 RAM の読み書きに至る恐れ（DigitalOcean Droplet で約127GB読取実証）。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Chỉ ảnh hưởng host KVM dùng CPU AMD và bật nested virtualization (kvm_amd.nested=1), kernel ≥ 5.15.81 (trừ 5.10.y, 5.4.y, Intel VMX). RHEL 9/10, Ubuntu 22.04/24.04, Debian 12/13 chờ bản vá; SUSE SP7/16.x, Debian sid, DigitalOcean đã vá.", ja: "AMD CPU かつ nested 有効（kvm_amd.nested=1）な Linux KVM ホスト（カーネル 5.15.81 以降）のみ対象（Intel VMX・5.10.y は対象外）。RHEL 9/10・Ubuntu・Debian 12/13 は修正待ち、SUSE SP7/16.x・Debian sid・DigitalOcean は対応済み。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Tắt nested virtualization trên host AMD KVM (modprobe -r kvm_amd && modprobe kvm_amd nested=0 và lưu vào /etc/modprobe.d/) nếu không cần chạy VM lồng nhau.", ja: "L2 仮想化が不要なら AMD KVM ホストで nested virtualization を無効化（modprobe -r kvm_amd && modprobe kvm_amd nested=0、/etc/modprobe.d/ へ永続化）。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Cập nhật kernel host lên 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2 (hoặc bản backport từ distro khi có) và reboot. Chưa có PoC công khai hay khai thác thực tế; chưa có trong CISA KEV (2026-11-21).", ja: "ホストカーネルを 6.12.118 / 6.18.64 / 7.3.5 / 7.4-rc2（またはディストリの修正版）へ更新して再起動。公開 PoC や実環境での悪用未確認、CISA KEV 未掲載（2026-11-21 時点）。"}

# disclosed: 2026-11-18
- id: database-rce-narrow-grants
  category: vulnerability
  month: "2026-11"
  path: "featured/vulnerabilities/database-rce-narrow-grants/analysis/"
  icon: "🗄️"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "RCE database (PG/MySQL/Oracle)", ja: "DB の RCE（PG/MySQL/Oracle）"}
  title: {vi: "Lỗ hổng database cho phép chiếm máy chủ chỉ với tài khoản quyền thấp — PostgreSQL, MySQL, Oracle, ClickHouse", ja: "権限の低い DB アカウントだけでサーバー乗っ取りが可能に — PostgreSQL・MySQL・Oracle・ClickHouse の脆弱性"}
  date: {vi: "Cập nhật đến 2026-11-19 · PostgreSQL CVE-2026-116331 · MySQL CVE-2026-101786 · Oracle CVE-2026-114819 + ORDS CVE-2026-91609 · ClickHouse chưa có CVE", ja: "2026年11月19日 時点 · PostgreSQL CVE-2026-116331 · MySQL CVE-2026-101786 · Oracle CVE-2026-114819 ＋ ORDS CVE-2026-91609 · ClickHouse は CVE なし"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Quyền SQL thấp (TEMPORARY, CREATE TEMPORARY TABLES) vẫn chạm tới lỗi bộ nhớ trong engine C/C++ → chạy mã với quyền OS user của DB. Oracle Text CVSS 9.9; Depthfirst cho biết chuỗi qua ORDS lộ ra ngoài chạy được trước khi đăng nhập.", ja: "低い SQL 権限（TEMPORARY、CREATE TEMPORARY TABLES）でも C/C++ エンジンのメモリ破壊に到達し、DB の OS ユーザー権限でコード実行。Oracle Text は CVSS 9.9。Depthfirst は外部公開 ORDS 経由の連鎖でログイン前に実行可能と主張。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "PostgreSQL 14–18 trước 18.7/17.12/16.16/15.20/14.25; MySQL Server/Cluster 26.7.0–26.7.1 (đánh số theo lịch YY.M.P từ 7/2026, không phải 8.x); Oracle DB 19.3–19.32, 21.3–21.24, 23.4.0–23.26.3; ORDS 24.2.0–26.2.1; ClickHouse (thử trên 26.7.5.10).", ja: "18.7/17.12/16.16/15.20/14.25 未満の PostgreSQL 14〜18、MySQL Server/Cluster 26.7.0〜26.7.1（2026年7月からのカレンダー方式 YY.M.P、8.x ではない）、Oracle DB 19.3〜19.32・21.3〜21.24・23.4.0〜23.26.3、ORDS 24.2.0〜26.2.1、ClickHouse（26.7.5.10 で検証）。"}
    - sev: med
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Áp Oracle CSPU 11/2026 + ORDS CPU 10/2026, MySQL bản sau 26.7.1, PostgreSQL bản 12-11; ClickHouse khóa format_binary_max_string_size bằng constraints. Thu hồi TEMPORARY / CREATE TEMPORARY TABLES không cần thiết.", ja: "Oracle 2026年11月 CSPU ＋ ORDS 2026年10月 CPU、MySQL は 26.7.1 より新しい版、PostgreSQL は 11/12 リリースを適用。ClickHouse は constraints で format_binary_max_string_size を固定。不要な TEMPORARY / CREATE TEMPORARY TABLES を剥奪。"}
    - sev: low
      label: {vi: "Lưu ý", ja: "注意"}
      text: {vi: "Chưa ghi nhận khai thác ngoài thực tế, chưa có PoC đầy đủ công khai. Mức quyền theo nhà cung cấp và nhà nghiên cứu khác nhau; ClickHouse chưa có CVE và bản sửa xác nhận.", ja: "実環境での悪用は未確認、完全な PoC は未公開。ベンダーと研究者で必要権限の評価が異なる。ClickHouse は CVE・修正版とも未確認。"}

