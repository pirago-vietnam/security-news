  date: {vi: "Cập nhật 2026-11-19 22:30 ICT (UTC+7) · Đã phát hành · 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36 + 8.6.0 GA", ja: "2026年11月20日 00:30（JST）更新 · 公開済み · 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36 ＋ 8.6.0 GA"}
