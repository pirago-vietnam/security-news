  date: {vi: "Công bố 26/09/2026 · Báo cáo 確報 24/11/2026 · 46 công ty thành viên · Hụt ~1,8 tỷ JPY tại Presso Inn", ja: "2026年9月26日公表 · 11月24日確報 · グループ46社対象 · プレッソイン約18億円減収見込み"}
