      label: {vi: "Phạm vi & Bản vá", ja: "影響範囲・修正状況"}
      text: {vi: "Ruby 2.4.0–4.0.9 (≤3.2 EOL). Vendor & distro lớn đã vá: GitLab (19.6.1/19.5.8/19.4.10), GHES (3.22.6+), Mastodon, OpenProject, Discourse, Chatwoot, Docker Hub, Debian/Ubuntu/RHEL/Alpine/AL2023, Heroku, AWS EB/Lambda (ZIP rollout đến 01/12).", ja: "Ruby 2.4.0〜4.0.9（3.2 以下 EOL）。主要製品・ディストリは修正済み：GitLab (19.6.1/19.5.8/19.4.10)、GHES (3.22.6+)、Mastodon、OpenProject、Discourse、Chatwoot、Docker Hub、Debian/Ubuntu/RHEL/Alpine/AL2023、Heroku、AWS EB/Lambda（ZIP は 12/1 までに展開完了）。"}
    - sev: med
      label: {vi: "Triệt để & WAF", ja: "対策・WAF"}
      text: {vi: "Nâng Ruby lên 3.3.14 / 3.4.13 / 4.0.10, rebuild image & restart (Discourse cần CLI rebuild). Cloudflare (Free & Managed) và CrowdSec đã bật rule WAF chặn tạm thời nhưng không thay thế nâng cấp.", ja: "Ruby を 3.3.14 / 3.4.13 / 4.0.10 へ更新し、イメージ再ビルド・再起動（Discourse は CLI 再ビルド必須）。Cloudflare（Free/Managed）と CrowdSec が暫定 WAF ルールを提供中（更新の代替不可）。"}
    - sev: low
      label: {vi: "Trạng thái PoC", ja: "PoC・悪用状況"}
      text: {vi: "Chưa ghi nhận khai thác thực tế; chưa có trong CISA KEV. PoC crash tối thiểu đã công khai (durendal.sh); PoC RCE trên Rails của Veria Labs dự kiến từ 2026-11-25+ (chưa công bố tính đến sáng 25/11) sau khi GHES đã vá.", ja: "実環境での悪用未確認、CISA KEV 未掲載。最小クラッシュ再現（durendal.sh）は公開済み。GHES 修正完了に伴い Veria Labs の Rails RCE PoC は 2026-11-25 以降公開予定（11/25 朝時点では未公開）。"}

