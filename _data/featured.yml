- id: ruby-ghsa-34m4-m9fh-gqp5
  category: vulnerability
  path: "featured/ruby-ghsa-34m4-m9fh-gqp5/analysis/"
  icon: "💎"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "Ruby ruby2ßhell", ja: "Ruby ruby2ßhell"}
  title: {vi: "Ruby \"ruby2ßhell\" (GHSA-34m4-m9fh-gqp5) — Heap overflow khi upcase ký tự ß, có thể dẫn đến RCE", ja: "Ruby「ruby2ßhell」（GHSA-34m4-m9fh-gqp5）— ß の大文字化でヒープオーバーフロー、RCE の恐れ"}
  date: {vi: "Cập nhật đến 2026-11-19 · Ảnh hưởng Ruby 2.4.0–4.0.9 · Đã vá ở 3.3.14 / 3.4.13 / 4.0.10 · Chưa có CVE", ja: "2026年11月19日 時点 · Ruby 2.4.0〜4.0.9 が対象 · 3.3.14 / 3.4.13 / 4.0.10 で修正済み · CVE 未割り当て"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Tràn heap 1 byte khi upcase/swapcase/casecmp? chuỗi bảng mã 1 byte cũ; Ruby xác nhận có PoC dẫn đến RCE trong một số tình huống. Rails và Sinatra classic bị ảnh hưởng mặc định.", ja: "旧 1 バイト文字コードの upcase/swapcase/casecmp? で 1 バイトのヒープオーバーフロー。Ruby は一部で RCE に至る PoC を確認。Rails と Sinatra classic は既定で影響。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Ruby 2.4.0–3.3.13, 3.4.0–3.4.12, 4.0.0–4.0.9; 3.2 trở xuống đã EOL, không có bản vá. Cả Ruby đóng gói trong GitLab, GHES, Mastodon, Discourse...", ja: "Ruby 2.4.0〜3.3.13、3.4.0〜3.4.12、4.0.0〜4.0.9。3.2 以下は EOL で修正なし。GitLab、GHES、Mastodon、Discourse などの同梱 Ruby も対象。"}
    - sev: med
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng Ruby lên 3.3.14 / 3.4.13 / 4.0.10, rebuild image và restart; không có workaround.", ja: "Ruby を 3.3.14 / 3.4.13 / 4.0.10 へ更新し、イメージ再ビルドと再起動。回避策なし。"}
    - sev: low
      label: {vi: "Lưu ý", ja: "注意"}
      text: {vi: "Veria Labs dự kiến công bố PoC khoảng 1 tuần sau (~26-11); CVE đang chờ cấp. Chưa ghi nhận khai thác ngoài thực tế.", ja: "Veria Labs は約 1 週間後（〜11/26）に PoC 公開予定。CVE は申請中。実環境での悪用は未確認。"}

- id: php-security-release-2026-11-19
  category: vulnerability
  path: "featured/php-security-release-2026-11-19/advisory/"
  icon: "🐘"
  accent: true
  badge: {sev: crit, text: "CRITICAL · ADVANCE NOTICE"}
  nav: {vi: "PHP bản vá 19/11", ja: "PHP 修正版 11/19"}
  title: {vi: "PHP bản vá bảo mật CRITICAL 19-11 (gồm CVE-2026-115560) — Cảnh báo trước & việc cần chuẩn bị", ja: "PHP の CRITICAL 級セキュリティ修正版（CVE-2026-115560 を含む）— 事前警告と準備事項"}
  date: {vi: "Cập nhật 2026-11-19 08:44 ICT (UTC+7) · Dự kiến phát hành 21:00–21:30 ICT · Chưa có số phiên bản / CVE", ja: "2026年11月19日 10:44（JST）更新 · 公開予定 23:00〜23:30（JST） · バージョン・CVE は未公開"}
  link: {vi: "Xem cảnh báo & checklist chuẩn bị →", ja: "事前警告・準備チェックリストを見る →"}
  items:
    - sev: crit
      label: {vi: "Mức độ", ja: "重大度"}
      text: {vi: "PHP.net báo trước: mức cao nhất là CRITICAL, ảnh hưởng mọi nhánh PHP còn được hỗ trợ; lỗi CRITICAL cần cấu hình không mặc định hoặc thiết lập ít gặp.", ja: "PHP.net の予告：最高重大度は CRITICAL、サポート中の全ブランチが対象。CRITICAL は非デフォルト設定または特殊な構成が前提。"}
    - sev: high
      label: {vi: "Thời điểm", ja: "時期"}
      text: {vi: "Thứ Năm 19-11-2026, 14:00–14:30 UTC (21:00–21:30 ICT, UTC+7). Phiên bản vá và CVE sẽ công bố cùng lúc.", ja: "2026年11月19日（木）14:00〜14:30 UTC（日本時間 23:00〜23:30 JST, UTC+9）。修正版・CVE は同時公開予定。"}
    - sev: high
      label: {vi: "CVE-2026-115560", ja: "CVE-2026-115560"}
      text: {vi: "Theo Aikido: liên quan session upload progress, mô tả là vector RCE; cần serialize_handler đổi sang php bằng ini_set() và upload progress bật. Tạm thời: session.upload_progress.enabled=0 ở php.ini/FPM rồi restart.", ja: "Aikido によれば：セッション upload progress 関連で RCE ベクター。ini_set() で serialize_handler を php に切替＋upload progress 有効が条件。暫定：php.ini/FPM で session.upload_progress.enabled=0 にして再起動。"}
    - sev: med
      label: {vi: "Chuẩn bị", ja: "準備"}
      text: {vi: "Kiểm kê PHP (host, container, image), xác định dịch vụ lộ internet, đặt cửa sổ bảo trì vá + restart ngay trong ngày.", ja: "PHP（ホスト・コンテナ・イメージ）の棚卸し、公開面の特定、当日中の更新＋再起動のメンテナンス枠を確保。"}
    - sev: low
      label: {vi: "Lưu ý", ja: "注意"}
      text: {vi: "PHP 8.1 trở xuống đã EOL: dự kiến không có bản vá. Trang sẽ được cập nhật khi có phiên bản và CVE thật.", ja: "サポート終了の PHP 8.1 以下は修正版が出ない見込み。バージョン・CVE 公開後に本ページを更新します。"}

- id: nginx-cve-2026-123007
  category: vulnerability
  path: "featured/nginx-cve-2026-123007/analysis/"
  icon: "🧩"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "nginx CVE-2026-123007", ja: "nginx CVE-2026-123007"}
  title: {vi: "nginx HTTP/2 RCE \"nginx2root\" (CVE-2026-123007) — Lỗi hỏng bộ nhớ trong flow control tồn tại 10 năm", ja: "nginx HTTP/2 RCE「nginx2root」（CVE-2026-123007）— 約10年存在したフロー制御のメモリ破壊"}
  date: {vi: "Cập nhật đến 2026-11-19 · Ảnh hưởng 1.9.5–1.31.8 · Đã vá ở 1.30.7 / 1.31.9", ja: "2026年11月19日 時点 · 1.9.5〜1.31.8 が対象 · 1.30.7 / 1.31.9 で修正済み"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Hỏng bộ nhớ trong HTTP/2 flow control của nginx, có thể dẫn đến RCE không cần xác thực (NetSPI: CVSS v4.0 9.2; nginx.org: \"major\").", ja: "nginx の HTTP/2 フロー制御におけるメモリ破壊で、認証不要の RCE に至る恐れ（NetSPI：CVSS v4.0 9.2、nginx.org：\"major\"）。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "nginx OSS 1.9.5–1.31.8 có bật HTTP/2; NGINX Plus R34–R36, 37.0.0–37.2.0.1. Một số distro/image (Ubuntu, OpenResty) chưa có bản vá lúc đưa tin.", ja: "HTTP/2 を有効にした nginx OSS 1.9.5〜1.31.8、NGINX Plus R34〜R36・37.0.0〜37.2.0.1。報道時点で Ubuntu・OpenResty 等は未修正。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Tắt HTTP/2 (http2 off; hoặc bỏ http2 khỏi listen với nginx <1.25.1) trong lúc chờ nâng cấp.", ja: "更新までの間 HTTP/2 を無効化（http2 off;、1.25.1 未満は listen から http2 を削除）。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng cấp lên nginx 1.30.7 / 1.31.9 (Plus 37.3.0.1 / 37.0.8.1) và restart; reload không thay binary.", ja: "nginx 1.30.7 / 1.31.9（Plus 37.3.0.1 / 37.0.8.1）へ更新して再起動。reload ではバイナリは置換されません。"}

- id: rakuten-sec
  category: incident
  path: "featured/rakuten-sec/rakuten_securities_security_incident_report/"
  icon: "📈"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố Rakuten Securities", ja: "楽天証券 インシデント"}
  title: {vi: "楽天証券 (Rakuten Securities) — Có thể lộ tối đa 11,25 triệu tài khoản từ môi trường test", ja: "楽天証券 — テスト環境から最大1,125万口座の情報流出の恐れ"}
  date: {vi: "Cập nhật 2026-11-18 · Công bố 17/11 · Nguyên nhân đang điều tra", ja: "2026年11月18日更新 · 11/17公表 · 原因調査中"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Quy mô", ja: "規模"}
      text: {vi: "Tối đa ~11,25 triệu tài khoản (mã chi nhánh, mã khách hàng, ID đăng nhập); trong đó tối đa ~4,47 triệu tài khoản lộ thêm họ tên, địa chỉ, SĐT, email, tài khoản rút tiền, thu nhập và tài sản (gồm người đã rút tài khoản).", ja: "最大約1,125万口座（部店・お客様コード、ログインID）。うち最大約447万口座は氏名・住所・電話・メール・出金先口座・年収・金融資産等も対象（退会者含む）。"}
    - sev: high
      label: {vi: "Nguyên nhân", ja: "原因"}
      text: {vi: "Truy cập trái phép của bên thứ ba, phát hiện 16/11; thông tin trong môi trường test có thể bị rò rỉ từ 11/11. Nguyên nhân và đường xâm nhập đang điều tra.", ja: "第三者による不正アクセスを11月16日に検知、テスト環境の情報が11月11日に漏えいしたおそれ。原因・経緯は調査中。"}
    - sev: med
      label: {vi: "Chưa xác nhận lộ", ja: "未確認事項"}
      text: {vi: "Mật khẩu đăng nhập, mã PIN và thông tin giao dịch chưa xác nhận bị lộ; chưa ghi nhận giao dịch trái phép liên quan.", ja: "パスワード・暗証番号など取引に必要な情報の漏えいは未確認。本件起因の不正取引も確認されていません。"}
    - sev: low
      label: {vi: "Ứng phó", ja: "対応"}
      text: {vi: "Đã xác định xong khách hàng bị ảnh hưởng và thông báo riêng; cảnh báo phishing, khuyến nghị passkey, có thể tạm khóa giao dịch/rút tiền.", ja: "対象のお客様の特定は完了、個別に報告。フィッシング注意、パスキー推奨、取引・出金の一時停止設定が可能。"}

- id: muji
  category: incident
  path: "featured/muji/muji_security_incident_report/"
  icon: "🛍️"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố MUJI", ja: "無印良品 インシデント"}
  title: {vi: "無印良品 (MUJI / Ryohin Keikaku) — Rò rỉ tối đa 27,26 triệu tài khoản & 1,09 triệu số thẻ MUJI Card", ja: "無印良品（良品計画）— 最大2,726万件の会員情報 & MUJI Card 約109万件流出の恐れ"}
  date: {vi: "Trạng thái đến 2026-11-16 · Net Store vẫn ngừng · Chưa có lịch mở lại", ja: "2026年11月16日時点 · ネットストア停止継続 · 再開時期未定"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Quy mô", ja: "規模"}
      text: {vi: "Tối đa ~27,26 triệu tài khoản (gồm người đã hủy), ~750.000 họ tên/địa chỉ/SĐT, ~1,09 triệu số thẻ MUJI Card 16 chữ số (~345.000 thẻ còn hiệu lực) và ~440.000 người nhận COD.", ja: "最大約2,726万件（退会者含む）、氏名・住所等約75万件、MUJI Card 16桁全桁約109万件（有効約34.5万件）、代引き受取先約44万件に影響の恐れ。"}
    - sev: high
      label: {vi: "Nguyên nhân", ja: "原因"}
      text: {vi: "Lỗ hổng hệ thống + để tồn đọng 16 số thẻ không che suốt 5 năm từ 07/2021 và không xóa tài khoản đã hủy; kết hợp credential stuffing (~270.000 tài khoản).", ja: "システム脆弱性に加え、2021年7月以降5年間マスクなし放置されたカード番号・退会者の削除漏れ。ネットストアでのリスト型攻撃（約27万件）も判明。"}
    - sev: med
      label: {vi: "Tài chính & Quản lý", ja: "金融・監督官庁"}
      text: {vi: "Credit Saison siết chặt giám sát gian lận dải BIN và miễn phí đổi thẻ; PPC yêu cầu nộp báo cáo giải trình chính thức (確報); METI điều tra tuân thủ Credit Card Security Guidelines.", ja: "クレディセゾンがBIN監視強化と無料再発行対応。PPCが正式確報を要求、経産省がセキュリティガイドライン違反を調査。"}
    - sev: low
      label: {vi: "Ứng phó & Bồi thường", ja: "対応・補償"}
      text: {vi: "Đến 16/11, Net Store vẫn ngừng và MUJI App chỉ giữ mã vạch thành viên; Credit Saison hỗ trợ đổi thẻ miễn phí.", ja: "11月16日時点でネットストアは停止中、MUJIアプリは会員証バーコード表示以外を停止。クレディセゾンはカードを無料再発行。"}

- id: java-cve-2026-114938
  category: vulnerability
  path: "featured/java-cve-2026-114938/analysis/"
  icon: "☕"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "Java4Shell CVE-2026-114938", ja: "Java4Shell CVE-2026-114938"}
  title: {vi: "Java4Shell (CVE-2026-114938) — Tràn heap ở Base64 decoder của Java 17+ (x86-64 AVX-512), nguy cơ RCE", ja: "Java4Shell（CVE-2026-114938）— Java 17+ Base64 デコーダーのヒープ破壊（x86-64 AVX-512）、RCE の恐れ"}
  date: {vi: "Cập nhật 2026-11-18 · CVSS 8.1 · Bản vá 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1 · Chưa thấy khai thác thực tế", ja: "2026年11月18日更新 · CVSS 8.1 · 17.0.21.1 / 21.0.13.1 / 25.0.5.1 / 27.0.1.1 で修正 · 実環境での悪用は未確認"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: high
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Ghi lạm heap trong intrinsic AVX-512 của java.util.Base64; Calif trình diễn RCE trên Keycloak, Jira, Confluence, Jenkins... Wiz tạo PoC trong ~2 giờ.", ja: "java.util.Base64 の AVX-512 イントリンシックでヒープ範囲外書き込み。Calif が Keycloak、Jira、Confluence、Jenkins 等で RCE を実証、Wiz は約2時間で PoC 作成と報道。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Java 17.0.6+, 21, 25, 27 trên CPU x86-64 có AVX-512 VBMI. ARM64, Java 8/11 chuẩn không bị.", ja: "AVX-512 VBMI 対応 x86-64 上の Java 17.0.6+、21、25、27。ARM64 と標準 Java 8/11 は対象外。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Không chính thức: -XX:-UseBASE64Intrinsics hoặc -XX:UseAVX=2 (x86-64) rồi restart JVM; Oracle chưa công bố workaround.", ja: "非公式：-XX:-UseBASE64Intrinsics または -XX:UseAVX=2（x86-64のみ）と JVM 再起動。Oracle は回避策未公表。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng JDK (Corretto 17.0.21.1.2), restart toàn bộ tiến trình Java, rebuild image. Temurin/distro chưa xác nhận bản vá.", ja: "JDK 更新（Corretto 17.0.21.1.2）、全 Java プロセス再起動、イメージ再ビルド。Temurin/ディストリビューションは修正未確認。"}

- id: postgresql-cve-2026-6460
  category: vulnerability
  path: "featured/postgresql-cve-2026-6460/analysis/"
  icon: "🐘"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "PostgreSQL 52 CVEs", ja: "PostgreSQL 52件のCVE"}
  title: {vi: "PostgreSQL vá 52 CVEs (CVSS 8.8) — RCE qua Type Confusion DDL (CVE-2026-6460) & PostgreSQL 14 EOL", ja: "PostgreSQL 52件のCVE修正（CVSS 8.8）— 型混乱 DDL RCE（CVE-2026-6460）および PostgreSQL 14 EOL"}
  date: {vi: "Cập nhật đến 2026-11-13 · 52 CVEs · Bản vá 18.7/17.12/16.16/15.20/14.25 · PostgreSQL 14 chính thức EOL", ja: "2026年11月13日 時点 · 52件のCVE · 18.7/17.12/16.16/15.20/14.25 リリース · PostgreSQL 14 公式 EOL"}
  link: {vi: "Xem phân tích & hướng dẫn REINDEX/Backup →", ja: "分析・REINDEX/バックアップ対策ガイドを見る →"}
  items:
    - sev: high
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "52 CVEs với 32 lỗi CVSS 8.8; tiêu biểu là CVE-2026-6460 Type Confusion qua lệnh DDL (ALTER COLUMN SET DATA TYPE) dẫn tới RCE quyền postgres.", ja: "52件中32件がCVSS 8.8。代表例 CVE-2026-6460 では DDL操作（ALTER COLUMN SET DATA TYPE）時の型混乱により postgres 権限でのRCEに至る恐れ。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Mọi phiên bản PostgreSQL trước 18.7, 17.12, 16.16, 15.20, 14.25. Client tools pg_dump, reindexdb cũng bị lỗi tiêm mã SQL/command injection.", ja: "18.7、17.12、16.16、15.20、14.25 未満の全バージョン。クライアントツール（pg_dump、reindexdb）の SQLi / コマンド注入も含む。"}
    - sev: med
      label: {vi: "Bảo trì", ja: "保守作業"}
      text: {vi: "Bắt buộc REINDEX các chỉ mục GIN, GiST (pg_trgm) và bpchar bị nghi ngờ lỗi; chụp ngay bản Full Backup mới nếu đang dùng incremental backup.", ja: "破損が疑われる GIN、GiST（pg_trgm）、bpchar インデックスの REINDEX が必須。増分バックアップ運用時は直ちに新規フルバックアップを取得。"}
    - sev: low
      label: {vi: "PG14 EOL", ja: "PG14 EOL"}
      text: {vi: "PostgreSQL 14 chính thức hết hạn hỗ trợ (EOL) từ 12-11-2026 (bản 14.25 là cuối cùng); cần khẩn trương lập lộ trình nâng cấp lên PostgreSQL 15–18.", ja: "PostgreSQL 14 は 2026年11月12日をもって公式サポート終了（14.25 が最終版）。PostgreSQL 15〜18 への移行計画を至急策定。"}

- id: apache-cve-2026-119618
  category: vulnerability
  path: "featured/apache-cve-2026-119618/analysis/"
  icon: "🌐"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "Apache CVE-2026-119618", ja: "Apache CVE-2026-119618"}
  title: {vi: "Apache HTTP Server mod_http2 RCE (CVE-2026-119618) — Lỗi đồng bộ HTTP/2 gây chiếm quyền máy chủ", ja: "Apache HTTP Server mod_http2 RCE（CVE-2026-119618）— HTTP/2 同期不備によるサーバー乗っ取りの恐れ"}
  date: {vi: "Cập nhật đến 2026-11-12 · Race Condition trong assign_headers() · Đã vá ở 2.4.71", ja: "2026年11月12日 時点 · assign_headers() の競合状態 · 2.4.71 で修正済み"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Lỗi đồng bộ (CWE-362) trong mod_http2 assign_headers() gây heap corruption và có thể dẫn đến RCE không cần xác thực.", ja: "mod_http2 の assign_headers() における同期不備（CWE-362）によりヒープ破壊および認証不要の RCE に至る恐れ。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Apache HTTP Server 2.4.55 đến 2.4.70 (và mod_h2 2.0.8–2.0.42) có bật mod_http2 / giao thức h2 hoặc h2c.", ja: "mod_http2（h2 / h2c）を有効にしている Apache HTTP Server 2.4.55〜2.4.70（および mod_h2 2.0.8〜2.0.42）。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Vô hiệu hóa mod_http2 (a2dismod http2 / bỏ LoadModule http2_module) hoặc đặt Protocols http/1.1 nếu chưa thể nâng cấp ngay.", ja: "即時更新が困難な場合は mod_http2 を無効化（a2dismod http2 等）、または Protocols http/1.1 を設定。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng cấp Apache HTTP Server lên 2.4.71 trở lên (phát hành 11-11-2026), kiểm tra cấu hình và restart dịch vụ / rebuild image.", ja: "Apache HTTP Server を 2.4.71 以上（11月11日リリース）へ更新し、サービス再起動・コンテナ再ビルドを実施。"}

- id: brotli-cve-2026-111497
  category: vulnerability
  path: "featured/brotli-cve-2026-111497/analysis/"
  icon: "📦"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "Brotli CVE-2026-111497", ja: "Brotli CVE-2026-111497"}
  title: {vi: "Brotli CVE-2026-111497 — Lỗi bộ nhớ khi giải nén dữ liệu không đáng tin cậy", ja: "Brotli CVE-2026-111497 — 信頼できないデータ展開時のメモリ破壊"}
  date: {vi: "Cập nhật 2026-11-16 · Brotli decoder · Bản vá phụ thuộc sản phẩm", ja: "2026年11月16日 時点 · Brotli デコーダー · 製品別に修正を確認"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: high
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Dữ liệu Brotli độc hại được giải nén có thể gây hỏng bộ nhớ, gián đoạn dịch vụ, rò rỉ dữ liệu hoặc có khả năng thực thi mã.", ja: "細工された Brotli データの展開により、メモリ破壊、サービス停止、情報漏えいやコード実行の恐れ。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Rà soát Brotli hệ thống và bản nhúng trong runtime, ứng dụng, trình duyệt và container; nguy cơ phụ thuộc đường giải nén dữ liệu không đáng tin cậy.", ja: "システムおよびランタイム・アプリ・ブラウザー・コンテナーに同梱された Brotli を確認。リスクは信頼できない入力の展開経路に依存。"}
    - sev: med
      label: {vi: "Xử lý", ja: "対応"}
      text: {vi: "Áp dụng bản vá hoặc backport theo nhà cung cấp, rebuild image và khởi động lại; hạn chế giải nén dữ liệu không đáng tin cậy trong lúc chờ vá.", ja: "ベンダーの修正またはバックポートを適用し、イメージ再ビルドと再起動を実施。修正まで信頼できないデータの展開を制限。"}

- id: binance
  category: incident
  archived: true
  path: "featured/binance/binance_security_incident_report/"
  icon: "💸"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố Binance", ja: "Binance インシデント"}
  title: {vi: "Binance (~6,3 tỷ USD) — Rò rỉ từ laptop DevOps vào container dịch vụ", ja: "Binance（約63億米ドル流出）— DevOps 端末侵害からサービスコンテナへ到達"}
  date: {vi: "Cập nhật đến 2026-10-30 · Đang diễn biến · Vụ hack tiền mã hóa lớn nhất lịch sử (theo báo chí)", ja: "2026年10月30日 時点 · 進行中 · 報道によると暗号資産史上最大の被害"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Quy mô", ja: "規模"}
      text: {vi: "Binance ước tính khoảng 6,3 tỷ USD tài sản bị ảnh hưởng; đã dự phòng hơn 6,34 tỷ USD và cam kết bù đắp toàn bộ thiệt hại của người dùng.", ja: "Binance は約63億米ドルの資産が影響を受けたと推計。63.4億米ドル超を確保し、ユーザーの損失を全額補償すると表明。"}
    - sev: high
      label: {vi: "Nguyên nhân", ja: "原因"}
      text: {vi: "Sơ bộ: laptop của kỹ sư DevOps bị xâm nhập, dẫn tới container dịch vụ; sau đó phát hiện thêm điểm xâm nhập khác. Chưa có bằng chứng lộ private key ví.", ja: "暫定: DevOps エンジニアのノート PC が侵害されサービスコンテナへ到達。その後、別の侵入経路も判明。ウォレット秘密鍵の漏えいの証拠は未確認。"}
    - sev: med
      label: {vi: "Quy kết", ja: "攻撃者"}
      text: {vi: "TRM Labs quy cho nhóm TraderTraitor (Triều Tiên); Binance chưa xác nhận.", ja: "TRM Labs は北朝鮮の TraderTraitor によるものと分析。Binance は未確認。"}
    - sev: low
      label: {vi: "Ứng phó", ja: "対応"}
      text: {vi: "Đã đóng băng khoảng 3 tỷ USD (số liệu nguồn khác nhau), tạm dừng rút tiền để rà soát an ninh; sẽ công bố báo cáo đầy đủ sau.", ja: "約30億米ドルを凍結（情報源により数値が異なる）。出金を停止しセキュリティを見直し中。詳細レポートは後日公表予定。"}

- id: gmo
  category: incident
  archived: true
  path: "featured/gmo/gmo_onamae_security_incident_report/"
  icon: "🚨"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố GMO Onamae", ja: "GMOお名前.com インシデント"}
  title: {vi: "GMO Onamae Desktop Cloud — Chiếm quyền 26.739 VPS Windows, rò rỉ MT4/MT5", ja: "GMO お名前.com デスクトップクラウド — Windows VPS 26,739台乗っ取り・MT4/MT5情報漏えい"}
  date: {vi: "Cập nhật 2026-11-18 · Công bố KQKD 13/11 · 1.041 tin Bounty đến 17/11", ja: "2026年11月18日更新 · 11/13決算説明 · 情報提供1,041件（11/17時点）"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Hạ tầng", ja: "インフラ"}
      text: {vi: "Chiếm quyền 26.739 máy chủ VPS Windows, rò rỉ thông tin đăng nhập MT4/MT5 tác động hơn 70 sàn chứng khoán & FX.", ja: "Windows VPSサーバー26,739台が乗っ取られ、MT4/MT5のログイン情報が漏えい。70以上の証券・FX会社に影響。"}
    - sev: high
      label: {vi: "Tống tiền", ja: "恐喝"}
      text: {vi: "GMO từ chối yêu cầu 50 triệu USD và lập Quỹ Bounty tối đa 1 triệu USD; ghi nhận 1.041 tin báo đến 18:00 ngày 17/11, chưa đồng nghĩa với manh mối được xác minh.", ja: "GMOは5,000万米ドルの要求を拒否し、最大100万米ドルの懸賞金基金を設立。11月17日18時時点で情報提供は1,041件（有力情報の確定件数ではない）。"}
    - sev: med
      label: {vi: "Điều tra & Phòng thủ", ja: "捜査・防御"}
      text: {vi: "Takedown tên miền rò rỉ sau 15,5 giờ; ngày 06/11 Tổng cục trưởng Cảnh sát Quốc gia Nhật Bản (NPA) chỉ thị lập Tổ điều tra liên ngành tại Sở Cảnh sát Tokyo.", ja: "流出ドメインを15.5時間でテイクダウン。11月6日、警察庁長官が警察法第61条の3に基づき警視庁への合同捜査本部設置を指示。"}
    - sev: low
      label: {vi: "Bồi thường", ja: "補償"}
      text: {vi: "Đến 12/11, 2.943 tài khoản yêu cầu bồi thường khoảng 2,998 tỷ JPY; chi phí trực tiếp dự kiến 3,05 tỷ JPY, chưa phải số tiền chi trả đã xác nhận.", ja: "11月12日時点の損失補償申請は2,943口座・約29.98億円。直接費用は約30.5億円を見込むが、確定した支払額ではない。"}

- id: php2shell
  category: vulnerability
  archived: true
  path: "featured/php-cve-2026-109618-109619/php2shell/"
  icon: "📘"
  accent: false
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "PHP CVE-2026-109618", ja: "PHP CVE-2026-109618"}
  title: {vi: "PHP2Shell (CVE-2026-109618 / 109619) — RCE không cần xác thực trong lõi PHP", ja: "PHP2Shell（CVE-2026-109618 / 109619）— PHP コアの認証不要 RCE"}
  date: {vi: "Lỗ hổng RCE PHP · Tổng quan cho non-tech & hướng dẫn xử lý cho kỹ sư PiraGo", ja: "PHP の RCE 脆弱性 · 非エンジニア向け概要 & PiraGo エンジニア向け対応ガイド"}
  link: {vi: "Xem hướng dẫn đầy đủ →", ja: "ガイド全文を見る →"}
  items:
    - sev: crit
      label: {vi: "Xử lý", ja: "対応"}
      text: {vi: "RCE không cần xác thực trong lõi PHP (CVSS 9.2). Cập nhật ứng dụng không giúp được; phải vá PHP và restart.", ja: "PHP コアの認証不要 RCE（CVSS 9.2）。アプリ更新では解決せず、PHP の更新と再起動が必要。"}
    - sev: high
      label: {vi: "Dễ bị tấn công", ja: "狙われやすい対象"}
      text: {vi: "Apache mod_php, PHP-FPM lộ internet, PHP 8.1 trở xuống (EOL), image Docker cũ, hosting managed.", ja: "Apache mod_php、公開 PHP-FPM、PHP 8.1 以下（EOL）、古い Docker イメージ、マネージドホスティング。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Tắt upload progress, đặt memory_limit bằng php_admin_value, hạn chế multipart ở WAF/LB, thu hẹp truy cập.", ja: "upload progress の無効化、php_admin_value での memory_limit 設定、WAF/LB での multipart 制限、アクセス範囲の縮小。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35, restart, build lại image; lên kế hoạch rời PHP 8.1 trở xuống.", ja: "8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 へ更新して再起動、イメージ再ビルド。PHP 8.1 以下からの移行を計画。"}

- id: linux-cve-2026-98432
  category: vulnerability
  archived: true
  path: "featured/linux-cve-2026-98432/analysis/"
  icon: "🐧"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "Linux kernel CVE-2026-98432", ja: "Linux カーネル CVE-2026-98432"}
  title: {vi: "Linux kernel TCP IPv4 UAF (CVE-2026-98432) — Nguy cơ RCE/rò rỉ qua MPTCP", ja: "Linux カーネル TCP IPv4 UAF（CVE-2026-98432）— MPTCP 経由の RCE・情報漏えいリスク"}
  date: {vi: "Cập nhật đến 2026-11-05 · Bản tin AWS 2026-160-AWS xác nhận nguy cơ MPTCP · CVSS 9.8", ja: "2026年11月5日 時点 · AWS速報 2026-160-AWS で MPTCP リスク公式確認 · CVSS 9.8"}
  link: {vi: "Xem phân tích chi tiết →", ja: "詳細分析を見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Bản tin AWS 2026-160-AWS xác nhận bắt tay MPTCP nhận gói IPv4 TCP chứa IP options có thể dẫn tới rò rỉ dữ liệu hoặc thực thi mã. Chưa thấy khai thác thực tế diện rộng; một số repo GitHub tự nhận PoC chưa kiểm chứng.", ja: "AWS速報 2026-160-AWS により、IPオプション付きIPv4 TCPパケットによるMPTCPハンドシェイクで潜在的なコード実行やデータ漏えいが発生し得ることが公式確認。実際の悪用は未確認。"}
    - sev: high
      label: {vi: "Dễ bị tấn công", ja: "狙われやすい対象"}
      text: {vi: "Máy mở cổng TCP internet trực tiếp, dịch vụ bật MPTCP (Go 1.24+ bật mặc định trên Linux), host sau NLB TCP pass-through, node Kubernetes chưa vá, máy Ubuntu (chưa có USN, gói vá vẫn ở -proposed ngày 5/11).", ja: "TCPポート直接公開ホスト、MPTCP有効環境（Go 1.24+ でLinux上デフォルト有効）、NLB TCPパススルー配下、未修正Kubernetesノード、Ubuntu（11月5日時点でもUSN未公開、-proposed継続）。"}
    - sev: med
      label: {vi: "Hạ tầng Cloud & Edge", ja: "クラウド & エッジ"}
      text: {vi: "Hạ tầng AWS & Cloudflare: Edge/Ingress (ALB, CloudFront, Cloudflare Proxy/Tunnel) kết thúc TCP ở biên, che chắn backend (cần khóa Security Group về IP Cloudflare); Global Accelerator drop gói IP options ở data plane; DBs (RDS, Aurora) đã vá tầng host. AL2/AL2023 đã có bản vá, Ubuntu vẫn ở -proposed.", ja: "AWS & Cloudflare インフラ: Edge/Ingress（ALB、CloudFront、Cloudflare Proxy/Tunnel）はエッジでTCP終端しバックエンドを保護（Security Group制限必須）。Global Acceleratorはデータプレーンで破棄、マネージドDBはホスト層パッチ適用済み。AL2/AL2023修正済み、Ubuntuは -proposed。"}
    - sev: low
      label: {vi: "Xử lý", ja: "対処"}
      text: {vi: "Cập nhật kernel và reboot. Tạm thời: tắt MPTCP (net.mptcp.enabled=0, GODEBUG=multipathtcp=0 cho Go), lọc IP options bằng nftables/iptables u32 hoặc AWS Network Firewall.", ja: "カーネル更新と再起動が恒久対策。暫定措置: MPTCP無効化（net.mptcp.enabled=0、Go向けGODEBUG=multipathtcp=0）、nftables/iptables u32またはAWS Network FirewallによるIPオプション遮断。"}
