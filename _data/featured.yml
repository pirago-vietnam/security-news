  date: {vi: "Cập nhật đến 2026-11-25 · CVSS 9.8 (RH) / 8.1 (AL) / 7.4 (MITRE) · Đã vá Ruby 3.3.14 / 3.4.13 / 4.0.10 · GitLab/GHES/distro đã vá", ja: "2026年11月25日 時点 · CVSS 9.8 (RH) / 8.1 (AL) / 7.4 (MITRE) · Ruby 3.3.14 / 3.4.13 / 4.0.10・GitLab/GHES/各ディストリ修正済み"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Tràn heap 1 byte (CWE-193) trên 14 bảng mã 1 byte cũ (ISO-8859 / Windows-125x); Rails và Sinatra classic bị ảnh hưởng mặc định qua Rack MethodOverride; Ruby xác nhận có PoC RCE riêng tư.", ja: "14 種の旧 1 バイト文字コード（ISO-8859 / Windows-125x）で 1 バイトのヒープ溢れ（CWE-193）。Rails と Sinatra classic は Rack MethodOverride 経由で既定影響、Ruby 側は非公開 RCE PoC を確認。"}
