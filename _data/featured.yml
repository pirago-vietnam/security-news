# disclosed: 2026-11-20
- id: japan-data-breaches-2026-11
  category: incident
  month: "2026-11"
  path: "featured/incidents/japan-data-breaches-2026-11/incident_report/"
  icon: "🗂️"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Rò rỉ Tower / Peach / Payどん", ja: "タワレコ・ピーチ・Payどん 流出"}
  title: {vi: "Làn sóng rò rỉ dữ liệu tại Nhật — Tower Records (~11 triệu), Peach Aviation qua Ymirlink (~9 triệu) & Infcurion Wallet Station / Payどん (~251 nghìn)", ja: "国内相次ぐ情報流出 — タワーレコード（約1,100万件）、ピーチ（ユミルリンク経由 約900万件）、インフキュリオン Wallet Station / Payどん（約25万件）"}
  date: {vi: "Công bố 20–21/11/2026 · Cập nhật đến 2026-11-25 · Payどん mở lại chiều 26/11 · Tower online vẫn đóng", ja: "2026年11月20〜21日公表 · 11月25日時点 · Payどん 11/26午後再開 · タワー通販は停止継続"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Quy mô", ja: "規模"}
      text: {vi: "Tower Records Online (21/11): tối đa ~11 triệu bản ghi (10,21M đăng nhập gồm hash mật khẩu, 2,78M hồ sơ thành viên, ~777K địa chỉ/SĐT giao hàng; không gồm thẻ tín dụng). Peach Aviation (20/11): 8.997.106 bản ghi (họ tên, ngày sinh, địa chỉ, SĐT, email, lịch trình bay).", ja: "タワーレコード オンライン（11/21）：最大約1,100万件（ログイン情報1,021万・会員情報278万・配送先約77.7万、カード情報なし）。ピーチ（11/20）：8,997,106件（氏名・生年月日・住所・電話・メール・旅程）。"}
    - sev: high
      label: {vi: "Nguyên nhân", ja: "原因"}
      text: {vi: "Peach: lộ qua nhà cung cấp email Ymirlink Cuenote FC (lỗ hổng chương trình, đánh cắp thông tin đăng nhập nhân viên/session, không phải ransomware; tổng ảnh hưởng Cuenote FC ~47,9 triệu bản ghi). Tower và Infcurion: truy cập trái phép, vector chưa công bố.", ja: "ピーチ：メール配信事業者ユミルリンク Cuenote FC 経由（プログラム脆弱性、担当者認証情報・セッション窃取、ランサムウェアではない。Cuenote FC 全体で約4,786万件）。タワー、インフキュリオン：不正アクセス、侵入経路は未公表。"}
    - sev: crit
      label: {vi: "Infcurion / Payどん", ja: "インフキュリオン / Payどん"}
      text: {vi: "Nguy cơ lộ 251.172 bản ghi (mật khẩu đã chuyển sang chuỗi khó khôi phục); ngừng từ 20/11 06:20 và mở lại từ chiều 26/11 (bắt buộc reset mật khẩu &amp; tài khoản ngân hàng). FamiPay, AEON Pay, Kumamon!Pay đã mở lại không rò rỉ.", ja: "251,172件が流出の恐れ（パスワードは復元困難な文字列に変換済み）。Payどんは11/20 6:20停止後、11/26午後より順次再開（初回PW・口座再設定必須）。ファミペイ・AEON Pay 等は流出なしを確認し再開。"}
    - sev: low
      label: {vi: "Khuyến cáo", ja: "対策"}
      text: {vi: "Cảnh giác email/SMS/cuộc gọi mạo danh, không nhập mật khẩu/mã xác thực; đổi mật khẩu dùng chung; rà soát vendor email/thanh toán và tối thiểu hóa dữ liệu gửi cho bên thứ ba.", ja: "なりすましメール・SMS・電話に注意し、パスワード・認証コードを入力しない。使い回しパスワードを変更。メール配信・決済委託先を棚卸しし、外部連携データを最小化。"}

# disclosed: 2026-11-20
- id: linux-cve-2026-99676
  category: vulnerability
  month: "2026-11"
  path: "featured/vulnerabilities/linux-cve-2026-99676/analysis/"
  icon: "🐧"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: 'Linux Net CVE-2026-99676', ja: 'Linux Net CVE-2026-99676'}
  title: {vi: 'Linux Kernel Net CVE-2026-99676 — Use-After-Free trong lockless socket lookup trên ARM64/POWER (CVSS 9.8 / 5.9)', ja: 'Linux Kernel Net CVE-2026-99676 — ARM64/POWER 環境のロックレスソケット検索における Use-After-Free（CVSS 9.8 / 5.9）'}
  date: {vi: 'Cập nhật đến 2026-11-25 · CVSS 9.8 (CNA) / 5.9 (RH/AWS) · Ảnh hưởng Linux ≥ 5.5 / 5.4.208+ (ARM64/POWER) · Đã vá ở 6.12.118+ / 6.18.64+ / 7.3.5+ / 7.4-rc2', ja: '2026年11月25日 時点 · CVSS 9.8 (CNA) / 5.9 (RH/AWS) · Linux 5.5 以降 / 5.4.208+（ARM64/POWER）が対象 · 6.12.118+ / 6.18.64+ / 7.3.5+ / 7.4-rc2 で修正済み'}
  link: {vi: 'Xem phân tích & hướng dẫn →', ja: '分析・対策ガイドを見る →'}
  items:
    - sev: crit
      label: {vi: 'Nguy cơ', ja: 'リスク'}
      text: {vi: 'Lỗi thứ tự ghi bộ nhớ refcount (weak memory ordering) trong lockless socket lookup (<code>refcount_inc_not_zero</code>) trên kiến trúc ARM64/Graviton, POWER, RISC-V: CPU có thể đọc nhầm dữ liệu socket trước khi giữ refcount → Use-After-Free (<code>dst_entry</code>) hoặc kernel oops/DoS. Là bản vá đi kèm bắt buộc của NoisyTCP (<code>CVE-2026-99288</code>).', ja: 'ARM64/Graviton・POWER・RISC-V 環境のロックレスソケット検索（<code>refcount_inc_not_zero</code>）におけるメモリ順序欠如。refcount 確定前にソケット情報を先読みし、<code>dst_entry</code> UAF やカーネル oops/DoS を招く恐れ。NoisyTCP（<code>CVE-2026-99288</code>）の必須追加パッチ。'}
    - sev: high
      label: {vi: 'Phạm vi', ja: '影響範囲'}
      text: {vi: 'Máy chủ Linux ARM64/Graviton, POWER, RISC-V với kernel ≥ 5.5 hoặc ≥ 5.4.208 mở cổng TCP. Debian 13 (<code>DSA-6652-1</code>) &amp; <code>sid/forky</code> đã vá; các nhánh LTS cũ (<code>6.6 / 6.1 / 5.15 / 5.10</code>) lỗi auto-backport chưa có fix (<code>5.4.y</code> đã EOL); Ubuntu, AL2023/AL2, RHEL 9–10 và SUSE đang chờ vá.', ja: 'ARM64/Graviton・POWER・RISC-V 上の Linux 5.5+ / 5.4.208+（TCP 受付）が対象。Debian 13（<code>DSA-6652-1</code>）・<code>sid/forky</code> は修正済み。旧 LTS（<code>6.6 / 6.1 / 5.15 / 5.10</code>）はバックポート失敗で未修正（<code>5.4.y</code> は EOL）、Ubuntu・AL2023/AL2・RHEL 9–10・SUSE は修正待ち。'}
    - sev: med
      label: {vi: 'Lưu ý đánh giá', ja: '評価上の注意'}
      text: {vi: 'Linux CNA chấm CVSS 9.8 (Critical), trong khi Red Hat, Amazon Linux và SUSE chấm 5.9 (Medium/Moderate) do đòi hỏi race timing chặt trên nhiều CPU; không có <code>sysctl</code> tắt lỗi ngoài siết cổng TCP.', ja: 'Linux CNA は CVSS 9.8（Critical）、Red Hat・Amazon Linux・SUSE は厳密な競合タイミングを要するため 5.9（Medium/Moderate）と評価。<code>sysctl</code> 回避策はなく公開 TCP 制限で緩和。'}
    - sev: low
      label: {vi: 'Triệt để', ja: '恒久対策'}
      text: {vi: 'Cập nhật kernel ARM64/POWER lên bản đã vá (<code>6.12.118+ / 6.18.64+ / 7.3.5+ / 7.4-rc2</code> hoặc Debian <code>DSA-6652-1</code>) và reboot. Chưa ghi nhận khai thác, chưa có PoC công khai và chưa có trong CISA KEV (2026-11-25).', ja: 'ARM64/POWER サーバを修正済みカーネル（<code>6.12.118+ / 6.18.64+ / 7.3.5+ / 7.4-rc2</code> または Debian <code>DSA-6652-1</code>）へ更新し再起動。悪用報告・公開 PoC なし、CISA KEV 未掲載（2026-11-25 確認）。'}

# disclosed: 2026-11-19
- id: linux-cve-2026-99362
  category: vulnerability
  month: "2026-11"
  path: "featured/vulnerabilities/linux-cve-2026-99362/analysis/"
  icon: "🐧"
  accent: true
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: 'Linux NFSD CVE-2026-99362', ja: 'Linux NFSD CVE-2026-99362'}
  title: {vi: 'Linux Kernel NFSD CVE-2026-99362 — Tràn bộ đệm slab-out-of-bounds trong NFSv4.1+ SEQUENCE (CVSS 9.8)', ja: 'Linux Kernel NFSD CVE-2026-99362 — NFSv4.1+ SEQUENCE における slab-out-of-bounds（CVSS 9.8）'}
  date: {vi: 'Cập nhật đến 2026-11-23 · CVSS 9.8 · Ảnh hưởng Linux ≥ 3.16 (nfsd NFSv4.1+) · Đã vá ở 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1', ja: '2026年11月23日 時点 · CVSS 9.8 · Linux 3.16以降（nfsd NFSv4.1+）が対象 · 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 で修正済み'}
  link: {vi: 'Xem phân tích & hướng dẫn →', ja: '分析・対策ガイドを見る →'}
  items:
    - sev: crit
      label: {vi: 'Nguy cơ', ja: 'リスク'}
      text: {vi: 'nfsd4_sequence() thu hẹp buffer trả về xuống ngưỡng tối thiểu (slot sl_data[] độ dài 0) nhưng vẫn ghi dữ liệu phản hồi COMPOUND vào cache slot → ghi tràn slab-out-of-bounds ở nhân Linux (CVSS 9.8), gây panic/DoS hoặc nguy cơ thực thi mã từ xa.', ja: 'nfsd4_sequence() で最小サイズの応答バッファ（sl_data[] 長 0 のスロット）を割り当てたまま COMPOUND 応答をキャッシュへ書き込み、カーネル空間で slab-out-of-bounds 書き込み（CVSS 9.8）。カーネルパニック/DoS やリモートコード実行の恐れ。'}
    - sev: high
      label: {vi: 'Phạm vi', ja: '影響範囲'}
      text: {vi: 'Máy chủ Linux kernel ≥ 3.16 bật dịch vụ nfsd với NFSv4.1+. Debian 12 LTS đã phát hành bản vá (DLA-4927-1, linux-6.12 6.12.117-1~deb12u1); RHEL, Ubuntu và Amazon Linux đang chờ bản cập nhật chính thức.', ja: 'NFSv4.1+ を有効にして nfsd を稼働させている Linux カーネル 3.16 以降のサーバーが対象。Debian 12 LTS は修正済み（DLA-4927-1、linux-6.12 6.12.117-1~deb12u1）、RHEL・Ubuntu・Amazon Linux は修正待ち。'}
    - sev: med
      label: {vi: 'Tạm thời', ja: '暫定対策'}
      text: {vi: 'Giới hạn cổng NFS (TCP/UDP 2049) bằng firewall/security group chỉ cho các client tin cậy; tắt NFSv4.1/4.2 (hoặc dừng nfs-server nếu không dùng) trong lúc chờ bản vá kernel.', ja: 'ファイアウォール／セキュリティグループで NFS ポート（TCP/UDP 2049）を信頼済みクライアントのみに制限。カーネル更新まで NFSv4.1/4.2 を無効化（または不要なら nfs-server を停止）。'}
    - sev: low
      label: {vi: 'Triệt để', ja: '恒久対策'}
      text: {vi: 'Cập nhật kernel máy chủ NFS lên bản đã vá upstream 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 (hoặc bản distro như Debian DLA-4927-1) và reboot. Chưa có PoC công khai và chưa có trong CISA KEV (2026-11-23).', ja: 'NFS サーバーのカーネルを 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1（または Debian DLA-4927-1 等のディストリ修正版）へ更新し再起動。公開 PoC なし、CISA KEV 未掲載（2026-11-23 確認）。'}

