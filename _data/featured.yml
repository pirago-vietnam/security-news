      label: {vi: "Hiện trạng", ja: "現状"}
      text: {vi: "Tính đến 25-11-2026 (18:10 UTC), OSV/GitHub có 2 gói Maven độc hại (đều từ 2025): <code>io.github.leetcrunch:scribejava-core</code> (<code>MAL-2025-2552</code>, lấy OAuth ngày 15 hằng tháng) và <code>org.mvnpm:posthog-node</code> <code>4.18.1</code> (<code>MAL-2025-191470</code>, sâu Sha1-Hulud).", ja: "2026-11-25（18:10 UTC）時点で OSV/GitHub の悪性 Maven パッケージは2件（2025年発生）：<code>io.github.leetcrunch:scribejava-core</code>（<code>MAL-2025-2552</code>、毎月15日に OAuth 窃取）と <code>org.mvnpm:posthog-node</code> <code>4.18.1</code>（<code>MAL-2025-191470</code>、Sha1-Hulud）。"}
