  date: {vi: "Cập nhật 2026-11-25 · Final PIR + Memo \"Code Red\" (24/11) · Hạn SLA credit 31/12/2026", ja: "2026年11月25日更新 · 最終PIR＋社内「Code Red」報道（11/24） · SLA申請期限12/31"}
