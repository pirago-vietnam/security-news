# Các case nổi bật (sự cố lớn, phân tích lỗ hổng, runbook ứng phó). Thứ tự = thứ tự hiển thị.
# `path` tính từ gốc ngôn ngữ (vi: "/", ja: "/ja/").
- id: binance
  path: "featured/binance/binance_security_incident_report/"
  icon: "💸"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố Binance", ja: "Binance インシデント"}
  title: {vi: "Sự cố an ninh: Binance bị tấn công ~6,3 tỷ USD", ja: "セキュリティインシデント: Binance 約63億米ドルの不正流出"}
  date: {vi: "Cập nhật đến 2026-10-30 · Đang diễn biến · Vụ hack tiền mã hóa lớn nhất lịch sử (theo báo chí)", ja: "2026年10月30日 時点 · 進行中 · 報道によると暗号資産史上最大の被害"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Quy mô", ja: "規模"}
      text: {vi: "Binance ước tính khoảng 6,3 tỷ USD tài sản bị ảnh hưởng; đã dự phòng hơn 6,34 tỷ USD và cam kết bù đắp toàn bộ thiệt hại của người dùng.", ja: "Binance は約63億米ドルの資産が影響を受けたと推計。63.4億米ドル超を確保し、ユーザーの損失を全額補償すると表明。"}
    - sev: high
      label: {vi: "Nguyên nhân", ja: "原因"}
      text: {vi: "Sơ bộ: laptop của kỹ sư DevOps bị xâm nhập, dẫn tới container dịch vụ; sau đó phát hiện thêm điểm xâm nhập khác. Chưa có bằng chứng lộ private key ví.", ja: "暫定: DevOps エンジニアのノート PC が侵害されサービスコンテナへ到達。その後、別の侵入経路も判明。ウォレット秘密鍵の漏えいの証拠は未確認。"}
    - sev: med
      label: {vi: "Quy kết", ja: "攻撃者"}
      text: {vi: "TRM Labs quy cho nhóm TraderTraitor (Triều Tiên); Binance chưa xác nhận.", ja: "TRM Labs は北朝鮮の TraderTraitor によるものと分析。Binance は未確認。"}
    - sev: low
      label: {vi: "Ứng phó", ja: "対応"}
      text: {vi: "Đã đóng băng khoảng 3 tỷ USD (số liệu nguồn khác nhau), tạm dừng rút tiền để rà soát an ninh; sẽ công bố báo cáo đầy đủ sau.", ja: "約30億米ドルを凍結（情報源により数値が異なる）。出金を停止しセキュリティを見直し中。詳細レポートは後日公表予定。"}

- id: gmo
  path: "featured/gmo/gmo_onamae_security_incident_report/"
  icon: "🚨"
  accent: true
  badge: {sev: crit, text: "CRITICAL INCIDENT"}
  nav: {vi: "Sự cố GMO Onamae", ja: "GMOお名前.com インシデント"}
  title: {vi: "Sự cố an ninh: GMO Onamae Desktop Cloud", ja: "セキュリティインシデント: GMO お名前.com デスクトップクラウド"}
  date: {vi: "Cập nhật đến 2026-11-05 · 16 thông cáo, báo cáo IR & họp báo 02/11", ja: "2026年11月5日 時点 · 16件の公式発表・IRレポート & 11月2日の記者会見"}
  link: {vi: "Xem báo cáo sự cố chi tiết →", ja: "インシデント詳細レポートを見る →"}
  items:
    - sev: crit
      label: {vi: "Hạ tầng", ja: "インフラ"}
      text: {vi: "Chiếm quyền 26.739 máy chủ VPS Windows, rò rỉ thông tin đăng nhập MT4/MT5 tác động hơn 70 sàn chứng khoán & FX.", ja: "Windows VPSサーバー26,739台が乗っ取られ、MT4/MT5のログイン情報が漏えい。70以上の証券・FX会社に影響。"}
    - sev: high
      label: {vi: "Tống tiền", ja: "恐喝"}
      text: {vi: "Tin tặc đòi 50 triệu USD tiền chuộc; GMO kiên quyết từ chối và lập Quỹ Bounty 1 triệu USD treo thưởng truy bắt thủ phạm.", ja: "ハッカーが身代金5,000万米ドルを要求。GMOは断固として拒否し、犯人逮捕に向けた懸賞金として100万米ドルのバウンティ基金を設立。"}
    - sev: med
      label: {vi: "Phòng thủ", ja: "防御"}
      text: {vi: "Takedown sạch tên miền rò rỉ sau 15,5 giờ; kiến nghị Văn phòng Nội các Nhật Bản kích hoạt Luật Phòng thủ mạng chủ động (Active Cyber Defense).", ja: "漏えいしたドメインを15.5時間でテイクダウン。日本の内閣官房に対し、アクティブサイバーディフェンス法の発動を提言。"}
    - sev: low
      label: {vi: "Bồi thường", ja: "補償"}
      text: {vi: "Cam kết đền bù 100% thiệt hại giao dịch thực tế do lệnh trái phép + hỗ trợ thăm hỏi đặc biệt lên tới 3.000.000 JPY/khách hàng.", ja: "不正注文による実際の取引損失を100%補償するとともに、お客様1名あたり最大3,000,000 JPYの特別見舞金を支給。"}

- id: linux-cve-2026-98432
  path: "featured/linux-cve-2026-98432/analysis/"
  icon: "🐧"
  accent: true
  badge: {sev: high, text: "HIGH"}
  nav: {vi: "Linux kernel CVE-2026-98432", ja: "Linux カーネル CVE-2026-98432"}
  title: {vi: "Phân tích lỗ hổng: Linux kernel CVE-2026-98432", ja: "脆弱性分析: Linux カーネル CVE-2026-98432"}
  date: {vi: "Cập nhật đến 2026-11-05 · Bản tin AWS 2026-160-AWS xác nhận nguy cơ MPTCP · CVSS 9.8", ja: "2026年11月5日 時点 · AWS速報 2026-160-AWS で MPTCP リスク公式確認 · CVSS 9.8"}
  link: {vi: "Xem phân tích chi tiết →", ja: "詳細分析を見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Bản tin AWS 2026-160-AWS xác nhận bắt tay MPTCP nhận gói IPv4 TCP chứa IP options có thể dẫn tới rò rỉ dữ liệu hoặc thực thi mã. Chưa thấy khai thác thực tế diện rộng; một số repo GitHub tự nhận PoC chưa kiểm chứng.", ja: "AWS速報 2026-160-AWS により、IPオプション付きIPv4 TCPパケットによるMPTCPハンドシェイクで潜在的なコード実行やデータ漏えいが発生し得ることが公式確認。実際の悪用は未確認。"}
    - sev: high
      label: {vi: "Dễ bị tấn công", ja: "狙われやすい対象"}
      text: {vi: "Máy mở cổng TCP internet trực tiếp, dịch vụ bật MPTCP (Go 1.24+ bật mặc định trên Linux), host sau NLB TCP pass-through, node Kubernetes chưa vá, máy Ubuntu (chưa có USN, gói vá vẫn ở -proposed ngày 5/11).", ja: "TCPポート直接公開ホスト、MPTCP有効環境（Go 1.24+ でLinux上デフォルト有効）、NLB TCPパススルー配下、未修正Kubernetesノード、Ubuntu（11月5日時点でもUSN未公開、-proposed継続）。"}
    - sev: med
      label: {vi: "Hạ tầng Cloud & Edge", ja: "クラウド & エッジ"}
      text: {vi: "Hạ tầng AWS & Cloudflare: Edge/Ingress (ALB, CloudFront, Cloudflare Proxy/Tunnel) kết thúc TCP ở biên, che chắn backend (cần khóa Security Group về IP Cloudflare); Global Accelerator drop gói IP options ở data plane; DBs (RDS, Aurora) đã vá tầng host. AL2/AL2023 đã có bản vá, Ubuntu vẫn ở -proposed.", ja: "AWS & Cloudflare インフラ: Edge/Ingress（ALB、CloudFront、Cloudflare Proxy/Tunnel）はエッジでTCP終端しバックエンドを保護（Security Group制限必須）。Global Acceleratorはデータプレーンで破棄、マネージドDBはホスト層パッチ適用済み。AL2/AL2023修正済み、Ubuntuは -proposed。"}
    - sev: low
      label: {vi: "Xử lý", ja: "対処"}
      text: {vi: "Cập nhật kernel và reboot. Tạm thời: tắt MPTCP (net.mptcp.enabled=0, GODEBUG=multipathtcp=0 cho Go), lọc IP options bằng nftables/iptables u32 hoặc AWS Network Firewall.", ja: "カーネル更新と再起動が恒久対策。暫定措置: MPTCP無効化（net.mptcp.enabled=0、Go向けGODEBUG=multipathtcp=0）、nftables/iptables u32またはAWS Network FirewallによるIPオプション遮断。"}

- id: php2shell
  path: "featured/php-cve-2026-109618-109619/php2shell/"
  icon: "📘"
  accent: false
  badge: {sev: crit, text: "CRITICAL"}
  nav: {vi: "PHP CVE-2026-109618", ja: "PHP CVE-2026-109618"}
  title: {vi: "Hướng dẫn ứng phó: PHP CVE-2026-109618 / 109619 (PHP2Shell)", ja: "対応ガイド: PHP CVE-2026-109618 / 109619 (PHP2Shell)"}
  date: {vi: "Lỗ hổng RCE PHP · Tổng quan cho non-tech & hướng dẫn xử lý cho kỹ sư PiraGo", ja: "PHP の RCE 脆弱性 · 非エンジニア向け概要 & PiraGo エンジニア向け対応ガイド"}
  link: {vi: "Xem hướng dẫn đầy đủ →", ja: "ガイド全文を見る →"}
  items:
    - sev: crit
      label: {vi: "Xử lý", ja: "対応"}
      text: {vi: "RCE không cần xác thực trong lõi PHP (CVSS 9.2). Cập nhật ứng dụng không giúp được; phải vá PHP và restart.", ja: "PHP コアの認証不要 RCE（CVSS 9.2）。アプリ更新では解決せず、PHP の更新と再起動が必要。"}
    - sev: high
      label: {vi: "Dễ bị tấn công", ja: "狙われやすい対象"}
      text: {vi: "Apache mod_php, PHP-FPM lộ internet, PHP 8.1 trở xuống (EOL), image Docker cũ, hosting managed.", ja: "Apache mod_php、公開 PHP-FPM、PHP 8.1 以下（EOL）、古い Docker イメージ、マネージドホスティング。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Tắt upload progress, đặt memory_limit bằng php_admin_value, hạn chế multipart ở WAF/LB, thu hẹp truy cập.", ja: "upload progress の無効化、php_admin_value での memory_limit 設定、WAF/LB での multipart 制限、アクセス範囲の縮小。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng lên 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35, restart, build lại image; lên kế hoạch rời PHP 8.1 trở xuống.", ja: "8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 へ更新して再起動、イメージ再ビルド。PHP 8.1 以下からの移行を計画。"}
