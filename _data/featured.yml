  date: {vi: "Cập nhật đến 2026-11-20 · Ảnh hưởng 7.1.0–7.1.2, 7.0.0–7.0.8 và nhánh cũ · Đã vá ở 7.1.3 / 7.0.9", ja: "2026年11月20日 時点 · 7.1.0〜7.1.2、7.0.0〜7.0.8 と旧系統が対象 · 7.1.3 / 7.0.9 で修正済み"}
  link: {vi: "Xem phân tích & hướng dẫn →", ja: "分析・対策ガイドを見る →"}
  items:
    - sev: crit
      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "ELRequestMatcher chạy SpEL với reflection đầy đủ; nếu input ngoài bind vào thuộc tính kiểu này thì kẻ tấn công chưa xác thực có thể RCE (CVSS 3.1 9.8, CWE-94).", ja: "ELRequestMatcher が完全なリフレクション付きで SpEL を評価。外部入力がこの型のプロパティにバインドされると未認証で RCE の恐れ（CVSS 3.1 9.8、CWE-94）。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "Spring Security 7.1.0–7.1.2, 7.0.0–7.0.8, 6.5.0–6.5.12, 6.4.0–6.4.19, 5.8.0–5.8.28, ≤5.7.26.", ja: "Spring Security 7.1.0〜7.1.2、7.0.0〜7.0.8、6.5.0〜6.5.12、6.4.0〜6.4.19、5.8.0〜5.8.28、5.7.26 以前。"}
    - sev: med
      label: {vi: "Tạm thời", ja: "暫定対策"}
      text: {vi: "Advisory không nêu mitigation khác ngoài nâng cấp; trong lúc chờ, rà soát để không bind input ngoài vào ELRequestMatcher.", ja: "アドバイザリは更新以外の緩和策を示していない。更新までは外部入力が ELRequestMatcher にバインドされないか点検。"}
    - sev: low
      label: {vi: "Triệt để", ja: "恒久対策"}
      text: {vi: "Nâng cấp Spring Security lên 7.1.3 / 7.0.9 / 7.2.0 (hoặc Spring Boot 4.1.3 / 4.0.10 / 4.2.0); 6.5/6.4/5.8/5.7 chỉ có bản vá qua Enterprise Support. Chưa có trong CISA KEV (kiểm tra 2026-11-20).", ja: "Spring Security を 7.1.3 / 7.0.9 / 7.2.0（または Spring Boot 4.1.3 / 4.0.10 / 4.2.0）へ更新。6.5/6.4/5.8/5.7 は Enterprise Support のみ。CISA KEV 未掲載（2026-11-20 確認）。"}

