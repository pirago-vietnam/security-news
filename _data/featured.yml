      label: {vi: "Nguy cơ", ja: "リスク"}
      text: {vi: "Hỏng bộ nhớ trong HTTP/2 flow control của nginx, có thể dẫn đến RCE không cần xác thực (NetSPI: CVSS v4.0 9.2; nginx.org: \"major\").", ja: "nginx の HTTP/2 フロー制御におけるメモリ破壊で、認証不要の RCE に至る恐れ（NetSPI：CVSS v4.0 9.2、nginx.org：\"major\"）。"}
    - sev: high
      label: {vi: "Phạm vi", ja: "影響範囲"}
      text: {vi: "nginx OSS 1.9.5–1.31.8 có bật HTTP/2; NGINX Plus R34–R36, 37.0.0–37.2.0.1. Một số distro/image (Ubuntu, OpenResty) chưa có bản vá lúc đưa tin.", ja: "HTTP/2 を有効にした nginx OSS 1.9.5〜1.31.8、NGINX Plus R34〜R36・37.0.0〜37.2.0.1。報道時点で Ubuntu・OpenResty 等は未修正。"}
